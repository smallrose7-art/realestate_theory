4% 하락 시 B수요가 3% 감소(교차탄력성 +)하므로 대체재 관계이다.","오답. A·B 모두 발산형이므로 수렴형-수렴형은 틀리다."],"k":"거미집: 수요탄력성 < 공급탄력성 → 발산형 / |수요기울기| > |공급기울기| → 발산형. A가격 하락 시 B수요 감소 → 대체재.","note":"","t":"시장·입지·지대"},{"id":"2025-09","y":2025,"n":9,"q":"지대이론에 관한 설명으로 옳은 것은 모두 몇 개인가?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>튀넨(J.H. von Thünen)은 자연조건이 동일한 고립국을 가정하여 상업활동의 공간적 분포를 통한 토지이용을 설명한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>리카도(D. Ricardo)는 각 토지마다 다른 비옥도의 차이와 생산요소 투입에 따라 한계생산성이 증가하는 수확체감현상을 적용한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>마샬(A. Marshall)은 생산요소에 귀속되는 소득으로서 생산품의 총판매수익에서 가변비용을 제외한 잉여분을 절대지대라고 주장한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>알론소(W. Alonso)는 해당 토지의 지대를 지대입찰과정에서 토지이용자가 지불하고자 하는 최고 지불용의액으로서 초과이윤이 0(zero)이 되는 지대로 보았다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>해리스(C. Harris)와 울만(E. Ullman)은 토지이용자가 공간의 마찰비용으로 지대와 교통비를 함께 지불한다고 보았다.<\/span><\/div>","o":["1개","2개","3개","4개","5개"],"a":[0],"e":["정답(1개). 옳은 것은 알론소(입찰지대=초과이윤이 0이 되는 최고 지불용의액)뿐이다. 튀넨은 '상업'이 아닌 '농업'활동, 리카도는 한계생산성 '감소', 절대지대는 마르크스, 마찰비용이론은 헤이그의 이론이다.","오답. 옳은 지문은 하나뿐이다. 리카도 지문은 '수확체감'과 '한계생산성 증가'가 모순되어 틀렸다.","오답. 마샬은 준지대(일시적 고정생산요소에 귀속되는 소득)를 주장했고, 절대지대는 마르크스의 개념이므로 틀렸다.","오답. 해리스·울만은 다핵심이론이며, 지대와 교통비를 마찰비용으로 본 것은 헤이그이다.","오답. 5개 모두 옳지는 않다."],"k":"알론소만 옳음. 튀넨=농업활동, 리카도=수확체감(한계생산성 감소), 절대지대=마르크스, 마찰비용=헤이그.","note":"","t":"시장·입지·지대"},{"id":"2025-11","y":2025,"n":11,"q":"여과과정과 주거분리에 관한 설명으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["여과과정이란 시간의 흐름에 따라 특정 주택의 질적 변화와 외부성이 복합적으로 작용해 주택가치가 변하게 되면서 상이한 소득계층들의 전ㆍ출입이 진행되는 것을 말한다.","고소득층 주거지역에 인접한 저소득층 주거지역에서 주택개량을 통한 가치상승분이 주택개량 비용보다 작은 경우, 상향여과과정이 발생한다.","상향여과과정은 소득증가 등의 이유로 인해 저가주택의 수요가 감소할 때 나타날 수있다.","주거분리현상은 지리적으로 인접한 근린지역에서 뿐만 아니라 도시 전체에서도 발생할 수 있다.","침입과 계승의 현상으로 인해 주거입지의 변화가 나타날 수 있다."],"a":[1],"e":["옳음. 여과과정은 주택의 질적 변화와 외부성에 따라 주택가치가 변하면서 다른 소득계층이 전출입하는 현상이다.","틀림(정답). 고소득층 지역 인접 저소득층 지역에서 주택개량으로 인한 가치상승분이 개량비용보다 '클' 때 개량이 이루어져 상향여과가 발생한다. 작다면 개량 유인이 없다.","옳음. 소득증가 등으로 저가주택 수요가 감소하면 그 주택이 고소득층용으로 개조·전환되는 상향여과가 나타날 수 있다.","옳음. 주거분리는 소득계층별로 주거지역이 분리되는 현상으로 근린지역뿐 아니라 도시 전체 차원에서도 발생한다.","옳음. 침입(다른 이용·계층의 유입)과 계승(기존 이용의 대체)으로 주거입지가 변화할 수 있다."],"k":"상향여과: 개량으로 인한 가치상승분 > 개량비용일 때 발생(저소득 주거지가 고소득층으로 전환).","note":"","t":"시장·입지·지대"},{"id":"2025-12","y":2025,"n":12,"q":"어느 지역에 A점포와 B점포가 있다. A점포의 면적은 1,200㎡이고, B점포의 면적은 10,800㎡ 이다. A점포와 B점포 사이의 직선거리는 4km이다. 컨버스(P.Converse)의 분기점 모형에 기초할 때, A점포와 B점포의 상권 경계지점은 B점포로부터 얼마만큼 떨어진 지점인가? (단, A점포와 B점포는 동일직선상에 위치하며, 주어진 조건에 한함)","box":"","o":["1 km","2 km","3 km","4 km","5 km"],"a":[2],"e":["오답. 1km는 A점포로부터의 거리(D_A)이다. 4/(1+√(10,800/1,200)) = 4/(1+3) = 1km.","오답. 계산 결과와 맞지 않는다.","정답. A로부터 1km 지점이 경계이므로 B로부터는 4-1 = 3km이다. 면적이 큰 B 쪽 상권이 더 넓다.","오답. 4km는 두 점포 간 전체 거리이다.","오답. 두 점포 간 거리(4km)를 초과할 수 없다."],"k":"컨버스 분기점: D_A = D_AB / (1+√(P_B/P_A)).","note":"","t":"시장·입지·지대"},{"id":"2025-13","y":2025,"n":13,"q":"용도지역ㆍ지구ㆍ구역제에 관한 설명으로 옳지 않은 것은?","box":"","o":["용도지역ㆍ지구ㆍ구역제는 특정 토지를 용도지역 등으로 지정한 후 해당 토지를 이용목적에 맞게 적용하는 제도이다.","용적률ㆍ건폐율 등의 밀도규제와 특정행위의 허가ㆍ불허가 등의 행위규제로 구성되어 있다.","용도지역은 토지를 경제적ㆍ효율적으로 이용하고 공공복리의 증진을 도모하기 위하여 서로 중복되지 아니하게 도시ㆍ군관리계획으로 결정하는 지역을 말한다.","용도지구는 용도지역의 제한을 강화 또는 완화하여 적용하며, 경관ㆍ안전 등을 도모하기 위하여 서로 중복되지 아니하게 도시ㆍ군관리계획으로 결정하는 지역을 말한다.","용도구역은 용도지역 및 용도지구의 제한을 강화 또는 완화하여 적용하며, 시가지의 무질서한 확산방지, 계획적이고 단계적인 토지이용의 도모 등을 위하여 도시ㆍ군관리계획으로 결정하는 지역을 말한다."],"a":[3],"e":["옳음. 지역·지구·구역제는 토지를 용도별로 지정하고 그에 맞는 이용규제를 적용하는 제도이다.","옳음. 건폐율·용적률·높이 등의 밀도규제와 건축물 용도 허용 여부 등 행위규제로 구성된다.","옳음. 용도지역은 서로 중복되지 아니하게 도시·군관리계획으로 결정한다.","틀림(정답). 용도지구는 용도지역의 제한을 강화·완화하여 기능을 증진시키고 경관·안전 등을 도모하기 위한 것으로, '서로 중복되지 아니하게'라는 요건이 없다. 하나의 토지에 여러 지구가 중복 지정될 수 있다.","옳음. 용도구역은 용도지역·지구의 제한을 강화·완화하여 시가지 무질서한 확산 방지, 계획적·단계적 토지이용 등을 위해 결정한다(개발제한구역 등)."],"k":"용도지역 = 중복 지정 불가 / 용도지구 = 중복 지정 가능(용도지역의 제한을 강화·완화).","note":"","t":"정책·조세"},{"id":"2025-14","y":2025,"n":14,"q":"토지거래허가제도에 관한 설명으로 옳지 않은 것은?","box":"","o":["토지거래허가구역은 국토의 이용 및 관리에 관한 계획의 원활한 수립과 집행, 합리적 토지이용 등을 위하여 투기적인 거래가 성행하거나 지가가 급격히 상승하는 지역과 그러한 우려가 있는 지역에 지정할 수 있다.","토지거래허가구역은 5년 이내의 기간을 정하여 국토교통부장관 또는 특별시장ㆍ광역시장ㆍ 특별자치시장ㆍ도지사ㆍ특별자치도지사가 지정할 수 있다.","해당 구역에 일정한 면적을 초과하는 토지에 관한 소유권ㆍ지상권(소유권ㆍ지상권의 취득을 목적으로 하는 권리를 포함)을 이전하거나 설정하는 토지거래계약(예약을 포함)에 적용되며, 모든 증여 및 상속이 포함된다.","토지거래허가기준은 투기목적이 인정되는 일정한 경우를 제외하고는 토지거래를 허가하도록 하는 네거티브방식이다.","허가를 받지 아니하고 체결한 토지거래계약은 효력이 발생하지 아니한다."],"a":[2],"e":["옳음. 투기적 거래가 성행하거나 지가가 급격히 상승하는 지역과 그 우려가 있는 지역에 지정할 수 있다.","옳음. 5년 이내의 기간을 정하여 국토교통부장관 또는 시·도지사가 지정한다.","틀림(정답). 허가대상은 '대가를 받고' 소유권·지상권을 이전·설정하는 계약(예약 포함)이다. 대가가 없는 증여나 계약이 아닌 상속은 허가대상이 아니다.","옳음. 허가기준은 실수요 목적이 아닌 경우 등 불허가 사유에 해당하지 않으면 허가하는 네거티브 방식이다.","옳음. 허가 없이 체결한 계약은 효력이 발생하지 않는다(판례상 유동적 무효)."],"k":"토지거래허가 대상은 '대가를 받고' 소유권·지상권을 이전·설정하는 계약. 증여·상속은 대상 아님.","note":"","t":"정책·조세"},{"id":"2025-15","y":2025,"n":15,"q":"토지공개념에 관한 설명으로 옳지 않은 것은?","box":"","o":["토지의 공익성을 강조하는 개념으로 정부가 공공의 이익을 위하여 토지의 소유권을 제한할 수 있다는 인식을 반영하고 있다.","국가는 국민 모두의 생산 및 생활의 기반이 되는 국토의 효율적이고 균형있는 이용ㆍ개발과 보전을 위하여 법률이 정하는 바에 따라 제한과 의무를 과(課)할 수 있다는 근거를 반영하고 있다.","토지의 사유재산권을 부정하고 그 보유ㆍ이용ㆍ개발이 공공복리에 적합해야 한다고 보았다.","지가의 폭등과 개발이익환수의 미비로 인해 만연한 토지투기를 근절하고자 토지공개념을 도입 하였다.","개발부담금제도는 토지로부터 발생되는 개발이익을 환수하여 이를 적정하게 배분하여서 토지에 대한 투기를 방지하고 토지의 효율적인 이용을 촉진하기 위한 제도이다."],"a":[2],"e":["옳음. 토지의 공익성을 강조하여 공공의 이익을 위해 소유권을 제한할 수 있다는 인식이다.","옳음. 헌법 제122조(국토의 효율적·균형있는 이용을 위한 제한과 의무 부과)가 그 근거이다.","틀림(정답). 토지공개념은 사유재산권을 부정하는 것이 아니라 인정하면서 그 보유·이용·개발이 공공복리에 적합하도록 제한하자는 개념이다.","옳음. 지가 폭등과 개발이익 환수 미비로 인한 투기 근절을 위해 도입되었다(1989년 토지공개념 3법 등).","옳음. 개발부담금은 개발이익을 환수·배분하여 투기를 방지하고 효율적 토지이용을 촉진하는 제도이다."],"k":"토지공개념은 사유재산권을 '부정'하지 않는다. 인정하되 공공복리를 위해 제한하는 것.","note":"","t":"정책·조세"},{"id":"2025-16","y":2025,"n":16,"q":"다음은 일정기간 부동산자산과 금융자산의 투자 자료이다. 이 경우 합리적인 투자자가 가장 선호할 자산은? (단, 주어진 자료에 한함)","box":"<table class=\"bt\"><tr><td>자산구분<\/td><td>토지<\/td><td>아파트<\/td><td>오피스<\/td><td>채권<\/td><td>주식<\/td><\/tr><tr><td>수익률<\/td><td>0.82%<\/td><td>0.95%<\/td><td>2.23%<\/td><td>0.99%<\/td><td>1.90%<\/td><\/tr><tr><td>표준편차<\/td><td>1.17%<\/td><td>2.19%<\/td><td>1.05%<\/td><td>1.05%<\/td><td>8.11%<\/td><\/tr><\/table>","o":["오피스","채권","아파트","주식","토지"],"a":[0],"e":["정답. 오피스는 위험(1.05%)이 가장 낮은 수준이면서 수익률(2.23%)은 가장 높아 다른 모든 자산을 지배한다. 변이계수도 0.47로 최저이다.","오답. 채권은 오피스와 위험(1.05%)이 같지만 수익률(0.99%)이 낮아 오피스에 지배된다.","오답. 아파트는 오피스보다 위험(2.19%)은 높고 수익률(0.95%)은 낮아 지배당한다.","오답. 주식은 수익률(1.90%)이 오피스보다 낮으면서 위험(8.11%)은 훨씬 높아 지배당한다.","오답. 토지는 오피스보다 위험(1.17%)은 높고 수익률(0.82%)은 낮다."],"k":"평균-분산 지배원리: 같은 위험이면 높은 수익, 같은 수익이면 낮은 위험. 변이계수(σ/E)가 작을수록 유리.","note":"","t":"투자·금융"},{"id":"2025-17","y":2025,"n":17,"q":"부동산의 투자과정에서 수익률에 관한 설명으로 옳은 것은? (단, 주어진 조건에 한함)","box":"","o":["기대수익률은 본질적으로 사후수익률을 의미한다.","기대수익률은 시장이자율에 비례하고, 자산의 위험에도 비례한다.","기대수익률이 요구수익률보다 높으면, 대상부동산의 수요가 증가하여 요구수익률이 하락한다.","명목이자율로서 무위험이자율은 실질이자율에서 물가상승률을 차감한 값이다.","내부수익률이 요구수익률보다 큰 경우나 순현재가치가 1보다 큰 경우에는 투자하지 않는다."],"a":[1],"e":["틀림. 기대수익률은 투자 전 예상하는 사전(ex-ante)수익률이다. 사후수익률은 실현수익률이다.","정답. (요구·기대)수익률은 시장이자율(무위험률)이 높을수록, 위험이 클수록 높아진다는 의미로 출제된 옳은 지문이다.","틀림. 기대수익률 > 요구수익률이면 수요가 증가해 가격이 상승하고, 그 결과 하락하는 것은 '기대수익률'이다. 요구수익률은 투자자의 기회비용으로 변하지 않는다.","틀림. 명목이자율 ≈ 실질이자율 + 물가상승률이다(피셔효과). 차감이 아니라 가산이다.","틀림. IRR > 요구수익률이거나 NPV > 0이면 투자를 채택한다. 'NPV가 1보다 크다'는 기준 자체도 잘못되었다(1은 수익성지수 기준)."],"k":"요구수익률 = 무위험률 + 위험할증률. 기대수익률 > 요구수익률이면 수요↑→가격↑→기대수익률↓.","note":"","t":"투자·금융"},{"id":"2025-18","y":2025,"n":18,"q":"다음의 내용에 모두 해당하는 모기지(Mortgage)는?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>차입자가 금융기관에 지불하는 저당지불액이 증권 발행자를 통하여 투자자에게 그대로 전달되는 형태이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>기초자산인 모기지 풀(pool)의 현금흐름 및 저당권에 대한 소유권을 나타내는 지분형이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>금융기관이 유동화중개기관을 통해 발행할 수도 있고, 유동화중개기관을 통하지 않고 자체적으로 유동화전문회사(SPC)를 만들어 발행할 수도 있다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>모기지 소유자는 채무불이행위험, 조기상환위험, 금리위험을 부담할 수 있다.<\/span><\/div>","o":["저당이체증권(MPTS)","저당담보부채권(MBB)","지불이체채권(MPTB)","다계층증권(CMO)","상업용저당증권(CMBS)"],"a":[0],"e":["정답. MPTS는 저당풀의 소유권과 원리금수취권을 모두 투자자에게 이전하는 지분형 MBS로, 원리금이 그대로 투자자에게 이체(pass-through)된다.","오답. MBB는 발행자가 저당풀을 담보로 발행하는 채권형으로, 모든 위험을 발행자가 부담한다.","오답. MPTB는 소유권은 발행자, 원리금수취권은 투자자에게 있는 혼합형이다.","오답. CMO는 만기·이자율이 다른 여러 트랜치로 나눈 다계층 혼합형 증권이다.","오답. CMBS는 상업용 부동산 저당대출을 기초자산으로 한 증권으로, 지문의 지분형 구조 설명과 일치하지 않는다."],"k":"MPTS = 지분형, 원리금수취권·소유권 모두 투자자 이전 → 채무불이행·조기상환·금리위험 모두 투자자 부담.","note":"","t":"투자·금융"},{"id":"2025-19","y":2025,"n":19,"q":"부동산금융에 관한 설명으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["부동산금융은 부동산의 매입이나 매각, 개발 등과 관련한 자금이나 신용을 조달하거나 제공하는 것을 말한다.","부동산이 가지고 있는 고유 특성으로 인하여 금융의 필요성이 중요해지고 있다.","부동산 신디케이션(syndication)은 부동산개발사업을 공동으로 수행하기 위해 일반 투자자들의 자금과 부동산개발업자의 전문성이 결합된 투자자 집단을 말한다.","메자닌금융(mezzanine financing)은 부채방식과 지분방식의 특징을 갖고 있는 중간적 성격의 자금조달방법이다.","랩어라운드(wrap-around)대출은 기존대출을 상환하고 신규대출을 별도로 제공하는 방식이다."],"a":[4],"e":["옳음. 부동산금융은 부동산의 매입·매각·개발 등과 관련한 자금·신용의 조달과 제공이다.","옳음. 부동산은 고가성 등으로 자기자본만으로 취득이 어려워 금융의 필요성이 크다.","옳음. 신디케이션은 일반투자자의 자금과 개발업자의 전문성이 결합된 투자자 집단(주로 합자회사 형태)이다.","옳음. 메자닌금융은 후순위대출·전환사채·신주인수권부사채·상환우선주 등 부채와 지분의 중간적 성격이다.","틀림(정답). 랩어라운드 대출은 기존 대출을 상환하지 않고 그대로 유지하면서, 기존 대출을 포괄(wrap)하는 형태로 추가 자금을 제공하는 방식이다."],"k":"랩어라운드 대출: 기존 대출을 상환하지 않고 그대로 둔 채 기존 잔액+추가금액을 포괄하는 2차 대출.","note":"","t":"투자·금융"},{"id":"2025-20","y":2025,"n":20,"q":"대출상환에 관한 설명으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["대출조건이 동일할 경우, 대출채권의 듀레이션(duration)은 원리금균등분할상환, 원금균등분할상환, 점증상환, 만기일시상환의 순으로 짧다.","원리금균등분할상환의 경우, 매월 원리금을 균등하게 상환하기 때문에 원리금에서 원금과 이자가 차지하는 비중은 상환시기에 따라 다르다.","점증상환에서는 초기에 원리금의 납입액이 이자지급액에 미치지 못할 수 있는데, 이 경우 미상환 이자가 원금에 가산되어 부(-)의 상환이 일어날 수 있다.","만기일시상환은 대출기간 동안 매월 이자만 상환하다가 만기에 일시로 원금을 상환하는 방식이며, 대출만기 시 원금의 일부를 상환하게 한 뒤 대출만기를 연장해주기도 한다.","원금균등분할상환의 경우, 매월 상환하는 원리금 상환 부담은 대출 초기에는 많지만 상환금액은 점차 감소한다."],"a":[0],"e":["틀림(정답). 원금이 빨리 상환될수록 듀레이션이 짧으므로 원금균등분할 → 원리금균등분할 → 점증 → 만기일시 순으로 짧다. 원리금균등이 가장 짧다는 지문은 틀렸다.","옳음. 원리금균등은 매기 상환액은 같지만 초기에는 이자 비중이, 후기에는 원금 비중이 크다.","옳음. 점증상환은 초기 납입액이 이자에도 못 미치면 미상환 이자가 원금에 가산되는 부(-)의 상환이 발생할 수 있다.","옳음. 만기일시상환은 이자만 내다가 만기에 원금을 일시 상환하며, 실무상 일부 상환 후 만기연장도 한다.","옳음. 원금균등은 원금은 일정하고 잔액에 대한 이자가 줄어 원리금이 초기에 많고 점차 감소한다."],"k":"듀레이션(원금 회수 가중평균기간): 원금균등 < 원리금균등 < 점증 < 만기일시 순으로 길다.","note":"","t":"투자·금융"},{"id":"2025-21","y":2025,"n":21,"q":"A는 승계가능한 대출로 주택을 구입하고자 한다. 다음과 같은 조건으로 기존 주택 저당대출을 승계받을 때, 이 승계권의 가치는 얼마인가? (단, 주어진 자료에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>기존 주택저당대출 - 현재 대출잔액 : 3억원 - 원리금균등분할상환방식 : 만기 20년, 대출금리 5%, 고정금리대출<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>신규 주택저당대출 - 대출금액 : 3억원 - 원리금균등분할상환방식 : 만기 20년, 대출금리 7%, 고정금리대출<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>월 기준 연금현가계수 - (5%, 20년) : 150 - (7%, 20년) : 125<\/span><\/div>","o":["4,375만원","5,000만원","5,625만원","6,250만원","6,875만원"],"a":[1],"e":["오답. 계산 결과와 다르다.","정답. 기존 월DS = 3억/150 = 200만원, 신규 월DS = 3억/125 = 240만원. 월 40만원 절감 × 현재 시장금리(7%) 연금현가계수 125 = 5,000만원.","오답. 계산 결과와 다르다. 월 절감액 40만원에 7% 연금현가계수 125를 곱해야 한다.","오답. 계산 결과와 다르다. 할인에는 기존 계약금리(5%)가 아니라 현재 시장금리(7%)의 연금현가계수를 써야 한다.","오답. 계산 결과와 다르다."],"k":"대출승계권 가치 = (신규 월상환액 − 기존 월상환액) × 시장금리 기준 연금현가계수.","note":"","t":"투자·금융"},{"id":"2025-22","y":2025,"n":22,"q":"한국주택금융공사법령상 주택금융신용보증기금의 용도로 명시하지 않은 것은?","box":"","o":["신용보증채무의 이행","차입금의 원리금 상환","금융기관에의 예치(預置)","기금의 육성을 위한 연구ㆍ개발","기금의 조성ㆍ운용 및 관리를 위한 경비"],"a":[2],"e":["옳음(명시됨). 신용보증채무의 이행은 기금의 핵심 용도이다.","옳음(명시됨). 기금이 차입한 자금의 원리금 상환에 사용된다.","정답(명시되지 않음). 금융기관 예치는 기금 여유자금의 '운용 방법'이지 법령상 기금의 '용도'로 열거된 것이 아니다.","옳음(명시됨). 기금의 육성을 위한 연구·개발이 용도로 규정되어 있다.","옳음(명시됨). 기금의 조성·운용 및 관리를 위한 경비가 용도로 규정되어 있다."],"k":"주택금융신용보증기금 용도: 신용보증채무 이행, 차입금 원리금 상환, 기금 조성·운용·관리 경비, 기금 육성 연구·개발 등. '예치'는 여유자금 운용방법이지 용도가 아님.","note":"","t":"투자·금융"},{"id":"2025-23","y":2025,"n":23,"q":"부동산마케팅활동에 관한 설명으로 옳지 않은 것은?","box":"","o":["부동산마케팅은 소비자들이 원하는 필요와 욕구를 반영하여 시장을 세분화하고 이를 바탕으로 부동산의 제품화, 가격산정, 입지선정 및 촉진활동 등 마케팅 전략을 세워서 부동산을 매매하고 임대차하는 일련의 과정을 말한다.","시장세분화란 전체 시장을 일정한 기준에 의해 동질적인 세분시장으로 구분하는 과정을 말한다.","표적시장이란 마케팅 환경변화에 대응하여 경쟁사와의 관계에서 자사가 보유한 역량과 자원으로 최대한의 시장성과를 얻을 수 있는 최적의 시장을 말한다.","포지셔닝이란 경쟁우위 달성을 위해 경쟁제품과 다르게 인식되도록 마케팅믹스를 사용하여 고객의 마음속에 제품의 위치를 심어주는 과정을 말한다.","AIDA 원리는 고객의 구매의사 결정단계를 심리적 발전단계에 맞춘 것으로 행동 (Action), 관심 (Interest), 욕망(Desire), 주목(Attention)의 순서를 거친다."],"a":[4],"e":["옳음. 부동산마케팅은 소비자 욕구를 반영해 STP와 4P 전략을 세워 매매·임대차하는 과정이다.","옳음. 시장세분화는 전체시장을 일정 기준으로 동질적인 하위시장으로 나누는 것이다.","옳음. 표적시장은 세분시장 중 자사 역량으로 최대 성과를 얻을 수 있는 시장이다.","옳음. 포지셔닝은 고객의 마음속에 경쟁제품과 차별화된 위치를 심는 과정이다.","틀림(정답). AIDA는 주목(A) → 관심(I) → 욕망(D) → 행동(A)의 순서이다. 지문은 순서가 거꾸로이다."],"k":"AIDA = Attention(주목) → Interest(관심) → Desire(욕망) → Action(행동).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2025-24","y":2025,"n":24,"q":"도시 및 부동산개발에 관한 설명으로 옳지 않은 것은?","box":"","o":["「도시 및 주거환경정비법」상 “재개발사업”이란 정비기반시설이 열악하고 노후ㆍ불량 건축물이 밀집한 지역에서 주거환경을 개선하거나 상업지역ㆍ공업지역 등에서 도시기 능의 회복 및 상권활성화 등을 위하여 도시환경을 개선하기 위한 사업을 말한다.","「개발이익 환수에 관한 법률」상 “개발이익”이란 개발사업의 시행이나 토지이용계획의 변경, 그 밖에 사회적ㆍ경제적 요인에 따라 정상지가(正常地價)상승분을 초과하여 개발사업을 시행하는 자나 토지 점유자에게 귀속되는 토지 가액의 증가분을 말한다.","「국토의 계획 및 이용에 관한 법률」상 “공동구”란 전기ㆍ가스ㆍ수도 등의 공급설비, 통신시설, 하수도시설 등 지하매설물을 공동 수용함으로써 미관의 개선, 도로구조의 보전 및 교통의 원활한 소통을 위하여 지하에 설치하는 시설물을 말한다.","「부동산개발업의 관리 및 육성에 관한 법률」상 “부동산개발업”이란 타인에게 공급할 목적으로 부동산개발을 수행하는 업을 말한다.","「도시개발법」상 “도시개발사업”이란 도시개발구역에서 주거, 상업, 산업, 유통, 정보통신, 생태, 문화, 보건 및 복지 등의 기능이 있는 단지 또는 시가지를 조성하기 위하여 시행하는 사업을 말한다."],"a":[1],"e":["옳음. 도시정비법상 재개발사업의 정의이다.","틀림(정답). 개발이익은 개발사업을 시행하는 자나 토지 '소유자'에게 귀속되는 토지가액 증가분이다. '점유자'가 아니다.","옳음. 국토계획법상 공동구의 정의이다.","옳음. 부동산개발업은 타인에게 공급할 목적으로 부동산개발을 수행하는 업이다.","옳음. 도시개발법상 도시개발사업의 정의이다."],"k":"개발이익: 정상지가상승분을 초과하여 사업시행자나 토지 '소유자'에게 귀속되는 토지가액 증가분.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2025-25","y":2025,"n":25,"q":"국토의 계획 및 이용에 관한 법령상 기반시설의 유형으로 옳지 않은 것은?","box":"","o":["공공ㆍ문화체육시설: 광장ㆍ공원ㆍ녹지ㆍ유원지ㆍ공공공지","유통ㆍ공급시설: 유통업무설비, 수도ㆍ전기ㆍ가스ㆍ열공급설비, 방송ㆍ통신시설, 공동구ㆍ시장, 유류저장 및 송유설비","보건위생시설: 장사시설ㆍ도축장ㆍ종합의료시설","방재시설: 하천ㆍ유수지ㆍ저수지ㆍ방화설비ㆍ방풍설비ㆍ방수설비ㆍ사방설비ㆍ방조설비","교통시설: 도로ㆍ철도ㆍ항만ㆍ공항ㆍ주차장ㆍ자동차정류장ㆍ궤도ㆍ차량 검사 및 면허 시설"],"a":[0],"e":["틀림(정답). 광장·공원·녹지·유원지·공공공지는 '공간시설'이다. 공공·문화체육시설은 학교·공공청사·문화시설·공공필요성이 인정되는 체육시설·연구시설·사회복지시설·공공직업훈련시설·청소년수련시설이다.","옳음. 유통·공급시설의 열거로 맞다.","옳음. 보건위생시설은 장사시설·도축장·종합의료시설이다.","옳음. 방재시설은 하천·유수지·저수지·방화·방풍·방수·사방·방조설비이다.","옳음. 교통시설의 열거로 맞다."],"k":"광장·공원·녹지·유원지·공공공지 = '공간시설'. 공공·문화체육시설 = 학교·공공청사·문화시설·체육시설·연구시설·사회복지시설 등.","note":"","t":"정책·조세"},{"id":"2025-26","y":2025,"n":26,"q":"국토의 계획 및 이용에 관한 법률상 다음에 해당하는 계획은?","box":"<div class=\"bp\">토지의 이용 및 건축물이나 그 밖의 시설의 용도ㆍ건폐율ㆍ용적률ㆍ높이 등을 완화하는 용도구역의 효율적이고 계획적인 관리를 위하여 수립하는 계획을 말한다.<\/div>","o":["성장관리계획","도시혁신계획","복합용도계획","지구단위계획","공간재구조화계획"],"a":[4],"e":["오답. 성장관리계획은 성장관리계획구역에서 난개발 방지와 계획적 개발을 위해 수립하는 계획이다.","오답. 도시혁신계획은 도시혁신구역에서 창의적·혁신적 도시공간 조성을 위해 토지이용·건축물 용도 등의 제한에 관한 사항을 정하는 계획이다.","오답. 복합용도계획은 복합용도구역에서 주거·상업·산업 등 복합적 토지이용을 위해 수립하는 계획이다.","오답. 지구단위계획은 도시·군계획 수립 대상지역의 일부에 대해 토지이용을 합리화하고 기능·미관을 증진하기 위한 계획이다.","정답. 공간재구조화계획은 토지이용 및 건축물 용도·건폐율·용적률·높이 등을 완화하는 용도구역의 효율적·계획적 관리를 위해 수립하는 계획이다."],"k":"공간재구조화계획: 용도구역(도시혁신구역·복합용도구역·입체복합구역)의 효율적·계획적 관리를 위한 계획(2024 신설).","note":"","t":"정책·조세"},{"id":"2025-27","y":2025,"n":27,"q":"다음에 모두 해당되는 부동산관리방식은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>소유주나 기업의 부를 극대화시키기 위하여 부동산의 가치를 증진시킬 수있는 다양한 방법을 모색하는 적극적인 관리<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>위험분산 차원에서 부동산의 유형과 지역의 혼합, 보유부동산의 개량 및 매각, 개별 부동산의 특성을 고려한 보유기간산정, 레버리지 활용 등<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>포트폴리오(portfolio) 관점에서의 종합적인 관리<\/span><\/div>","o":["신탁관리","시설관리","자산관리","수탁관리","직접관리"],"a":[2],"e":["오답. 신탁관리는 소유자가 신탁회사에 소유권을 이전하고 관리를 맡기는 방식이다.","오답. 시설관리(FM)는 설비 운전·보수 등 소유자 요구에 단순 부응하는 소극적 관리이다.","정답. 자산관리는 포트폴리오 관점에서 부의 극대화를 위해 매입·매각, 리모델링, 보유기간, 레버리지 등을 결정하는 적극적 관리이다.","오답. 수탁관리는 위탁관리와 같은 의미로, 관리 주체에 따른 분류일 뿐 지문의 내용과 다르다.","오답. 직접관리(자가관리)는 소유자가 직접 관리하는 방식이다."],"k":"자산관리(AM): 소유자 부의 극대화, 포트폴리오 관점, 매입·매각·재투자 결정 등 적극적 관리.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2025-28","y":2025,"n":28,"q":"공인중개사법상 중개사무소의 개설등록을 취소하여야 하거나 취소할 수 있는 경우에 해당하지 않는 것은?","box":"","o":["개인인 개업공인중개사가 사망하거나 개업공인중개사인 법인이 해산한 경우","거짓이나 그 밖의 부정한 방법으로 중개사무소의 개설등록을 한 경우","업무정지기간 중에 중개업무를 하거나 자격정지처분을 받은 소속공인중개사로 하여금 자격정지기간 중에 중개업무를 하게 한 경우","천막 그 밖에 이동이 용이한 임시 중개시설물을 설치하여서는 아니된다는 규정을 위반하여 임시 중개시설물을 설치한 경우","최근 1년 이내에 이 법에 의하여 2회 이상 업무정지 또는 과태료의 처분을 받고 다시 과태료의 처분에 해당하는 행위를 한 경우"],"a":[4],"e":["해당함(절대적 취소). 개인 개업공인중개사의 사망 또는 법인 해산 시 등록을 취소하여야 한다.","해당함(절대적 취소). 부정한 방법으로 개설등록한 경우이다.","해당함(절대적 취소). 업무정지기간 중 중개업무를 하거나, 자격정지 중인 소속공인중개사에게 업무를 하게 한 경우이다.","해당함(임의적 취소). 천막 등 이동이 용이한 임시 중개시설물 설치는 등록을 취소할 수 있는 사유이다.","해당하지 않음(정답). 임의적 취소사유는 최근 1년 이내 '3회 이상' 업무정지 또는 과태료 처분을 받고 다시 해당 행위를 한 경우이다. 2회는 요건 미달이다."],"k":"임의적 등록취소: 최근 1년 이내 '3회' 이상 업무정지·과태료 처분 + 다시 업무정지·과태료 해당 행위.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2025-29","y":2025,"n":29,"q":"공인중개사의 매수신청대리인 등록 등에 관한 규칙상 매수신청대리의 대상물에 해당하지 않는 것은?","box":"","o":["토지","건물 그 밖의 토지의 정착물","「입목에 관한 법률」에 따른 입목","「건설기계관리법」에 따른 건설기계","「공장 및 광업재단 저당법」에 따른 공장재단, 광업재단"],"a":[3],"e":["대상임. 토지는 매수신청대리 대상물이다.","대상임. 건물 그 밖의 토지의 정착물은 대상물이다.","대상임. 입목에 관한 법률에 따른 입목은 대상물이다.","대상 아님(정답). 건설기계는 동산(준부동산)으로 매수신청대리 대상물에 포함되지 않는다.","대상임. 공장재단·광업재단은 대상물이다."],"k":"매수신청대리 대상물: 토지, 건물 기타 정착물, 입목, 공장재단·광업재단. (건설기계·자동차·선박 제외)","note":"","t":"개발·관리·중개·권리분석"},{"id":"2025-30","y":2025,"n":30,"q":"부동산조세에 관한 설명으로 옳지 않은 것은?","box":"","o":["취득세는 취득관련 조세로 지방세이다.","재산세는 보유관련 조세로 국세이다.","종합부동산세는 보유관련 조세로 국세이다.","상속세는 취득관련 조세로 국세이다.","양도소득세는 처분관련 조세로 국세이다."],"a":[1],"e":["옳음. 취득세는 취득단계의 지방세이다.","틀림(정답). 재산세는 보유단계 과세이지만 시·군·구세인 '지방세'이다.","옳음. 종합부동산세는 보유단계의 국세이다.","옳음. 상속세는 취득단계의 국세이다(증여세도 같음).","옳음. 양도소득세는 처분단계의 국세이다."],"k":"재산세 = 보유단계 '지방세'. 종합부동산세 = 보유단계 '국세'.","note":"","t":"정책·조세"},{"id":"2025-31","y":2025,"n":31,"q":"조세의 분류에 관한 설명으로 옳은 것은?","box":"","o":["조세부담의 전가여부에 따라 보통세와 목적세로 분류한다.","과세권자에 따라 직접세와 간접세로 분류한다.","납세자의 담세능력 고려여부에 따라 인세와 물세로 분류한다.","과세표준의 계산단위에 따라 독립세와 부가세로 분류한다.","독립된 세원유무에 따라 종가세와 종량세로 분류한다."],"a":[2],"e":["틀림. 조세부담의 전가 여부에 따른 분류는 직접세와 간접세이다. 보통세·목적세는 세수 용도의 특정 여부에 따른 분류이다.","틀림. 과세권자(과세주체)에 따른 분류는 국세와 지방세이다.","정답. 납세자의 인적 사정(담세능력)을 고려하면 인세(소득세 등), 물건 자체에 과세하면 물세(재산세 등)이다.","틀림. 과세표준의 계산단위(가액/수량)에 따른 분류는 종가세와 종량세이다.","틀림. 독립된 세원의 유무에 따른 분류는 독립세와 부가세(附加稅)이다."],"k":"전가 여부→직접세/간접세, 과세주체→국세/지방세, 담세능력 고려→인세/물세, 과세표준 단위→종가세/종량세, 세원 독립성→독립세/부가세, 용도 특정→보통세/목적세.","note":"","t":"정책·조세"},{"id":"2025-32","y":2025,"n":32,"q":"취득세 부과 대상물건의 취득은 승계취득ㆍ원시취득ㆍ간주취득으로 분류하는 바, 원시취득에 해당하지 않는 것은?","box":"","o":["간척에 의한 토지의 취득","증축에 의한 건축물의 취득","제조에 의한 항공기의 취득","종류변경에 의한 차량의 취득","공유수면매립에 의한 토지의 취득"],"a":[3],"e":["원시취득. 간척으로 새로 토지가 생기는 것은 원시취득이다.","원시취득. 건축(증축 포함)에 의한 건축물 취득은 원시취득이다.","원시취득. 제조에 의한 항공기 취득은 원시취득이다.","원시취득 아님(정답). 차량의 종류변경으로 가액이 증가하는 경우는 '간주취득'이다.","원시취득. 공유수면매립에 의한 토지 취득은 원시취득이다."],"k":"원시취득: 건축(신축·증축 등), 공유수면 매립·간척, 차량·항공기·선박 제조. 간주취득: 지목변경, 차량 종류변경, 건축물 개수, 과점주주.","note":"","t":"정책·조세"},{"id":"2025-33","y":2025,"n":33,"q":"부동산경매에서 말소기준권리에 해당하지 않는 것은?","box":"","o":["압류","가압류","전세권","저당권","지상권"],"a":[4],"e":["해당함. 압류는 말소기준권리이다.","해당함. 가압류는 말소기준권리이다.","해당함. 건물 전부에 대한 선순위 전세권자가 배당요구하거나 경매신청한 경우 말소기준권리가 된다.","해당함. (근)저당권은 대표적인 말소기준권리이다.","해당하지 않음(정답). 지상권은 용익물권으로 말소기준권리가 아니며, 말소기준권리보다 선순위이면 매수인에게 인수된다."],"k":"말소기준권리: (근)저당권, (가)압류, 담보가등기, 경매개시결정등기, 일정 요건의 전세권. 지상권·지역권·가처분은 아님.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2025-34","y":2025,"n":34,"q":"부동산권리분석활동을 위한 자료의 조사ㆍ확인 및 분석에 관한 설명으로 옳지 않은 것은?","box":"","o":["「공간정보의 구축 및 관리 등에 관한 법령」상 지적도에 기재된 분석대상 부동산의 지목이 ‘공’ 으로 표기되어 있어, 지목을 공원으로 판단하였다.","구거는 용수(用水) 또는 배수(排水)를 위하여 일정한 형태를 갖춘 인공적인 수로ㆍ둑 및 그 부속시설물의 부지와 자연의 유수(流水)가 있거나 있을 것으로 예상되는 소규모 수로부지로 지적도에는 ‘구’ 로 표기한다.","유지(溜池)는 자연의 유수(流水)가 있거나 있을 것으로 예상되는 토지로 지적도에는 ‘유’ 로 표기한다.","건물의 소재지, 구조, 용도 등의 사실관계를 건축물대장을 통하여 확인ㆍ판단하였다.","권리분석보고서에는 대상부동산 및 의뢰인, 권리분석의 목적, 판단결과의 표시 및 이유, 권리분석의 방법 및 성격, 수집한 자료의 목록 및 면책사항 등이 포함된다."],"a":[2],"e":["옳음. 공원의 부호는 '공'이다(공장용지는 '장', 주차장은 '차').","옳음. 구거의 정의와 부호 '구'에 대한 설명이다.","틀림(정답). 지문은 '하천'(부호 '천')의 정의이다. 유지(溜池)는 물이 고이거나 상시 저장되는 댐·저수지·소류지·호수·연못 등의 토지로 부호는 '유'이다.","옳음. 건물의 소재지·구조·용도 등 물적 사항은 건축물대장으로 확인한다.","옳음. 권리분석보고서의 일반적인 기재사항이다."],"k":"지목 부호: 공원='공', 구거='구', 유지='유', 하천='천'. 자연의 유수가 있는 토지는 '하천'.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2025-35","y":2025,"n":35,"q":"공작기계 1대를 취득원가 8,000,000원에 2년 전에 구입하였다. 현재 기준시점의 재조달원가는 10,000,000원이다. 원가법으로 평가한 현재 가액은? (단, 감가수정은 정률법을 적용하되, 연간 감가율은 0.2이고, 내용연수는 8년이고, 잔존가치는 없으며, 주어진 조건에 한함)","box":"","o":["5,120,000원","6,400,000원","7,500,000원","8,000,000원","10,000,000원"],"a":[1],"e":["오답. 10,000,000 × 0.8³ = 5,120,000원으로, 경과연수를 3년으로 잘못 적용한 값이다.","정답. 10,000,000 × (1−0.2)² = 6,400,000원. 원가법은 취득원가가 아닌 기준시점의 재조달원가를 기준으로 한다.","오답. 정액법(10,000,000 × (1 − 2/8)) 결과로 문제 조건(정률법)과 다르다.","오답. 취득원가를 그대로 쓴 값이다. 원가법은 재조달원가에서 감가수정한다.","오답. 재조달원가에서 감가수정을 하지 않은 값이다."],"k":"정률법: 적산가액 = 재조달원가 × (1 − 감가율)^경과연수.","note":"","t":"감정평가"},{"id":"2025-36","y":2025,"n":36,"q":"다음은 2025년 공시된 표준지공시지가를 열람한 내역을 표로 나타낸 것이다. 이에 관한 설명으로 옳지 않은 것은?","box":"<table class=\"bt\"><tr><td>일련번호<\/td><td>2001<\/td><td>2002<\/td><td>2003<\/td><\/tr><tr><td>소재지<\/td><td>ㅇㅇ리 20<\/td><td>ㅇㅇ리 90<\/td><td>ㅇㅇ리 125<\/td><\/tr><tr><td>면적(㎡)<\/td><td>576.0<\/td><td>2,645.0<\/td><td>470.0 일단지<\/td><\/tr><tr><td>지목<\/td><td>대<\/td><td>전<\/td><td>전<\/td><\/tr><tr><td>공시지가<\/td><td>92,800<\/td><td>31,000<\/td><td>81,100<\/td><\/tr><tr><td>(원/㎡)<\/td><td>평가기초자료<\/td><td>평가기초자료<\/td><td>평가기초자료<\/td><\/tr><tr><td>지리적 위치<\/td><td>ㅇㅇ 마을내<\/td><td>초등학교 북측근거리<\/td><td>ㅇㅇㅇ 내<\/td><\/tr><tr><td>이용상황<\/td><td>단독주택<\/td><td>전<\/td><td>단독주택<\/td><\/tr><tr><td>용도지역<\/td><td>계획관리<\/td><td>농림지역<\/td><td>계획관리<\/td><\/tr><tr><td>주위환경<\/td><td>순수 농촌지대<\/td><td>지방도주변 농경지대<\/td><td>농어촌지대<\/td><\/tr><tr><td>도로접면<\/td><td>세로 (가)<\/td><td>맹지<\/td><td>세로 (가)<\/td><\/tr><tr><td>형상지세<\/td><td>부정형 평지<\/td><td>사다리 평지<\/td><td>사다리 완경사<\/td><\/tr><\/table>","o":["일련번호 2001과 2003은 승용차의 통행이 가능하다.","일련번호 2001과 2003의 표준지공시지가는 나지상태를 상정한 것이다.","매년 1월 1일의 표준지공시지가는 당해 필지의 개별공시지가와 다른 경우가 있다.","일련번호 2003에서 ‘일단지’ 라 함은 지상의 단독주택이 다른 필지와도 연계되어 있음을 의미한다.","표준지공시지가는 구체화된 개발이익이 반영된 것이다."],"a":[2],"e":["옳음. 도로접면 '세로(가)'는 폭 8m 미만이지만 자동차 통행이 가능한 도로에 접한 토지이다.","옳음. 표준지공시지가는 지상 건물이 있더라도 나지상태를 상정하여 평가한다.","틀림(정답). 표준지로 선정된 토지는 개별공시지가를 별도로 결정하지 않고 표준지공시지가를 개별공시지가로 보므로 두 가격은 일치한다.","옳음. '일단지'는 용도상 불가분 관계에 있는 2필지 이상이 일체로 이용되고 있음을 의미한다.","옳음. 표준지공시지가는 공시기준일 현재 구체화된 개발이익은 반영하여 평가한다."],"k":"표준지는 개별공시지가를 따로 결정·공시하지 않고 표준지공시지가를 개별공시지가로 본다 → 항상 일치.","note":"","t":"감정평가"},{"id":"2025-37","y":2025,"n":37,"q":"다음은 토지와 건물로 구성된 대상부동산을 감정평가하기 위하여 수집한 자료이다. 유사한 성격의 자료만으로 묶인 것은?","box":"<div class=\"chips\"><span class=\"chip\"   app.innerHTML=`
  <h1>감정평가사 부동산학원론<br>기출 데일리 20</h1>
  <p class="lead">2020~2025년(제31~36회) 기출 ${total}문제를 하루 20문제씩 ${DB.days.length}일치로 나눴습니다. 각 일차의 문제는 서로 겹치지 않고, 답을 고르면 다섯 개 선지 모두의 해설이 열립니다.</p>
  <div class="stats"><div><b>${solved}/${total}</b>푼 문제</div><div><b>${solved?Math.round(correct/solved*100):0}%</b>정답률</div><div><b>${wrongIds.length}</b>오답노트</div></div>
  <div class="grid">${DB.days.map((d,i)=>{
    const done=d.filter(k=>st.ans[DB.q[k].id]!==undefined).length;
    const ok=d.filter(k=>{const q=DB.q[k];return st.ans[q.id]!==undefined&&isRight(q,st.ans[q.id])}).length;
    return `<button class="day ${done===d.length?'done':''}" data-day="${i}"><span class="dn">${i+1}일차</span><span class="ds">${d.length}문제${done?` · ${done}개 풂 · ${ok}개 정답`:''}</span><span class="bar"><i style="width:${done/d.length*100}%"></i></span></button>`}).join('')}</div>
  <div class="row"><button class="btn pri" id="wrongBtn" ${wrongIds.length?'':'disabled'}>오답노트 다시 풀기 (${wrongIds.length})</button><button class="btn" id="randBtn">랜덤 20문제</button></div>
  <h2>주제별로 풀기</h2>
  <div class="chips">${topics.map(t=>`<button class="chip" data-topic="${esc(t)}">${esc(t)} · ${DB.q.filter(q=>q.t===t).length}</button>`).join('')}</div>
  <div class="row"><button class="btn ghost" id="resetBtn">풀이 기록 초기화</button></div>
  <p class="foot">출처: 스터디파이터 감정평가사 부동산학원론 연도별 기출문제집(2018~2026) 수록 문제와 정답. 정답이 불분명하거나 출제오류로 지적된 문항, 도표가 깨져 옮기기 어려운 문항은 제외했습니다. 선지별 해설은 이 앱을 위해 새로 작성했으며, 법령은 시험 시행 당시 기준입니다. 풀이 기록은 이 브라우저에만 저장됩니다.</p>`;
  app.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{location.hash='day-'+(+b.dataset.day+1)});
  app.querySelector('#wrongBtn').onclick=()=>start('오답노트',shuffle(wrongIds.map(id=>DB.q.indexOf(Q[id]))),'wrong');
  app.querySelector('#randBtn').onclick=()=>start('랜덤 20문제',shuffle(DB.q.map((_,i)=>i)).slice(0,20),'rand');
  app.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start(b.dataset.topic,DB.q.map((q,i)=>q.t===b.dataset.topic?i:-1).filter(i=>i>=0),'topic'));
  const rb=app.querySelector('#resetBtn');
  rb.onclick=()=>{if(rb.dataset.c){st={ans:{},wrong:{}};save();home()}else{rb.dataset.c=1;rb.textContent='한 번 더 누르면 모두 지워집니다'}};
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(title,idx,kind){
  session={title,idx,kind,pos:0,picked:{}};
  if(kind==='day') idx.forEach(k=>{const id=DB.q[k].id;if(st.ans[id]!==undefined)session.picked[id]=st.ans[id]});
  if(kind==='day'){const f=idx.findIndex(k=>session.picked[DB.q[k].id]===undefined);session.pos=f<0?0:f}
  render();
}
function render(){
  const s=session,q=DB.q[s.idx[s.pos]],p=s.picked[q.id],ans=p!==undefined;
  const n=s.idx.length,doneN=Object.keys(s.picked).length;
  app.innerHTML=`
  <div class="top"><button class="btn ghost" id="back">← 목록</button><span class="t">${esc(s.title)}</span><span class="c">${s.pos+1} / ${n}</span></div>
  <div class="prog"><i style="width:${doneN/n*100}%"></i></div>
  <div class="card">
    <div class="meta"><span>${q.y}년 제${ho(q.y)}회 ${q.n}번</span><span class="tg">${esc(q.t)}</span></div>
    <p class="qt">${esc(q.q)}</p>
    ${q.box?`<div class="box">${q.box}</div>`:''}
    <div class="opts">${q.o.map((o,i)=>{
      let cls='',badge='';
      if(ans){if(isRight(q,i)){cls='right';badge='정답'}else if(i===p){cls='wrong';badge='내 선택'}}
      return `<button class="opt ${cls}" data-i="${i}" ${ans?'disabled':''}>${badge?`<span class="badge">${badge}</span>`:''}<span class="no">${C[i]}</span>${esc(o)}${ans?`<span class="ex">${esc(q.e[i])}</span>`:''}</button>`}).join('')}</div>
    ${ans?`<div class="verdict ${isRight(q,p)?'ok':'no'}">${isRight(q,p)?'정답입니다.':'오답입니다. 정답은 '+q.a.map(i=>C[i]).join(', ')+'입니다.'}</div>
    <div class="key"><b>핵심 정리</b>${esc(q.k)}</div>${q.note?`<p class="note">${esc(q.note)}</p>`:''}`:'<p class="hint">선지를 누르거나 숫자키 1~5로 답하세요.</p>'}
  </div>
  <div class="nav"><button class="btn" id="prev" ${s.pos?'':'disabled'}>← 이전</button>
  ${s.pos<n-1?`<button class="btn pri" id="next">다음 →</button>`:`<button class="btn pri" id="fin">결과 보기</button>`}</div>`;
  app.querySelector('#back').onclick=()=>{location.hash='';home()};
  app.querySelectorAll('.opt:not([disabled])').forEach(b=>b.onclick=()=>pick(+b.dataset.i));
  app.querySelector('#prev').onclick=()=>{s.pos--;render();window.scrollTo(0,0)};
  const nx=app.querySelector('#next');if(nx)nx.onclick=()=>{s.pos++;render();window.scrollTo(0,0)};
  const fn=app.querySelector('#fin');if(fn)fn.onclick=result;
}
function pick(i){
  const q=DB.q[session.idx[session.pos]];
  if(session.picked[q.id]!==undefined)return;
  session.picked[q.id]=i;st.ans[q.id]=i;
  if(isRight(q,i)){if(session.kind==='wrong')delete st.wrong[q.id]}else st.wrong[q.id]=1;
  save();render();
}
function result(){
  const s=session,n=s.idx.length;
  const ok=s.idx.filter(k=>{const q=DB.q[k];return s.picked[q.id]!==undefined&&isRight(q,s.picked[q.id])}).length;
  const un=s.idx.filter(k=>s.picked[DB.q[k].id]===undefined).length;
  const isDay=s.kind==='day',dnum=isDay?DB.days.indexOf(s.idx)+1:0;
  app.innerHTML=`
  <div class="top"><button class="btn ghost" id="back">← 목록</button><span class="t">${esc(s.title)} 결과</span></div>
  <div class="card"><div class="score">${ok} / ${n}</div><p class="lead" style="margin:0">${un?`아직 ${un}문제를 풀지 않았습니다. `:''}${ok===n?'모두 맞혔습니다.':'틀린 문제는 오답노트에 저장되었습니다.'}</p>
  <ul class="rl">${s.idx.map((k,j)=>{const q=DB.q[k],p=s.picked[q.id];const m=p===undefined?'–':isRight(q,p)?'O':'X';
    return `<li><button data-j="${j}"><span class="m ${m==='O'?'o':m==='X'?'x':''}">${m}</span><span class="s">${q.y}년 ${q.n}번 · ${esc(q.q.length>70?q.q.slice(0,70)+'…':q.q)}</span></button></li>`}).join('')}</ul>
  <div class="row">${isDay&&dnum<DB.days.length?`<button class="btn pri" id="nd">${dnum+1}일차로 →</button>`:''}<button class="btn" id="again">처음부터 다시 풀기</button></div></div>`;
  app.querySelector('#back').onclick=()=>{location.hash='';home()};
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{s.pos=+b.dataset.j;render();window.scrollTo(0,0)});
  const nd=app.querySelector('#nd');if(nd)nd.onclick=()=>{location.hash='day-'+(dnum+1)};
  app.querySelector('#again').onclick=()=>{s.idx.forEach(k=>delete s.picked[DB.q[k].id]);if(isDay)s.idx.forEach(k=>delete st.ans[DB.q[k].id]);save();s.pos=0;render()};
  window.scrollTo(0,0);
}
function route(){
  if(!DB)return;
  const m=location.hash.match(/^#day-(\d+)$/);
  if(m&&DB.days[m[1]-1]){start(`${m[1]}일차`,DB.days[m[1]-1],'day');window.scrollTo(0,0)}else home();
}
document.addEventListener('keydown',e=>{
  if(!session||e.metaKey||e.ctrlKey||e.altKey)return;
  if(/^[1-5]$/.test(e.key)&&app.querySelector('.opt:not([disabled])'))pick(+e.key-1);
  else if((e.key==='Enter'||e.key==='ArrowRight')&&app.querySelector('#next')&&app.querySelector('.verdict')){app.querySelector('#next').click()}
  else if(e.key==='ArrowLeft'&&app.querySelector('#prev:not([disabled])'))app.querySelector('#prev').click();
});
window.addEventListener('hashchange',route);
{const d=JSON.parse(document.getElementById('qdata').textContent);DB=d;d.q.forEach(q=>Q[q.id]=q);route()}
}
</script>
</body>
</html>
