<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>부동산학원론 데일리 20</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: 차분한 수험 노트, 군더더기 없이 문제와 해설에 집중
   IDEA: 감정평가사 시험지 + 채점 빨간펜
   PICTURE: 첫 화면은 12일 학습 달력(데일리 카드 격자), 풀이 화면은 시험지 한 장
   COLOUR and TYPE: 석회석 바탕, 검정 글씨, 벽돌색 채점펜 / IBM Plex Sans KR
   LAYOUT: 한 칼럼 820px, 휴대폰에서 버튼 44px 이상 */
:root{color-scheme:light dark;--bg:light-dark(#e7e4df,#171513);--panel:light-dark(#fff,#211e1b);--ink:light-dark(#151412,#efebe5);--mute:light-dark(#6b665f,#a39d94);--line:light-dark(#d6d1c9,#38332e);--red:light-dark(#c8371e,#ef6a4f);--ok:light-dark(#1f6f4a,#5cc795);--okbg:light-dark(#e6f3ec,#16291f);--nobg:light-dark(#fbe9e5,#341a14);--soft:light-dark(#f4f2ee,#2a2622)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans KR",system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;overflow-x:clip}
.wrap{max-width:820px;margin:0 auto;padding:clamp(20px,4vw,44px) max(4vw,14px) 80px}
h1{font-size:clamp(30px,5vw,44px);line-height:1.08;margin:0 0 10px;text-wrap:balance;font-weight:700;letter-spacing:-.02em}
.lead{color:var(--mute);margin:0 0 22px;max-width:60ch}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 22px;font-size:15px}
.stats b{font-size:22px;display:block;line-height:1.1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:104px;display:flex;flex-direction:column;gap:4px;position:relative}
.day:hover{border-color:var(--ink)}.day:focus-visible,button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.day .dn{font-weight:700;font-size:20px}.day .ds{font-size:13px;color:var(--mute)}
.day .bar{height:5px;background:var(--soft);border-radius:3px;margin-top:auto;overflow:hidden}.day .bar i{display:block;height:100%;background:var(--red)}
.day.done .dn::after{content:" ✓";color:var(--ok)}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 10px}
.btn{font:inherit;font-size:15px;min-height:44px;padding:9px 16px;border-radius:8px;border:1px solid var(--ink);background:var(--panel);color:var(--ink);cursor:pointer}
.btn.pri{background:var(--ink);color:var(--bg)}.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{border-color:var(--line)}
h2{font-size:19px;margin:30px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:14px;padding:6px 10px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
button.chip{cursor:pointer;min-height:40px;color:inherit;font-family:inherit}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top .t{font-weight:700}.top .c{margin-left:auto;color:var(--mute);font-size:14px;white-space:nowrap}
.prog{height:6px;background:var(--panel);border-radius:3px;overflow:hidden;margin-bottom:18px}.prog i{display:block;height:100%;background:var(--red);transition:width .25s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,3.5vw,30px)}
.meta{font-size:13px;color:var(--mute);display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:10px}
.meta .tg{color:var(--red);font-weight:500}
.qt{font-size:18px;font-weight:500;margin:0 0 14px;line-height:1.55}
.box{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:12px 14px;margin:0 0 16px;font-size:15px;overflow-x:auto}
.box .bi{display:flex;gap:8px;padding:3px 0}.box .bl{font-weight:700;flex:none;width:1.2em}
.box .bp{padding:3px 0}.box .chips{margin:4px 0}
table.bt{border-collapse:collapse;font-size:14px;margin:4px 0;width:100%}
table.bt td{border:1px solid var(--line);padding:5px 8px;background:var(--panel);vertical-align:top}
table.bt tr:first-child td{font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:11px 14px;cursor:pointer;min-height:48px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .no{font-weight:700;margin-right:6px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--red);background:var(--nobg)}
.opt .ex{display:block;font-size:14.5px;color:var(--ink);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.6}
.opt .badge{float:right;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:8px}
.opt.right .badge{background:var(--ok);color:var(--panel)}.opt.wrong .badge{background:var(--red);color:var(--panel)}
.verdict{font-weight:700;font-size:17px;margin:16px 0 6px}.verdict.ok{color:var(--ok)}.verdict.no{color:var(--red)}
.key{border-left:4px solid var(--red);background:var(--soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:15px;margin-top:12px}
.key b{display:block;font-size:13px;color:var(--red);margin-bottom:2px}
.note{font-size:13.5px;color:var(--mute);margin-top:8px}
.nav{display:flex;gap:8px;justify-content:space-between;margin-top:18px}
.hint{font-size:13px;color:var(--mute);margin-top:10px}
.score{font-size:clamp(44px,9vw,72px);font-weight:700;line-height:1;margin:10px 0}
.rl{list-style:none;padding:0;margin:16px 0;display:grid;gap:6px}
.rl li button{width:100%;text-align:left;font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;display:flex;gap:10px;align-items:flex-start;min-height:44px}
.rl .m{flex:none;font-weight:700;width:1.4em}.rl .m.o{color:var(--ok)}.rl .m.x{color:var(--red)}
.rl .s{font-size:14.5px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:22px;color:var(--mute)}
.foot{font-size:13px;color:var(--mute);margin-top:34px}
@media(max-width:600px){.qt{font-size:17px}table.bt{font-size:12.5px}}
@media(prefers-reduced-motion:reduce){.prog i{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="lead">문제를 불러오는 중…</p></div>
<script type="application/json" id="qdata">{"q":[{"id":"2020-01","y":2020,"n":1,"q":"토지의 특성에 관한 설명으로 옳지 않은 것은?","box":"","o":["부동성으로 인해 지역분석을 필요로 하게 된다.","용도의 다양성은 최유효이용의 판단근거가 된다.","영속성은 부동산활동에 대해서 장기적 배려를 필연적으로 고려하게 된다.","합병·분할의 가능성은 토지의 이행과 전환을 가능하게 한다.","개별성으로 인해 일물일가의 법칙이 적용되지 않고, 부동산시장에서 부동산상품 간에 완벽한 대체는 불가능하다."],"a":[3],"e":["옳음. 부동성으로 지역마다 특성이 달라 지역분석이 필요하다.","옳음. 용도의 다양성은 여러 용도 중 최유효이용을 선택하는 근거가 된다.","옳음. 영속성으로 부동산활동은 장기적 배려를 필요로 한다.","틀림(정답). 토지의 이행과 전환을 가능하게 하는 것은 '용도의 다양성'이다. 합병·분할의 가능성은 토지의 규모를 조정해 가치를 변화시키는 근거가 된다.","옳음. 개별성으로 일물일가 법칙이 적용되지 않고 완전한 대체가 불가능하다."],"k":"토지의 이행·전환 = 용도의 다양성. 합병·분할 가능성 = 획지 규모 조정을 통한 최유효이용·가치 변화.","note":"","t":"부동산학 총론"},{"id":"2020-02","y":2020,"n":2,"q":"다음의 내용과 관련된 토지의 특성은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>지가를 상승시키는 요인이 된다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지는 생산비를 투입하여 생산할 수 없다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지의 독점 소유욕을 갖게 하며, 토지이용을 집약화 시킨다.<\/span><\/div>","o":["부동성","부증성","영속성","개별성","인접성"],"a":[1],"e":["오답. 부동성은 지역분석·국지화·외부효과의 근거이다.","정답. 부증성으로 토지는 생산할 수 없어 희소성이 커지고 지가 상승, 독점 소유욕, 집약적 이용을 초래한다.","오답. 영속성은 감가상각 배제·장기적 배려와 관련된다.","오답. 개별성은 일물일가 법칙 배제·개별분석과 관련된다.","오답. 인접성은 외부효과·협동적 이용과 관련된다."],"k":"부증성(비생산성): 생산비 투입으로 물리적 공급 불가 → 희소성·지가 상승·독점 소유욕·집약적 이용.","note":"","t":"부동산학 총론"},{"id":"2020-03","y":2020,"n":3,"q":"다음의 부동산 권리분석 특별원칙은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>하자전제의 원칙<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>범위확대의 원칙<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>차단의 원칙<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>완전심증의 원칙<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>유동성 대비의 원칙<\/span><\/div>","o":["능률성의 원칙","탐문주의 원칙","증거주의 원칙","안전성의 원칙","사후확인의 원칙"],"a":[3],"e":["오답. 능률성의 원칙은 권리분석의 일반원칙으로, 신속·정확하게 분석해야 한다는 것이다.","오답. 탐문주의는 직접 탐문·확인하는 원칙이다.","오답. 증거주의는 증거에 근거해 판단하는 원칙이다.","정답. 제시된 다섯 원칙은 모두 '안전성의 원칙'을 구체화한 하위원칙이다.","오답. 사후확인의 원칙은 권리분석의 원칙으로 일반적으로 제시되지 않는다."],"k":"안전성의 원칙(특별원칙): 하자전제, 범위확인(확대), 차단, 완전심증, 유동성 대비의 원칙.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2020-04","y":2020,"n":4,"q":"( )에 들어갈 내용으로 옳은 것은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>( )(이)란 임장활동의 전 단계 활동으로 여러 가지 물적 증거를 수집하고 탁상 위에서 검토하여 1차적으로 하자의 유무를 발견하려는 작업이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( )의 과정은 위험사례를 미리 발견하기 위한 노력 또는 그 기초 작업이다.<\/span><\/div>","o":["보정","심사","판독","면책사항","권리보증"],"a":[2],"e":["오답. 보정은 하자를 바로잡는 활동을 말한다.","오답. 심사는 판독 이후의 판단 단계를 말한다.","정답. 임장활동 전 탁상 위에서 자료를 검토해 1차적으로 하자를 발견하려는 작업은 '판독'이다.","오답. 면책사항은 권리분석보고서에서 분석자의 책임이 미치지 않는 범위를 밝힌 사항이다.","오답. 권리보증은 권리분석 결과에 대한 보증을 말한다."],"k":"판독 = 임장활동 전 탁상에서 물적 증거를 검토하여 1차적으로 하자를 발견하는 작업.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2020-05","y":2020,"n":5,"q":"감정평가 실무기준상 권리금 감정평가에 관한 설명으로 옳지 않은 것은?","box":"","o":["권리금을 감정평가할 때에는 유형*무형의 재산마다 개별로 감정평가하는 것을 원칙으로 한다.","권리금을 개별로 감정평가하는 것이 곤란하거나 적절하지 아니한 경우에는 일괄하여 감정평가할 수 있으며, 이 경우 감정평가액은 유형재산가액과 무형재산가액으로 구분하지 않아야 한다.","유형재산을 감정평가할 때에는 주된 방법으로 원가법을 적용하여야 한다.","무형재산을 감정평가할 때에는 주된 방법으로 수익환원법을 적용하여야 한다.","유형재산과 무형재산을 일괄하여 감정평가할 때에는 주된 방법으로 수익환원법을 적용하여야 한다."],"a":[1],"e":["옳음. 유형·무형 재산마다 개별평가가 원칙이다.","틀림(정답). 일괄평가하는 경우에도 합리적 배분기준에 따라 유형재산가액과 무형재산가액으로 '구분하여 표시할 수 있다'.","옳음. 유형재산(시설·비품 등)은 원가법이 주된 방법이다.","옳음. 무형재산(영업권 등)은 수익환원법이 주된 방법이다.","옳음. 일괄평가 시 수익환원법이 주된 방법이다."],"k":"권리금: 개별평가 원칙(유형=원가법, 무형=수익환원법). 일괄평가 시 수익환원법, 합리적 배분기준으로 유형·무형 구분 표시 '가능'.","note":"","t":"감정평가"},{"id":"2020-06","y":2020,"n":6,"q":"감정평가에 관한 규칙상 용어의 정의로 옳지 않은 것은?","box":"","o":["기준시점이란 대상물건의 감정평가액을 결정하는 기준이 되는 날짜를 말한다.","가치형성요인이란 대상물건의 경제적 가치에 영향을 미치는 일반요인, 지역요인 및 개별요인 등을 말한다.","동일수급권이란 대상부동산과 대체·경쟁 관계가 성립하고 가치형성에 서로 영향을 미치는 관계에 있는 다른 부동산이 존재하는 권역을 말하며, 인근지역과 유사지역을 포함한다.","임대사례비교법이란 대상물건과 가치형성요인이 같거나 비슷한 물건의 임대사례와 비교하여 대상물건의 현황에 맞게 사정보정, 시점수정, 가치형성요인 비교 등의 과정을 거쳐 대상물건의 임대료를 산정하는 감정평가방법을 말한다.","수익분석법이란 대상물건이 장래 산출할 것으로 기대되는 순수익이나 미래의 현금흐름을 환원하거나 할인하여 대상물건의 가액을 산정하는 감정평가방법을 말한다."],"a":[4],"e":["옳음. 기준시점의 정의이다.","옳음. 가치형성요인의 정의이다.","옳음. 동일수급권은 인근지역과 유사지역을 포함한다.","옳음. 임대사례비교법의 정의이다.","틀림(정답). 지문은 '수익환원법'의 정의이다. 수익분석법은 기업의 총수익을 분석해 순수익에 필요제경비를 더하여 임대료를 산정하는 방법이다."],"k":"수익분석법 = 일반기업 경영의 총수익을 분석하여 순수익 + 필요제경비로 '임대료'를 구하는 방법. 지문은 수익환원법의 정의.","note":"","t":"감정평가"},{"id":"2020-07","y":2020,"n":7,"q":"다음과 같은 조건에서 수익환원법에 의해 평가한 대상부동산의 가액은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>가능총소득(PGI) : 1억원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>공실손실상당액 및 대손충당금 : 가능총소득의 5%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>재산세 : 300만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>화재보험료 : 200만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>영업소득세 : 400만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>건물주 개인업무비 : 500만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지가액 : 건물가액 = 40% : 60%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지환원이율 : 5%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>건물환원이율 : 10%<\/span><\/div>","o":["1,025,000,000원","1,075,000,000원","1,125,000,000원","1,175,000,000원","1,225,000,000원"],"a":[2],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. EGI = 1억 × 95% = 9,500만원. 경비 = 재산세 300만 + 보험료 200만 = 500만원(소득세·개인업무비 제외). NOI = 9,000만원. R = 0.4×5% + 0.6×10% = 8%. 가액 = 9,000만/0.08 = 11억 2,500만원.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다."],"k":"운영경비 불포함: 영업소득세, 소유자 개인업무비(사적 비용), 부채서비스액, 감가상각비 등. 포함: 재산세, 화재보험료 등.","note":"","t":"감정평가"},{"id":"2020-08","y":2020,"n":8,"q":"감정평가에 관한 규칙상 주된 감정평가방법 중 거래사례비교법을 적용하는 것은?","box":"<div class=\"chips\"><span class=\"chip\">ㄱ. 토지<\/span><span class=\"chip\">ㄴ. 건물<\/span><\/div><div class=\"chips\"><span class=\"chip\">ㄷ. 토지와 건물의 일괄<\/span><span class=\"chip\">ㄹ. 임대료<\/span><\/div><div class=\"chips\"><span class=\"chip\">ㅁ. 광업재단<\/span><span class=\"chip\">ㅂ. 과수원<\/span><\/div><div class=\"bp\">ㅅ. 자동차<\/div>","o":["ㄱ, ㄴ, ㅂ","ㄱ, ㅁ, ㅅ","ㄴ, ㅁ, ㅅ","ㄷ, ㄹ (이자율 연 4%, 기간 15년) : 0.09<\/span><\/div>","o":["3.93%","4.93%","5.93%","6.93%","7.93%"],"a":[1],"e":["오답. 계산 결과와 다르다.","정답. OE = 200+100+100+100+200 = 700만원(소득세 제외). NOI = 8,000−700 = 7,300만원. DCR = 7,300/4,000 = 1.825. R = 1.825 × 0.3 × 0.09 = 4.93%.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다."],"k":"부채감당법: R = DCR × LTV × 저당상수. 소득세·부채서비스액은 운영경비 제외.","note":"","t":"감정평가"},{"id":"2020-11","y":2020,"n":11,"q":"A도시와 B도시 사이에 C도시가 있다. 레일리의 소매인력법칙을 적용할 경우, C도시에서 A도시, B도시로 구매 활동에 유입되는 비율은? (단, C도시의 인구는 모두 A도시 또는 B도시에서 구매하고, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>A도시 인구수 : 45,000명<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>B도시 인구수 : 20,000명<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>C도시에서 A도시 간의 거리 : 36km<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>C도시에서 B도시 간의 거리 : 18km<\/span><\/div>","o":["A : 36%, B : 64%","A : 38%, B : 62%","A : 40%, B : 60%","A : 42%, B : 58%","A : 44%, B : 56%"],"a":[0],"e":["정답. A = 45,000/36² ≈ 34.7, B = 20,000/18² ≈ 61.7 → A 비율 = 34.7/96.4 ≈ 36%, B ≈ 64%.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 거리를 제곱하지 않으면 다른 값이 나온다."],"k":"레일리 법칙: 유인력 = 인구 ÷ 거리².","note":"","t":"시장·입지·지대"},{"id":"2020-12","y":2020,"n":12,"q":"다음과 같은 지대이론을 주장한 학자는?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>지대는 자연적 기회를 이용하는 반대급부로 토지소유자에게 지불하는 대가로 보았다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지지대는 토지이용으로부터 얻는 순소득을 의미하며, 이 순소득을 잉여라고 하였다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지의 몰수가 아닌 지대의 몰수라고 주장하면서 토지가치에 대한 조세 이외의 모든 조세를 철폐하자고 하였다.<\/span><\/div>","o":["리카도(D. Ricardo)","알론서(W. Alonso)","헨지 조지(H. Geoge)","마르크스(K. Marx)","튀넨(J.H. von Thunen)"],"a":[2],"e":["오답. 리카도는 비옥도 차이에 따른 차액지대설을 주장했다.","오답. 알론소는 입찰지대이론을 주장했다.","정답. 헨리 조지는 지대는 불로소득이므로 토지가치세(단일세)로 환수하고 나머지 조세는 철폐하자고 주장했다.","오답. 마르크스는 절대지대설을 주장했다.","오답. 튀넨은 위치(수송비)에 따른 위치지대설(고립국이론)을 주장했다."],"k":"헨리 조지: 토지단일세론 — 지대(불로소득)를 조세로 환수하고 다른 조세는 철폐.","note":"","t":"시장·입지·지대"},{"id":"2020-13","y":2020,"n":13,"q":"디파스퀠리-위튼(DiPasquale & Wheaton)의 사분면 모형에 관한 설명으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["1사분면에서는 부동산 공간시장의 단기공급곡선과 수요곡선에 의해 균형임대료가 결정된다.","2사분면에서는 부동산의 임대료가 가격으로 환원되는 부동산자산시장의 조건을 나타낸다.","3사분면에서는 신규 부동산의 건설량은 부동산가격과 부동산개발비용의 함수로 결정된다.","4사분면에서는 신규 부동산의 건설량과 재고의 멸실량이 변화하여야 부동산공간시장의 균형을 이룰 수 있다.","이 모형은 부동산이 소비재이면서도 투자재라는 특성을 전제로 한다."],"a":[3],"e":["옳음. 1사분면은 공간시장으로 재고와 수요로 임대료가 결정된다.","옳음. 2사분면은 자산시장으로 임대료를 환원율로 가격으로 환원한다.","옳음. 3사분면은 개발시장으로 가격과 건설비용에 따라 신규건설량이 결정된다.","틀림(정답). 4사분면에서는 신규건설량이 재고의 멸실량(감가상각)과 일치할 때 재고가 일정해져 공간시장의 장기균형이 이뤄진다. '건설량과 멸실량이 변화해야' 균형이 된다는 표현은 틀렸다.","옳음. 부동산을 공간(소비재)이자 자산(투자재)으로 본다."],"k":"4사분면: 신규건설량과 재고 멸실량이 같아질 때 재고가 일정 → 장기균형. 균형 달성은 재고 멸실량(감가)과의 관계.","note":"","t":"시장·입지·지대"},{"id":"2020-14","y":2020,"n":14,"q":"부동산시장에 대한 정부의 직접개입방식으로 옳게 묶인 것은?","box":"","o":["토지비축제, 개발부담금제도","수용제도, 선매권제도","최고가격제도, 부동산조세","보조금제도, 용도지역지구제","담보대출규제, 부동산거래허가제"],"a":[1],"e":["오답. 개발부담금제도는 간접개입이다.","정답. 수용제도와 선매권제도는 정부가 직접 토지를 취득하는 직접개입방식이다.","오답. 부동산조세는 간접개입이다.","오답. 보조금제도는 간접개입, 용도지역지구제는 토지이용규제이다.","오답. 담보대출규제는 간접개입, 토지거래허가제는 이용규제이다."],"k":"직접개입: 수용, 선매권, 토지비축, 공영개발, 공공임대, 임대료·분양가 규제 등. 간접개입: 조세, 금융, 보조금, 개발부담금 등.","note":"","t":"정책·조세"},{"id":"2020-15","y":2020,"n":15,"q":"우리나라에서 현재(2020. 3. 7.) 시행하지 않는 부동산정책을 모두 고른 것은?","box":"<div class=\"chips\"><span class=\"chip\">ㄱ. 종합토지세<\/span><span class=\"chip\">ㄴ. 공한지세<\/span><span class=\"chip\">ㄷ. 토지거래허가제<\/span><\/div><div class=\"chips\"><span class=\"chip\">ㄹ. 택지소유상한제<\/span><span class=\"chip\">ㅁ. 분양가상한제<\/span><span class=\"chip\">ㅂ. 개발이익환수제<\/span><\/div><div class=\"chips\"><span class=\"chip\">ㅅ. 실거래가신고제<\/span><span class=\"chip\">ㅇ. 부동산실명제<\/span><\/div>","o":["ㄱ, ㄴ, ㄹ","ㄱ, ㅁ, ㅂ","ㄱ, ㅂ, ㅅ","ㄴ, ㄷ, ㅁ","ㄹ, ㅅ, ㅇ"],"a":[0],"e":["정답. 종합토지세·공한지세·택지소유상한제는 모두 폐지되어 현재 시행되지 않는다.","오답. 분양가상한제·개발이익환수제(개발부담금)는 시행 중이다.","오답. 개발이익환수제·실거래가신고제는 시행 중이다.","오답. 토지거래허가제·분양가상한제는 시행 중이다.","오답. 실거래가신고제·부동산실명제는 시행 중이다."],"k":"폐지된 제도: 종합토지세(2005, 종부세로 대체), 공한지세(1986), 택지소유상한제(1999), 토지초과이득세(1998).","note":"","t":"정책·조세"},{"id":"2020-16","y":2020,"n":16,"q":"토지이용계획과 용도지역지구제에 관한 설명으로 옳지 않은 것은?","box":"","o":["용도지역지구제는 토지이용규제의 대표적인 예로 들 수 있다.","용도지역지구제는 특정 토지를 용도지역이나 용도지구로 지정한 후 해당 토지의 이용을 지정목적에 맞게 제한하는 제도이다.","토지이용계획은 토지이용규제의 근간을 이루지만 법적 구속력을 가지고 있지는 않다.","용도지역지구제는 토지이용계획의 내용을 실현하는 수단으로서, 도시·군관리계획의 내용을 구성한다.","용도지역지구제에 따른 용도 지정 후, 관련법에 의해 사인의 토지이용이 제한되지 않는다."],"a":[4],"e":["옳음. 용도지역지구제는 대표적인 토지이용규제이다.","옳음. 지정 후 지정목적에 맞게 이용을 제한하는 제도이다.","옳음. 토지이용계획(도시·군기본계획 등)은 규제의 근간이지만 그 자체로 국민에 대한 직접적 구속력은 없다.","옳음. 용도지역지구제는 도시·군관리계획의 내용으로 토지이용계획을 실현하는 수단이다.","틀림(정답). 용도 지정 후에는 관련법에 따라 사인의 토지이용이 '제한된다'."],"k":"용도지역지구제는 도시·군관리계획으로 결정되어 법적 구속력을 갖고 사인의 토지이용을 제한한다.","note":"","t":"정책·조세"},{"id":"2020-17","y":2020,"n":17,"q":"화폐의 시간적 가치를 고려하지 않는 부동산 투자타당성방법은?","box":"","o":["수익성지수법(PI)","회계적수익률법(ARR)","현가회수기간법(PVP)","내부수익률법(IRR)","순현재가치법(NPV)"],"a":[1],"e":["오답. 수익성지수법은 할인현금흐름기법이다.","정답. 회계적수익률법(ARR)은 회계상 이익을 기준으로 하며 화폐의 시간가치를 고려하지 않는다.","오답. 현가회수기간법은 현금흐름을 할인하여 회수기간을 구하므로 시간가치를 고려한다.","오답. 내부수익률법은 할인현금흐름기법이다.","오답. 순현재가치법은 할인현금흐름기법이다."],"k":"할인기법(시간가치 고려): NPV, IRR, PI, 현가회수기간법. 비할인기법: 회계적수익률법, 단순회수기간법, 어림셈법, 비율분석법.","note":"","t":"투자·금융"},{"id":"2020-18","y":2020,"n":18,"q":"다음의 개발방식은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>대지로서 효용증진과 공공시설의 정비를 목적으로 하며, 택지개발사업에 주로 활용되는 방식이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>사업 후 개발토지 중 사업에 소요된 비용과 공공용지를 제외한 토지를 당초의 토지소유자에게 되돌려 주는 방식이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>개발사업 시 사업재원으로 확보해 놓은 토지를 체비지라고 한다.<\/span><\/div>","o":["환지방식","신탁방식","수용방식","매수방식","합동방식"],"a":[0],"e":["정답. 환지방식의 설명이며, 사업재원으로 확보한 토지를 체비지라 한다.","오답. 신탁방식은 신탁회사에 토지를 신탁해 개발하는 방식이다.","오답. 수용방식은 토지를 수용·보상하고 토지로 돌려주지 않는다.","오답. 매수방식은 토지를 협의매수하는 방식이다.","오답. 합동방식은 민간과 공공이 함께 추진하는 방식이다."],"k":"환지방식: 비용·공공용지를 제외한 토지를 원소유자에게 반환, 사업비 충당용 토지 = 체비지.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2020-19","y":2020,"n":19,"q":"건물의 관리방식에 관한 설명으로 옳지 않은 것은?","box":"","o":["자가관리방식은 일반적으로 소유자의 지시와 통제 권한이 강하다.","위탁관리방식은 부동산관리를 전문적으로 하는 대행업체에게 맡기는 방식으로 사회적으로 신뢰도가 높고 성실한 대행업체를 선정하는 것이 중요하다.","혼합관리방식은 자가관리에서 위탁관리로 이행하는 과도기적 조치로 적합하다.","자가관리방식에 있어 소유자가 전문적 관리지식이 부족한 경우 효율적 관리에 한계가 있을 수 있다.","혼합관리방식에 있어 관리상의 문제가 발생할 경우, 책임소재에 대한 구분이 명확하다."],"a":[4],"e":["옳음. 자가관리는 소유자의 지시·통제가 강하다.","옳음. 신뢰할 수 있는 대행업체 선정이 중요하다.","옳음. 혼합관리는 자가관리에서 위탁관리로 이행하는 과도기에 적합하다.","옳음. 소유자의 전문지식이 부족하면 효율적 관리에 한계가 있다.","틀림(정답). 혼합관리는 문제 발생 시 책임소재가 '불분명'하다."],"k":"혼합관리: 과도기적 방식, 장점(필요부분만 위탁) / 단점(책임소재 불분명, 협조 곤란).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2020-20","y":2020,"n":20,"q":"개발업자 甲이 직면한 개발사업의 시장위험에 관한 설명으로 옳지 않은 것은?","box":"","o":["개발기간 중에도 상황이 변할 수 있다는 점에 유의해야 한다.","개발기간이 장기화될수록 개발업자의 시장위험은 높아진다.","선분양은 개발업자가 부담하는 시장위험을 줄일 수 있다.","금융조달비용의 상승과 같은 시장의 불확실성은 개발업자에게 시장위험을 부담시킨다.","후분양은 개발업자의 시장위험을 감소시킨다."],"a":[4],"e":["옳음. 개발기간 중에도 시장상황이 변할 수 있다.","옳음. 개발기간이 길수록 불확실성이 커져 시장위험이 커진다.","옳음. 선분양은 시장위험을 줄여준다.","옳음. 금융비용 상승 등 시장 불확실성은 시장위험을 증가시킨다.","틀림(정답). 후분양은 완공 후 분양하므로 분양가·분양률의 불확실성이 커 개발업자의 시장위험을 '증가'시킨다."],"k":"선분양 → 시장위험 감소(분양대금 조기확보), 후분양 → 분양가·분양률 불확실성으로 개발업자의 시장위험 증가.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2020-21","y":2020,"n":21,"q":"부동산개발업의 관리 및 육성에 관한 법률상 부동산개발에 해당하지 않는 행위는?","box":"","o":["토지를 건설공사의 수행으로 조성하는 행위","토지를 형질변경의 방법으로 조성하는 행위","시공을 담당하는 행위","건축물을 건축기준에 맞게 용도변경하는 행위","공작물을 설치하는 행위"],"a":[2],"e":["해당함. 건설공사의 수행으로 토지를 조성하는 행위는 부동산개발이다.","해당함. 형질변경 방법으로 토지를 조성하는 행위는 부동산개발이다.","해당하지 않음(정답). 시공을 담당하는 행위는 부동산개발에서 명시적으로 제외된다.","해당함. 건축물의 용도변경은 부동산개발이다.","해당함. 공작물 설치는 부동산개발이다."],"k":"부동산개발업법상 부동산개발: 토지 조성(건설공사·형질변경), 건축물 건축·대수선·리모델링·용도변경, 공작물 설치. 시공을 담당하는 행위는 제외.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2020-22","y":2020,"n":22,"q":"부동산 증권에 관한 설명으로 옳은 것은?","box":"","o":["저당이체증권(MPTS)의 모기지 소유권과 원리금 수취권은 모두 투자자에게 이전된다.","지불이체채권(MPTB)의 모기지 소유권은 투자자에게 이전되고, 원리금 수취권은 발행자에게 이전된다.","저당담보부채권(MBB)의 조기상환위험과 채무불이행 위험은 투자자가 부담한다.","다계층증권(CMO)은 지분형증권으로만 구성되어 있다.","상업용 저당증권(CMBS)은 반드시 공적 유동화중개기관을 통하여 발행된다."],"a":[0],"e":["정답. MPTS는 모기지 소유권과 원리금 수취권이 모두 투자자에게 이전된다.","틀림. MPTB는 소유권은 '발행자'에게 남고, 원리금 수취권은 '투자자'에게 이전된다.","틀림. MBB의 조기상환위험과 채무불이행위험은 '발행자'가 부담한다.","틀림. CMO는 지분형과 채권형의 성격을 모두 가진 혼합형이다.","틀림. CMBS는 민간 유동화기관을 통해서도 발행될 수 있다."],"k":"MPTS: 소유권·원리금수취권 모두 투자자. MPTB: 소유권은 발행자, 원리금수취권은 투자자. MBB: 둘 다 발행자. CMO: 혼합형.","note":"","t":"투자·금융"},{"id":"2020-23","y":2020,"n":23,"q":"프로젝트 금융의 특징에 관한 설명으로 옳지 않은 것은?","box":"","o":["사업자체의 현금흐름을 근거로 자금을 조달하고, 원리금 상환도 해당 사업에서 발생하는 현금흐름에 근거한다.","사업주의 입장에서는 비소구(non-recourse) 또는 제한적 소구(limited-recourse) 방식이므로 상환 의무가 제한되는 장점이 있다.","금융기관의 입장에서는 부외금융(off-balance sheet financing)에 의해 채무수용능력이 커지는 장점이 있다.","금융기관의 입장에서는 금리와 수수료 수준이 높아 일반적인 기업금융보다 높은 수익을 얻을 수 있는 장점이 있다.","복잡한 계약에 따른 사업의 지연과 이해당사자 간의 조정의 어려움은 사업주와 금융기관 모두의 입장에서 단점으로 작용한다."],"a":[2],"e":["옳음. 프로젝트 자체의 현금흐름이 자금조달과 상환의 근거이다.","옳음. 비소구·제한적 소구 방식으로 사업주의 상환의무가 제한된다.","틀림(정답). 부외금융으로 채무수용능력이 커지는 것은 '사업주(차입자)'의 장점이다.","옳음. 금융기관은 높은 금리와 수수료로 기업금융보다 높은 수익을 얻을 수 있다.","옳음. 복잡한 계약 구조로 인한 지연·조정의 어려움은 모두에게 단점이다."],"k":"부외금융(off-balance)은 '사업주'의 장점(재무상태표에 부채 미계상 → 채무수용능력 유지).","note":"","t":"투자·금융"},{"id":"2020-24","y":2020,"n":24,"q":"저당대출의 상환방식에 관한 설명으로 옳은 것은?","box":"","o":["원금균등분할상환(CAM) 방식의 경우, 원리금의 합계가 매기 동일하다.","원리금균등분할상환(CPM) 방식의 경우, 초기에는 원리금에서 이자가 차지하는 비중이 높으나, 원금을 상환해 가면서 원리금에서 이자가 차지하는 비중이 줄어든다.","다른 조건이 일정하다면, 대출채권의 듀레이션(평균 회수기간)은 원리금균등분할상환(CPM) 방식이 원금균등분할상환(CAM) 방식보다 짧다.","체증분할상환(GPM) 방식은 장래 소득이 줄어들 것으로 예상되는 차입자에게 적합한 대출방식 이다.","거치식(Interest-only Mortgage) 방식은 대출자 입장에서 금리수입이 줄어드는 상환방식으로, 상업용 부동산 저당대출보다 주택 저당대출에서 주로 활용된다."],"a":[1],"e":["틀림. 원금균등분할상환은 '원금'이 매기 동일하고 원리금 합계는 점차 감소한다.","정답. 원리금균등분할상환은 초기에 이자 비중이 높고 원금을 갚아갈수록 이자 비중이 줄어든다.","틀림. 듀레이션은 원금균등(CAM)이 원리금균등(CPM)보다 짧다.","틀림. 체증분할상환은 장래 소득이 '증가'할 것으로 예상되는 차입자(젊은 층 등)에게 적합하다.","틀림. 거치식은 원금이 줄지 않아 대출자의 이자수입이 많아지는 방식이며, 주로 상업용 부동산 대출에서 활용된다."],"k":"CPM: 초기 이자 비중↑ → 점차 원금 비중↑. GPM: 장래 소득 증가 예상자에게 적합. 듀레이션 CAM < CPM.","note":"","t":"투자·금융"},{"id":"2020-25","y":2020,"n":25,"q":"다음 민간투자사업방식을 바르게 연결한 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>사업주가 시설준공 후 소유권을 취득하여, 일정 기간 동안 운영을 통해 운영수익을 획득하고, 그 기간이 만료되면 공공에게 소유권을 이전하는 방식<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>사업주가 시설준공 후 소유권을 공공에게 귀속시키고, 그 대가로 받은 시설운영권으로 그 시설을 공공에게 임대하여 임대료를 획득하는 방식<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>사업주가 시설준공 후 소유권을 공공에게 귀속시키고, 그 대가로 일정기간 동안 시설운영권을 받아 운영수익을 획득하는 방식<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>사업주가 시설준공 후 소유권을 취득하여, 그 시설을 운영하는 방식으로, 소유권이 사업주에게 계속 귀속되는 방식<\/span><\/div>","o":["ㄱ: BTO방식, ㄴ: BTL방식, ㄷ: BOT방식, ㄹ: BOO방식","ㄱ: BOT방식, ㄴ: BTL방식, ㄷ: BTO방식, ㄹ: BOO방식","ㄱ: BOT방식, ㄴ: BTO방식, ㄷ: BOO방식, ㄹ: BTL방식","ㄱ: BTL방식, ㄴ: BOT방식, ㄷ: BOO방식, ㄹ: BTO방식","ㄱ: BOT방식, ㄴ: BOO방식, ㄷ: BTO방식, ㄹ: BTL방식"],"a":[1],"e":["오답. ㄱ은 BOT, ㄷ은 BTO이다.","정답. ㄱ: BOT, ㄴ: BTL, ㄷ: BTO, ㄹ: BOO.","오답. ㄴ은 BTL, ㄷ은 BTO, ㄹ은 BOO이다.","오답. 모두 잘못 연결되었다.","오답. ㄴ은 BTL, ㄹ은 BOO이다."],"k":"BOT(소유→운영→이전), BTL(이전→임대), BTO(이전→운영 수익), BOO(소유 유지·운영).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2020-26","y":2020,"n":26,"q":"다음의 조건을 가진 A부동산의 대부비율(LTV)은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>매매가격 : 5억원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>순영업소득 : 3,000만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>부채감당률 : 1.5<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>연 저당상수 : 0.1<\/span><\/div>","o":["10%","20%","30%","40%","50%"],"a":[3],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. DS = 3,000만/1.5 = 2,000만원. 대출액 = 2,000만/0.1 = 2억원. LTV = 2억/5억 = 40%.","오답. 계산 결과와 다르다."],"k":"DS = NOI/DCR, 대출액 = DS/저당상수, LTV = 대출액/가격.","note":"","t":"투자·금융"},{"id":"2020-27","y":2020,"n":27,"q":"A는 주택 투자를 위해 은행으로부터 다음과 같은 조건으로 대출을 받았다. A가 7년 후까지 원리금을 정상적으로 상환했을 경우, 미상환 원금잔액은? (단, 주어진 조건에 한함. 1.04-7 ≒ 0.76, 1.04-13 ≒ 0.6, 1.04-20 ≒ 0.46으로 계산. 천원 단위에서 반올림)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>대출원금: 5억원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출금리: 연 4%(고정금리)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출기간: 20년<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>상환방식: 연 1회 원리금균등분할상환<\/span><\/div>","o":["2억 2,222만원","3억 263만원","3억 7,037만원","3억 8,333만원","3억 9,474만원"],"a":[2],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. 잔금비율 = (1−0.6)/(1−0.46) = 0.4/0.54 ≈ 0.7407. 잔액 = 5억 × 0.7407 ≈ 3억 7,037만원.","오답. 계산 결과와 다르다.","오답. 상환비율과 잔금비율을 혼동한 값이다."],"k":"잔금비율 = 잔여기간 연금현가계수 ÷ 전체기간 연금현가계수 = (1−1.04⁻¹³)/(1−1.04⁻²⁰).","note":"","t":"투자·금융"},{"id":"2020-28","y":2020,"n":28,"q":"부동산 투자분석 기법에 관한 설명으로 옳지 않은 것은?","box":"","o":["다른 조건이 일정하다면, 승수법에서는 승수가 클수록 더 좋은 투자안이다.","내부수익률(IRR)은 순현재가치(NPV)를 “0”으로 만드는 할인율이다.","내부수익률(IRR)이 요구수익률보다 클 경우 투자한다.","순현재가치(NPV)가 “0”보다 클 경우 투자한다.","수익성지수(PI)가 “1”보다 클 경우 투자한다."],"a":[0],"e":["틀림(정답). 승수는 투자액을 소득으로 나눈 값(수익률의 역수)이므로 '작을수록' 좋은 투자안이다.","옳음. IRR은 NPV를 0으로 만드는 할인율이다.","옳음. IRR > 요구수익률이면 투자한다.","옳음. NPV > 0이면 투자한다.","옳음. PI > 1이면 투자한다."],"k":"승수(가격/소득)는 수익률의 역수 → 작을수록 유리.","note":"","t":"투자·금융"},{"id":"2020-29","y":2020,"n":29,"q":"다음은 투자 예정 부동산의 향후 1년 동안 예상되는 현금흐름이다. 연간 세후현금흐름은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>단위 면적당 월 임대료 : 20,000원/㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>임대면적 : 100㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>공실손실상당액 : 임대료의 10%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>영업경비 : 유효총소득의 30%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>부채서비스액 : 연 600만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>영업소득세 : 세전현금흐름의 20%<\/span><\/div>","o":["4,320,000원","6,384,000원","7,296,000원","9,120,000원","12,120,000원"],"a":[2],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. PGI = 20,000×100×12 = 2,400만원. EGI = 2,160만원. NOI = 2,160만 × 0.7 = 1,512만원. BTCF = 1,512만 − 600만 = 912만원. ATCF = 912만 × 0.8 = 7,296,000원.","오답. 세전현금흐름(BTCF)이다. 영업소득세를 차감해야 한다.","오답. 계산 결과와 다르다."],"k":"PGI → EGI(−공실) → NOI(−영업경비) → BTCF(−DS) → ATCF(−소득세).","note":"","t":"투자·금융"},{"id":"2020-30","y":2020,"n":30,"q":"화폐의 시간가치에 관한 설명으로 옳지 않은 것은? (단, 다른 조건은 동일함)","box":"","o":["은행으로부터 주택구입자금을 원리금균등분할상환 방식으로 대출한 가구가 매월 상환할 원리금을 계산하는 경우, 저당상수를 사용한다.","일시불의 미래가치계수는 이자율이 상승할수록 커진다.","연금의 현재가치계수와 저당상수는 역수관계이다.","연금의 미래가치계수와 감채기금계수는 역수관계이다.","3년 후에 주택자금 5억원을 만들기 위해 매 기간 납입해야 할 금액을 계산하는 경우, 연금의 미래가치계수를 사용한다."],"a":[4],"e":["옳음. 원리금균등 월 상환액 = 대출액 × 저당상수.","옳음. (1+r)ⁿ은 이자율이 오를수록 커진다.","옳음. 연금현가계수 × 저당상수 = 1.","옳음. 연금내가계수 × 감채기금계수 = 1.","틀림(정답). 미래 일정액을 만들기 위한 매기 납입액은 '감채기금계수'로 구한다."],"k":"미래 목표액을 위한 매기 적립액 = 목표액 × 감채기금계수.","note":"","t":"투자·금융"},{"id":"2020-31","y":2020,"n":31,"q":"부동산 투자에서 위험과 수익에 관한 설명으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["투자자의 요구수익률에는 위험할증률이 포함된다.","투자자가 위험기피자일 경우, 위험이 증가할수록 투자자의 요구수익률도 증가한다.","투자자의 개별적인 위험혐오도에 따라 무위험률이 결정된다.","체계적 위험은 분산투자에 의해 제거될 수 없다.","위험조정할인율이란 장래 기대소득을 현재가치로 할인할 때 위험한 투자일수록 높은 할인율을 적용하는 것을 말한다."],"a":[2],"e":["옳음. 요구수익률에는 위험할증률이 포함된다.","옳음. 위험기피자는 위험이 클수록 더 높은 수익률을 요구한다.","틀림(정답). 투자자의 위험혐오도에 따라 결정되는 것은 '위험할증률'이다. 무위험률은 시장(국채 금리 등)에서 결정되며 시간가치를 반영한다.","옳음. 체계적 위험은 분산투자로 제거되지 않는다.","옳음. 위험조정할인율법의 설명이다."],"k":"요구수익률 = 무위험률(시간가치, 시장에서 결정) + 위험할증률(투자자의 위험혐오도에 따라 다름).","note":"","t":"투자·금융"},{"id":"2020-32","y":2020,"n":32,"q":"토지에 관한 설명으로 옳지 않은 것은?","box":"","o":["빈지는 일반적으로 바다와 육지 사이의 해변 토지와 같이 소유권이 인정되며 이용실익이 있는 토지이다.","맹지는 타인의 토지에 둘러싸여 도로에 어떤 접속면도 가지지 못하는 토지이며, 건축법에 의해 원칙적으로 건물을 세울 수 없다.","법지는 택지경계와 접한 경사된 토지부분과 같이 법률상으로는 소유를 하고 있지만 이용실익이 없는 토지이다.","후보지는 부동산의 주된 용도적 지역인 택지지역, 농지지역, 임지지역 상호간에 전환되고 있는 지역의 토지이다.","이행지는 부동산의 주된 용도적 지역인 택지지역, 농지지역, 임지지역의 세분된 지역내에서 용도전환이 이루어지고 있는 토지이다."],"a":[0],"e":["틀림(정답). 빈지는 해변 토지로서 이용실익은 있으나 '소유권이 인정되지 않는' 토지이다.","옳음. 맹지는 도로에 접하지 않아 건축법상 원칙적으로 건축이 불가능하다.","옳음. 법지는 소유권은 있지만 이용실익이 없는 경사지이다.","옳음. 후보지의 정의이다.","옳음. 이행지의 정의이다."],"k":"빈지 = 바다와 육지 사이 해변 토지로 '소유권이 인정되지 않음'. 법지 = 소유권은 있으나 이용실익 없는 경사지.","note":"","t":"부동산학 총론"},{"id":"2020-33","y":2020,"n":33,"q":"공간으로서의 부동산에 관한 설명으로 옳지 않은 것은?","box":"","o":["토지는 물리적 형태로서의 지표면과 함께 공중공간과 지하공간을 포함한다.","부동산활동은 3차원의 공간활동으로 농촌지역에서는 주로 지표공간이 활동의 중심이 되고, 도시지역에서는 입체공간이 활동의 중심이 된다.","지표권은 토지소유자가 지표상의 토지를 배타적으로 사용할 수 있는 권리를 말하며, 토지와 해면과의 분계는 최고만조시의 분계점을 표준으로 한다.","지중권 또는 지하권은 토지소유자가 지하공간으로부터 어떤 이익을 획득하거나 사용할 수 있는 권리를 말하며, 물을 이용할 수 있는 권리가 이에 포함된다.","공적 공중권은 일정 범위 이상의 공중공간을 공공기관이 공익목적의 실현을 위해 사용할 수 있는 권리를 말하며, 항공기 통행권이나 전파의 발착권이 이에 포함된다."],"a":[3],"e":["옳음. 토지는 지표·공중·지하를 포함하는 3차원 공간이다.","옳음. 농촌은 지표, 도시는 입체공간 활동이 중심이다.","옳음. 토지와 해면의 경계는 최고만조 시 분계점이 기준이다.","틀림(정답). 물을 이용할 수 있는 권리는 '지표권'에 포함된다.","옳음. 공적 공중권에는 항공기 통행권, 전파 발착권 등이 있다."],"k":"물을 이용할 권리(수리권 등)는 '지표권'의 내용. 지중권 = 지하공간 이용·광물 등.","note":"","t":"부동산학 총론"},{"id":"2020-34","y":2020,"n":34,"q":"한국표준산업분류(KSIC)에 따른 부동산업의 세분류 항목으로 옳지 않은 것은?","box":"","o":["주거용 건물 건설업","부동산 임대업","부동산 개발 및 공급업","부동산 관리업","부동산 중개, 자문 및 감정평가업"],"a":[0],"e":["옳지 않음(정답). 주거용 건물 건설업은 '건설업'에 속하며 부동산업의 세분류가 아니다.","옳음. 부동산 임대업은 부동산업에 속한다.","옳음. 부동산 개발 및 공급업은 부동산업에 속한다.","옳음. 부동산 관리업은 부동산 관련 서비스업에 속한다.","옳음. 부동산 중개, 자문 및 감정평가업은 부동산 관련 서비스업에 속한다."],"k":"KSIC 부동산업: 부동산 임대 및 공급업(임대업, 개발 및 공급업) + 부동산 관련 서비스업(관리업, 중개·자문·감정평가업). 건설업은 별도 대분류.","note":"","t":"부동산학 총론"},{"id":"2020-36","y":2020,"n":36,"q":"부동산가치의 발생요인에 관한 설명으로 옳지 않은 것은?","box":"","o":["유효수요는 구입의사와 지불능력을 가지고 있는 수요이다.","효용(유용성)은 인간의 필요나 욕구를 만족시킬 수 있는 재화의 능력이다.","효용(유용성)은 부동산의 용도에 따라 주거지는 쾌적성, 상업지는 수익성, 공업지는 생산성으로 표현할 수 있다.","부동산은 용도적 관점에서 대체성이 인정되고 있기 때문에 절대적 희소성이 아닌 상대적 희소성을 가지고 있다.","이전성은 법률적인 측면이 아닌 경제적인 측면에서의 가치발생요인이다."],"a":[4],"e":["옳음. 유효수요는 구매의사와 지불능력을 갖춘 수요이다.","옳음. 효용의 정의이다.","옳음. 용도별로 쾌적성·수익성·생산성으로 표현된다.","옳음. 용도적 대체성이 있어 상대적 희소성을 가진다.","틀림(정답). 이전성은 소유권 이전이 가능해야 한다는 '법률적' 측면의 가치발생요인이다."],"k":"가치발생요인: 효용, 상대적 희소성, 유효수요(경제적) + 이전성(법률적).","note":"","t":"감정평가"},{"id":"2020-37","y":2020,"n":37,"q":"공인중개사법령에 관한 설명으로 옳은 것은?","box":"","o":["공인중개사법에 의한 공인중개사자격을 취득한 자를 개업공인중개사라고 말한다.","선박법 및 선박등기법에 따라 등기된 20톤 이상의 선박은 공인중개사법에 의한 중개대상물이다.","개업공인중개사에 소속된 공인중개사인 자로서 중개업무를 수행하는 자는 소속공인중개사가 아니다.","중개업은 다른 사람의 의뢰에 의하여 일정한 보수를 받고 중개를 업으로 행하는 것을 말한다.","중개보조원이란 공인중개사가 아닌 자로서 중개업을 하는 자를 말한다."],"a":[3],"e":["틀림. 자격을 취득한 자는 '공인중개사'이고, 개업공인중개사는 중개사무소 개설등록을 한 자이다.","틀림. 선박은 중개대상물이 아니다.","틀림. 개업공인중개사에 소속된 공인중개사로서 중개업무를 수행하거나 보조하는 자는 '소속공인중개사'이다.","정답. 중개업의 정의이다.","틀림. 중개보조원은 공인중개사가 아닌 자로서 개업공인중개사에 소속되어 현장안내·일반서무 등을 보조하는 자이다."],"k":"개업공인중개사 = 중개사무소 개설등록을 한 자. 소속공인중개사 = 개업공인중개사에 소속된 공인중개사. 중개보조원 = 공인중개사가 아닌 자로서 보조업무 수행.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2020-38","y":2020,"n":38,"q":"부동산 거래신고 등에 관한 법률상 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["거래당사자 중 일방이 지방자치단체인 경우에는 지방자치단체가 신고를 하여야 한다.","공동으로 중개한 경우에는 해당 개업공인중개사가 공동으로 신고하여야 하며, 일방이 신고를 거부한 경우에는 단독으로 신고할 수 있다.","거래당사자는 그 실제 거래가격 등을 거래계약의 체결일부터 30일 이내에 공동으로 신고해야 한다.","누구든지 개업공인중개사에게 부동산 거래의 신고를 하지 아니하게 하거나 거짓으로 신고하도록 요구하는 행위를 하여서는 아니 된다.","거래당사자가 부동산의 거래신고를 한 후 해당 거래계약이 취소된 경우에는 취소가 확정된 날부터 60일 이내에 해당 신고관청에 공동으로 신고하여야 한다."],"a":[4],"e":["옳음. 일방이 국가·지자체 등이면 그 기관이 신고한다.","옳음. 공동중개 시 공동신고하며 일방이 거부하면 단독 신고할 수 있다.","옳음. 계약체결일부터 30일 이내 공동 신고한다.","옳음. 신고하지 않게 하거나 거짓신고를 요구하는 행위는 금지된다.","틀림(정답). 거래계약이 해제·무효·취소된 경우 확정된 날부터 '30일' 이내에 신고해야 한다."],"k":"거래신고: 계약일부터 30일 이내. 해제·무효·취소 신고: 확정된 날부터 30일 이내.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2020-39","y":2020,"n":39,"q":"A지역 주택시장의 시장수요함수는 2QD = 200 - P이고 시장공급함수는 3QS = 60 + P이다. (QD : 수요량, QS : 공급량, P : 가격, 단위는 만호, 만원임) 정부가 부동산거래세를 수요측면에 단위당 세액 10만원의 종량세의 형태로 부과하는 경우에 A지역 주택시장 부동산거래세의 초과부담은? (단, 다른 조건은 동일함)","box":"","o":["8억원","10억원","12억원","20억원","24억원"],"a":[1],"e":["오답. 계산 결과와 다르다.","정답. 조세 전: 2Q=200−P, 3Q=60+P → Q=52, P=96. 조세 후(수요측 10): 2Q=190−P → 5Q=250, Q=50. 감소 2만호 → ½ × 10만원 × 2만호 = 10억원.","오답. 계산 결과와 다르다.","오답. ½을 곱하지 않은 값이다.","오답. 계산 결과와 다르다."],"k":"초과부담(사중손실) = ½ × 단위당 세액 × 거래량 감소분. 수요측·공급측 부과 결과는 같다.","note":"","t":"정책·조세"},{"id":"2020-40","y":2020,"n":40,"q":"부동산 관련 조세는 과세주체 또는 과세권자에 따라 국세와 지방세로 구분된다. 이 기준에 따라 동일한 유형으로 분류된 것은?","box":"","o":["취득세, 상속세, 증여세","종합부동산세, 증여세, 취득세","등록면허세, 소득세, 부가가치세","소득세, 상속세, 재산세","취득세, 등록면허세, 재산세"],"a":[4],"e":["오답. 취득세는 지방세, 상속세·증여세는 국세로 섞여 있다.","오답. 취득세만 지방세이다.","오답. 등록면허세만 지방세이다.","오답. 재산세만 지방세이다.","정답. 취득세·등록면허세·재산세는 모두 지방세이다."],"k":"국세: 종합부동산세, 상속세, 증여세, 소득세(양도소득세), 부가가치세. 지방세: 취득세, 등록면허세, 재산세.","note":"","t":"정책·조세"},{"id":"2021-01","y":2021,"n":1,"q":"부동산의 개념에 관한 설명으로 옳지 않은 것은?","box":"","o":["자연·공간·위치·환경 속성은 물리적 개념에 해당한다.","부동산의 절대적 위치는 토지의 부동성에서 비롯된다.","토지는 생산의 기본요소이면서 소비재가 된다.","협의의 부동산과 준부동산을 합쳐 광의의 부동산이라고 한다.","부동산의 법률적·경제적·물리적 측면을 결합한 개념을 복합부동산이라고 한다."],"a":[4],"e":["옳음. 자연·공간·위치·환경은 물리적(기술적) 개념에 속한다.","옳음. 부동성(지리적 위치의 고정성)으로 절대적 위치가 형성된다.","옳음. 토지는 생산요소이자 소비재(주거·여가 등)이다.","옳음. 협의의 부동산(토지와 정착물) + 준부동산 = 광의의 부동산이다.","틀림(정답). 법률적·경제적·물리적 측면을 결합한 개념은 '복합개념'이다. 복합부동산은 토지와 건물이 결합되어 일체로 거래되는 부동산을 말한다."],"k":"부동산의 복합개념 = 법률적·경제적·기술적(물리적) 측면 결합. 복합부동산 = 토지와 건물이 결합되어 하나의 부동산으로 거래되는 것.","note":"","t":"부동산학 총론"},{"id":"2021-02","y":2021,"n":2,"q":"토지의 분류 및 용어에 관한 설명으로 옳은 것은?","box":"","o":["필지는 법률적 개념으로 다른 토지와 구별되는 가격수준이 비슷한 일단의 토지이다.","후보지는 부동산의 용도적 지역인 택지지역, 농지지역, 임지지역 상호간에 전환되고 있는 지역의 토지이다.","나지는 [건축법]에 의한 건폐율*용적률 등의 제한으로 인해 한 필지 내에서 건축하지 않고 비워둔 토지이다.","표본지는 지가의 공시를 위해 가치형성요인이 같거나 유사하다고 인정되는 일단의 토지 중에서 선정한 토지이다.","공한지는 특정의 지점을 기준으로 한 택지이용의 최원방권의 토지이다."],"a":[1],"e":["틀림. 가격수준이 비슷한 일단의 토지는 '획지'이며 경제적 개념이다. 필지는 법률적 등록단위이다.","정답. 후보지는 택지·농지·임지 등 용도적 지역 상호 간에 전환되고 있는 지역의 토지이다.","틀림. 건폐율·용적률 제한으로 비워둔 토지는 '공지'이다.","틀림. 지가공시를 위해 선정한 토지는 '표준지'이다. 표본지는 지가변동률 산정을 위한 토지이다.","틀림. 택지이용의 최원방권 토지는 '한계지'이다. 공한지는 도시 내 택지 중 지가상승만 기대하고 장기간 방치하는 토지이다."],"k":"필지=법률적 등록단위, 획지=가격수준이 비슷한 경제적 단위, 공지=건폐율 등으로 비워둔 땅, 표준지=지가공시용, 표본지=지가변동률 산정용, 한계지=택지이용 최원방권.","note":"","t":"부동산학 총론"},{"id":"2021-03","y":2021,"n":3,"q":"토지의 특성에 관한 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>부증성으로 인해 이용전환을 통한 토지의 용도적 공급이 불가능하다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>부동성으로 인해 부동산 활동이 국지화된다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>영속성으로 인해 토지는 감가상각에서 배제되는 자산이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>개별성으로 인해 외부효과가 발생한다.<\/span><\/div>","o":["ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":[1],"e":["오답. ㄱ·ㄹ 모두 틀렸다.","정답. ㄴ(부동성 → 국지화)과 ㄷ(영속성 → 감가상각 배제)이 옳다. ㄱ: 용도전환을 통한 용도적(경제적) 공급은 가능하다. ㄹ: 외부효과는 부동성(위치고정성)·인접성 때문이다.","오답. ㄱ이 틀렸다.","오답. ㄹ이 틀렸다.","오답. ㄱ·ㄹ이 틀렸다."],"k":"부증성: 물리적 공급 불가(용도적 공급은 용도의 다양성으로 가능). 부동성 → 국지화·외부효과. 영속성 → 감가상각 배제.","note":"","t":"부동산학 총론"},{"id":"2021-04","y":2021,"n":4,"q":"부동산수요의 가격탄력성에 관한 설명으로 옳지 않은 것은? (단, 다른 조건은 동일함)","box":"","o":["수요곡선 기울기의 절대값이 클수록 수요의 가격탄력성이 작아진다.","임대주택 수요의 가격탄력성이 1보다 작을 경우 임대료가 상승하면 전체 수입은 증가한다.","대체재가 많을수록 수요의 가격탄력성이 크다.","일반적으로 부동산의 용도전환 가능성이 클수록 수요의 가격탄력성이 커진다.","수요의 가격탄력성이 비탄력적이면 가격의 변화율보다 수요량의 변화율이 더 크다."],"a":[4],"e":["옳음. (일반적으로) 기울기가 가파를수록 탄력성이 작다.","옳음. 비탄력적이면 임대료 상승률 > 수요량 감소율이므로 총수입이 증가한다.","옳음. 대체재가 많을수록 탄력적이다.","옳음. 용도전환이 쉬울수록 다른 용도로 대체가 가능해 탄력적이다.","틀림(정답). 비탄력적이면 수요량의 변화율이 가격의 변화율보다 '작다'."],"k":"비탄력적(탄력성 < 1): 수요량 변화율 < 가격 변화율 → 가격 인상 시 총수입 증가.","note":"","t":"시장·입지·지대"},{"id":"2021-06","y":2021,"n":6,"q":"도시공간구조이론에 관한 설명으로 옳지 않은 것은?","box":"","o":["동심원이론은 도시공간구조의 형성을 침입, 경쟁, 천이 과정으로 설명하였다.","동심원이론에 따르면 중심지에서 멀어질수록 지대 및 인구밀도가 낮아진다.","선형이론에서의 점이지대는 중심업무지구에 직장 및 생활터전이 있어 중심업무지구에 근접하여 거주하는 지대를 말한다.","선형이론에 따르면 도시공간구조의 성장 및 분화가 주요 교통노선을 따라 부채꼴 모양으로 확대된다.","다핵심이론에 따르면 하나의 중심이 아니라 몇 개의 분리된 중심이 점진적으로 통합됨에 따라 전체적인 도시공간구조가 형성된다."],"a":[2],"e":["옳음. 버제스의 동심원이론은 생태학적 개념(침입·경쟁·천이)으로 도시 성장을 설명한다.","옳음. 중심에서 멀어질수록 접근성이 떨어져 지대·인구밀도가 낮아진다.","틀림(정답). 점이지대는 '동심원이론'의 지대이다. 또한 점이지대는 CBD 인접 지역으로 저소득층과 경공업이 혼재된 지대이다.","옳음. 호이트의 선형이론은 교통노선을 따라 부채꼴로 성장한다고 보았다.","옳음. 해리스·울만의 다핵심이론은 여러 핵심이 존재·통합되며 도시가 형성된다고 보았다."],"k":"점이지대(천이지대)는 '동심원이론'의 개념(중심업무지구 바로 바깥, 저소득층·공장 혼재).","note":"","t":"시장·입지·지대"},{"id":"2021-07","y":2021,"n":7,"q":"A토지에 접하여 도시·군계획시설(도로)이 개설될 확률은 60%로 알려져 있고, 1년 후에 해당 도로가 개설되면 A토지의 가치는 2억 7,500만원, 그렇지 않으면 9,350만원으로 예상된다. 만약 부동산시장이 할당효율적이라면 합리적인 투자자가 최대한 지불할 수 있는 정보비용의 현재가치는? (단, 요구수익률은 연10%이고, 주어진 조건에 한함)","box":"","o":["5,200만원","5,600만원","6,200만원","6,600만원","7,200만원"],"a":[3],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. 확실 시 2억 7,500만/1.1 = 2억 5,000만원. 불확실 시 (2억 7,500만×0.6 + 9,350만×0.4)/1.1 = (1억 6,500만 + 3,740만)/1.1 = 1억 8,400만원. 정보가치 = 6,600만원.","오답. 할인 없이 계산하는 등 잘못된 값이다."],"k":"정보가치 = (확실한 경우의 현가) − (불확실한 경우의 기대현가).","note":"","t":"시장·입지·지대"},{"id":"2021-08","y":2021,"n":8,"q":"부동산시장의 특성으로 옳은 것은?","box":"","o":["일반상품의 시장과 조직성을 갖고 지역을 확대하는 특성이 있다.","토지의 인문적 특성인 지리적 위치의 고정성으로 인하여 개별화된다.","매매의 단기성으로 인하여 유동성과 환금성이 우수하다.","거래정보의 대칭성으로 인하여 정보수집이 쉽고 은밀성이 축소된다.","부동산의 개별성으로 인한 부동산상품의 비표준화로 복잡·다양하게 된다."],"a":[4],"e":["틀림. 부동산시장은 '비조직적'이며 지역적으로 국지화되는 특성이 있다.","틀림. 지리적 위치의 고정성(부동성)은 '자연적' 특성이며, 이로 인해 시장이 국지화된다.","틀림. 매매기간이 '장기'여서 유동성·환금성이 낮다.","틀림. 거래정보가 '비대칭'이고 은밀하다.","정답. 개별성으로 부동산상품이 비표준화되어 시장이 복잡·다양해진다."],"k":"부동산시장: 비조직성, 국지성(자연적 특성인 부동성), 거래의 장기성(유동성 낮음), 정보 비대칭·은밀성, 상품의 비표준화.","note":"","t":"시장·입지·지대"},{"id":"2021-10","y":2021,"n":10,"q":"다음 중 현행 부동산가격공시제도에 관한 설명으로 옳은 것은 몇 개인가?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>표준주택가격의 조사·평가는 감정평가사가 담당한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>개별주택가격의 공시기준일이 6월 1일인 경우도 있다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>공동주택가격의 공시권자는 시장·군수·구청장이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>표준지공시지가는 표준지의 사용·수익을 제한하는 사법상의 권리가 설정되어 있는 경우 이를 반영하여 평가한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㅁ<\/span><span>개별공시지가는 감정평가법인 등이 개별적으로 토지를 감정평가하는 경우에 기준이 된다.<\/span><\/div>","o":["없음","1개","2개","3개","4개"],"a":[1],"e":["오답. ㄴ 하나는 옳다.","정답(1개). ㄴ만 옳다(1.1~5.31 사이 분할·합병 등이 있으면 6월 1일 기준으로 공시). ㄱ: 표준주택은 한국부동산원이 조사·산정, ㄷ: 공동주택가격은 국토교통부장관이 공시, ㄹ: 사법상 권리는 없는 것으로 보고 평가, ㅁ: 감정평가 기준은 표준지공시지가이다.","오답. 1개만 옳다.","오답. 1개만 옳다.","오답. 1개만 옳다."],"k":"표준주택 조사·산정 = 한국부동산원, 공동주택가격 공시 = 국토교통부장관, 표준지는 사법상 권리 없는 것으로 상정, 감정평가 기준 = 표준지공시지가.","note":"","t":"감정평가"},{"id":"2021-11","y":2021,"n":11,"q":"A는 표준지공시지가의 감정평가를 의뢰받고 현장조사를 통해 표준지에 대해 다음과 같이 확인하였다. 표준지조사평가보고서상 토지특성 기재방법의 연결이 옳은 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>지형지세 : 간선도로 또는 주위의 지형지세보다 높고 경사도가 15도를 초과하는 지대의 토지<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>도로접면 : 폭 12m 이상 25m 미만 도로에 한면이 접하고 있는 토지<\/span><\/div>","o":["ㄱ : 급경사, ㄴ : 광대한면","ㄱ : 급경사, ㄴ : 중로한면","ㄱ : 고지, ㄴ : 광대한면","ㄱ : 고지, ㄴ : 중로한면","ㄱ : 고지, ㄴ : 소로한면"],"a":[1],"e":["오답. 12m 이상 25m 미만은 광대로가 아니라 중로이다.","정답. ㄱ: 경사도 15도 초과 → 급경사, ㄴ: 폭 12m 이상 25m 미만 → 중로한면.","오답. 경사도 15도 초과는 급경사이고, 도로도 중로이다.","오답. ㄱ은 급경사이다. 고지는 주위보다 현저히 높은 지대이다.","오답. ㄱ은 급경사, ㄴ은 중로한면이다."],"k":"지형지세: 급경사 = 경사도 15° 초과. 도로접면: 광대로 25m 이상, 중로 12~25m, 소로 8~12m, 세로 8m 미만.","note":"","t":"감정평가"},{"id":"2021-12","y":2021,"n":12,"q":"우리나라의 부동산제도와 근거법률의 연결이 옳은 것은?","box":"","o":["토지거래허가제 - 「부동산 거래신고 등에 관한 법률」","검인계약서제 - 「부동산등기법」","토지은행제 - 「공익사업을 위한 토지 등의 취득 및 보상에 관한 법률」","개발부담금제 - 「재건축 초과이익 환수에 관한 법률」","분양가상한제 - 「건축물의 분양에 관한 법률」"],"a":[0],"e":["정답. 토지거래허가제는 「부동산 거래신고 등에 관한 법률」에 근거한다.","오답. 검인계약서제는 「부동산등기 특별조치법」에 근거한다.","오답. 토지은행제는 「공공토지의 비축에 관한 법률」에 근거한다.","오답. 개발부담금제는 「개발이익 환수에 관한 법률」에 근거한다.","오답. 분양가상한제는 「주택법」에 근거한다."],"k":"검인계약서 = 부동산등기 특별조치법, 토지은행 = 공공토지의 비축에 관한 법률, 개발부담금 = 개발이익 환수에 관한 법률, 분양가상한제 = 주택법.","note":"","t":"정책·조세"},{"id":"2021-13","y":2021,"n":13,"q":"국토의 계획 및 이용에 관한 법령상 현재 지정될 수 있는 용도지역을 모두 고른 것은?","box":"<div class=\"chips\"><span class=\"chip\">ㄱ. 준상업지역<\/span><span class=\"chip\">ㄴ. 준주거지역<\/span><\/div><div class=\"chips\"><span class=\"chip\">ㄷ. 준공업지역<\/span><span class=\"chip\">ㄹ. 준농림지역<\/span><\/div>","o":["ㄱ, ㄴ","ㄴ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄷ","ㄴ, ㄷ, ㄹ"],"a":[1],"e":["오답. 준상업지역은 존재하지 않는다(상업지역은 중심·일반·근린·유통상업).","정답. 준주거지역(주거지역 세분)과 준공업지역(공업지역 세분)은 현행 용도지역이다.","오답. 준농림지역은 2003년 국토계획법 제정으로 폐지되어 관리지역으로 통합되었다.","오답. 준상업지역은 없다.","오답. 준농림지역은 현재 없다."],"k":"현행 용도지역: 도시(주거·상업·공업·녹지), 관리(보전·생산·계획), 농림, 자연환경보전. 준상업지역·준농림지역은 없음.","note":"","t":"정책·조세"},{"id":"2021-14","y":2021,"n":14,"q":"다음 중 부동산시장과 부동산정책에 관한 설명으로 옳은 것은 몇 개인가?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>부동산정책이 자원배분의 비효율성을 오히려 악화시키는 것을 시장의 실패라 한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>법령상 도입순서를 비교하면 부동산거래신고제는 부동산실명제보다 빠르다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>개발행위허가제와 택지소유상한제는 현재 시행되고 있는 제도이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>분양가상한제와 개발부담금제는 정부가 직접적으로 부동산시장에 개입하는 정책수단이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㅁ<\/span><span>PIR(Price to Income Ratio)은 가구의 주택지불능력을 측정하는 지표이다.<\/span><\/div>","o":["없음","1개","2개","3개","4개"],"a":[1],"e":["오답. ㅁ 하나는 옳다.","정답(1개). ㅁ(PIR은 주택지불능력 지표)만 옳다. ㄱ은 정부실패, ㄴ은 실명제가 먼저, ㄷ의 택지소유상한제는 폐지, ㄹ의 개발부담금제는 간접개입이다.","오답. 1개만 옳다.","오답. 1개만 옳다.","오답. 1개만 옳다."],"k":"정부실패 = 정책이 비효율을 악화. 부동산실명제(1995) → 거래신고제(2006). 택지소유상한제 폐지. 분양가상한제 = 직접개입, 개발부담금 = 간접개입.","note":"","t":"정책·조세"},{"id":"2021-15","y":2021,"n":15,"q":"비율분석법을 이용하여 산출한 것으로 옳지 않은 것은? (단, 주어진 조건에 한하면, 연간 기준임)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>주택담보대출액 : 2억원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>주택담보대출의 연간 원리금상환액 : 1천만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>부동산가치 : 4억원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>차입자의 연소득 : 5천만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>가능총소득 : 4천만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>공실손실상당액 및 대손충당금 : 가능총소득의 25%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>영업경비 : 가능총소득의 50%<\/span><\/div>","o":["부채감당률(DCR) = 1.0","채무불이행률(DR) = 1.0","총부채상환비율(DTI) = 0.2","부채비율(debt ratio) = 1.0","영업경비비율(OER, 유효총소득 기준) = 0.8"],"a":[4],"e":["옳음. NOI = 4,000×(1−0.25) − 2,000 = 1,000만원, DCR = 1,000/1,000 = 1.0.","옳음. DR = (2,000+1,000)/3,000 = 1.0.","옳음. DTI = 1,000/5,000 = 0.2.","옳음. 부채비율 = 2억/(4억−2억) = 1.0.","틀림(정답). OER = 영업경비 2,000 ÷ 유효총소득 3,000 ≈ 0.67이다. 0.8이 아니다."],"k":"DCR = NOI/DS, DR = (OE+DS)/EGI, DTI = DS/연소득, 부채비율 = 부채/자기자본, OER = OE/EGI.","note":"","t":"투자·금융"},{"id":"2021-16","y":2021,"n":16,"q":"사업기간 초에 3억원을 투자하여 다음과 같은 현금유입의 현재가치가 발생하는 투자사업이 있다. 이 경우 보간법으로 산출한 내부수익률은?","box":"<table class=\"bt\"><tr><td colspan=\"9\" class=\"cap\">현금유입의 현재가치(단위: 천원)<\/td><\/tr><tr><td>할인율 5%인 경우<\/td><td>할인율 6%인 경우<\/td><\/tr><tr><td>303,465<\/td><td>295,765<\/td><\/tr><\/table>","o":["5.42%","5.43%","5.44%","5.45%","5.46%"],"a":[3],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. 5%에서 NPV = +3,465천원, 6%에서 NPV = −4,235천원. 차이 7,700천원. IRR = 5% + 3,465/7,700 × 1% = 5% + 0.45% = 5.45%.","오답. 계산 결과와 다르다."],"k":"보간법: IRR = 저할인율 + (저할인율의 NPV ÷ 두 NPV 차이의 절댓값) × 할인율 차이.","note":"","t":"투자·금융"},{"id":"2021-17","y":2021,"n":17,"q":"포트폴리오 이론에 관한 설명으로 옳지 않은 것은?","box":"","o":["부동산투자에 수반되는 총위험은 체계적 위험과 비체계적 위험을 합한 것으로, 포트폴리오를 구성함으로써 제거될 수 있는 위험은 비체계적 위험이다.","포트폴리오를 구성하는 자산들의 수익률 간 상관계수가 1인 경우에는 포트폴리오를 구성한다고 하더라도 위험은 감소되지 않는다.","효율적 프론티어(efficient frontier)는 모든 위험수준에서 최대의 기대수익률을 올릴 수 있는 포트폴리오의 집합을 연결한 선이다.","무위험자산이 없는 경우의 최적 포트폴리오는 효율적 프론티어와 투자자의 무차별곡선이 접하는 점에서 결정되는데, 투자자가 위험선호형일 경우 최적 포트폴리오는 위험기피형에 비해 저위험-고수익 포트폴리오가 된다.","위험자산으로만 구성된 포트폴리오와 무위험자산을 결합할 때 얻게 되는 직선의 기울기가 커질수록 기대초과수익률(위험프리미엄)이 커진다."],"a":[3],"e":["옳음. 분산투자로 제거 가능한 위험은 비체계적 위험이다.","옳음. 상관계수가 +1이면 분산효과가 없다.","옳음. 효율적 프론티어는 각 위험수준에서 최대 기대수익률을 주는 포트폴리오의 집합이다.","틀림(정답). 위험선호형 투자자의 최적 포트폴리오는 위험기피형에 비해 '고위험-고수익' 포트폴리오가 된다. 저위험-고수익 포트폴리오는 효율적 프론티어상에 존재할 수 없다.","옳음. 자본시장선의 기울기(샤프비율)가 클수록 위험 1단위당 초과수익률이 크다."],"k":"최적 포트폴리오 = 효율적 프론티어와 무차별곡선의 접점. 위험선호형일수록 '고위험-고수익' 포트폴리오 선택.","note":"","t":"투자·금융"},{"id":"2021-18","y":2021,"n":18,"q":"부동산투자분석기법에 관한 설명으로 옳은 것을 모두 고른 것은? (단, 다른 조건은 동일함)","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>현금유출의 현가합인 4천만원이고 현금유입의 현가합이 5천만원이라면, 수익성지수는 0.8이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>내부수익률은 투자로부터 발생하는 현재와 미래 현금흐름의 순현재가치를 1로 만드는 할인율을 말한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>재투자율로 내부수익률법에서는 요구수익률을 사용하지만, 순현재가치법에서는 시장이자율을 사용한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>내부수익률법, 순현재가치법, 수익성지수법은 할인현금흐름기법에 해당한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㅁ<\/span><span>내부수익률법에서는 내부수익률과 요구수익률을 비교하여 투자여부를 결정한다.<\/span><\/div>","o":["ㄱ, ㄹ","ㄴ, ㄷ","ㄹ, ㅁ","ㄱ, ㄴ, ㅁ","ㄷ, ㄹ, ㅁ"],"a":[2],"e":["오답. ㄱ은 틀렸다. PI = 5,000/4,000 = 1.25이다.","오답. ㄴ: NPV를 0으로 만드는 할인율이다. ㄷ: IRR법은 IRR로, NPV법은 요구수익률로 재투자한다고 가정한다.","정답. ㄹ(IRR·NPV·PI는 할인현금흐름기법)과 ㅁ(IRR과 요구수익률 비교)이 옳다.","오답. ㄱ·ㄴ이 틀렸다.","오답. ㄷ이 틀렸다."],"k":"PI = 유입현가/유출현가. IRR = NPV를 0으로 하는 할인율. 재투자율: IRR법 = IRR, NPV법 = 요구수익률.","note":"","t":"투자·금융"},{"id":"2021-19","y":2021,"n":19,"q":"화폐의 시간가치계산에 관한 설명으로 옳은 것은?","box":"","o":["연금의 현재가치계수에 일시불의 미래가치계수를 곱하면 연금의 미래가치계수가 된다.","원금균등분할상환방식에서 매 기간의 상환액을 계산할 경우 저당상수를 사용한다.","기말에 일정 누적액을 만들기 위해 매 기간마다 적립해야 할 금액을 계산할 경우 연금의 현재가치계수를 사용한다.","연금의 미래가치계수에 일시불의 현재가치계수를 곱하면 일시불의 미래가치계수가 된다.","저당상수에 연금의 현재가치계수를 곱하면 일시불의 현재가치가 된다."],"a":[0],"e":["정답. 연금현가계수 × 일시불내가계수(1+r)ⁿ = 연금내가계수이다.","틀림. 저당상수는 '원리금균등분할상환'의 매기 상환액 계산에 쓴다.","틀림. 기말 목표액을 위한 매기 적립액은 '감채기금계수'로 구한다.","틀림. 연금내가계수 × 일시불현가계수 = 연금현가계수이다.","틀림. 저당상수 × 연금현가계수 = 1이다(역수 관계)."],"k":"PVAF × (1+r)ⁿ = FVAF. 저당상수 × PVAF = 1. 감채기금계수 = 적립액 계산.","note":"","t":"투자·금융"},{"id":"2021-20","y":2021,"n":20,"q":"부동산 금융에 관한 설명으로 옳은 것은?","box":"","o":["역모기지(reverse mortgage)는 시간이 지남에 따라 대출잔액이 늘어나는 구조이고, 일반적으로 비소구형 대출이다.","가치상승공유형대출(SAM : Shared Appreciation Mortgage)은 담보물의 가치상승 일부분을 대출자가 사전약정에 의해 차입자에게 이전하기로 하는 조건의 대출이다.","기업의 구조조정을 촉진하기 위하여 기업구조조정 부동산투자회사에 대여하는 현물출자, 자산구성, 최저자본금을 제한하는 규정이 없다.","부채금융은 대출이나 회사채 발행 등을 통해 타인자본을 조달하는 방법으로서 저당담보부증권(MBS), 조인트벤처(joint venture) 등이 있다.","우리나라의 공적보증형태 역모기지제도를 현재 주택연금, 농지연금, 산지연금이 시행되고 있다."],"a":[0],"e":["정답. 역모기지는 매기 연금을 지급받아 대출잔액이 점점 증가하며, 담보가치를 넘는 부분은 상환청구하지 않는 비소구형이 일반적이다.","틀림. SAM은 '차입자'가 가치상승분의 일부를 '대출자'에게 이전하는 대신 낮은 금리로 빌리는 대출이다.","틀림. 기업구조조정 리츠도 최저자본금 등 제한 규정이 있다(일부 규정만 특례).","틀림. 조인트벤처는 지분금융이다. MBS는 부채금융의 예가 될 수 있다.","틀림. 공적 역모기지는 주택연금·농지연금이 시행 중이며 산지연금은 없다."],"k":"역모기지: 대출잔액 증가(역연금), 비소구형. SAM: 차입자가 가치상승분 일부를 대출자에게 이전. 조인트벤처 = 지분금융.","note":"","t":"투자·금융"},{"id":"2021-21","y":2021,"n":21,"q":"부동산 증권에 관한 설명으로 옳지 않은 것은?","box":"","o":["MPTS(Mortgage Pass-Through Securities)는 지분을 나타내는 증권으로서 유동화 기관의 부채로 표시되지 않는다.","CMO(Collateralized Mortgage Obligation)는 동일한 저당풀(mortgage pool)에서 상환 우선순위와 만기가 다른 다양한 증권을 발행할 수 있다.","부동산개발PF ABCP(Asset Backed Commercial Paper)는 부동산개발PF ABS (Asset Backed Securities)에 비해 만기가 길고, 대부분 공모로 발행된다.","MPTS(Morgage Pass-Through Securities)는 주택담보대출의 원리금이 회수되면 MPTS의 원리금으로 지급되므로 유동화기관의 자금관리 필요성이 원칙적으로 제거된다.","MBB(Mortgage Backed Bond)는 주택저당대출차입자의 채무불이행이 발생하더라도 MBB에 대한 원리금을 발행자가 투자자에게 지급하여야 한다."],"a":[2],"e":["옳음. MPTS는 지분형 증권으로 유동화기관의 부채로 표시되지 않는다.","옳음. CMO는 하나의 저당풀에서 상환 우선순위·만기가 다른 여러 트랜치를 발행한다.","틀림(정답). PF ABCP는 기업어음 형태로 ABS에 비해 만기가 '짧고' 주로 '사모'로 발행된다.","옳음. MPTS는 회수된 원리금이 그대로 투자자에게 이체되므로 유동화기관의 자금관리 필요성이 원칙적으로 없다.","옳음. MBB는 발행자가 채무불이행위험을 부담하므로 차입자가 불이행해도 투자자에게 원리금을 지급해야 한다."],"k":"ABCP = 기업어음(CP) 형태: 단기, 주로 사모·간편 발행. ABS = 장기, 공모 가능.","note":"","t":"투자·금융"},{"id":"2021-22","y":2021,"n":22,"q":"부동산투자회사법령상 자기관리 부동산투자회사가 자산을 투자·운용할 때 상근으로 두어야 하는 자산운용 전문인력에 해당되지 않는 사람은?","box":"","o":["공인회계사로서 해당 분야에 3년 이상 종사한 사람","공인중개사로서 해당 분야에 5년 이상 종사한 사람","감정평가사로서 해당 분야에 5년 이상 종사한 사람","부동산 관련 분야의 석사학위 이상의 소지자로서 부동산의 투자·운용과 관련된 업무에 3년 이상 종사한 사람","자산관리회사에서 5년 이상 근무한 사람으로서 부동산의 취득·처분·관리·개발 또는 자문 등의 업무에 3년 이상 종사한 경력이 있는 사람"],"a":[0],"e":["해당하지 않음(정답). 공인회계사는 법령상 자산운용 전문인력의 요건으로 열거되어 있지 않다.","해당함. 공인중개사로서 해당 분야 5년 이상 종사한 사람이다.","해당함. 감정평가사로서 해당 분야 5년 이상 종사한 사람이다.","해당함. 부동산 관련 석사 이상 + 관련 업무 3년 이상 종사자이다.","해당함. 자산관리회사 등에서 5년 이상 근무하고 관련 업무 3년 이상 경력자이다."],"k":"자기관리 리츠 자산운용 전문인력: 감정평가사·공인중개사 5년 이상, 부동산 석사 이상 + 3년 이상, 자산관리회사 등 5년 이상 근무 + 관련업무 3년 이상 등. 공인회계사는 열거되지 않음.","note":"","t":"투자·금융"},{"id":"2021-23","y":2021,"n":23,"q":"대출조건이 다음과 같을 때, 5년 거치가 있을 경우(A)와 거치가 없을 경우(B)에 원금을 상환해야 할 첫 번째 회차의 상환원금의 차액(A-B)은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>대출금 : 1억 2천만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출금리 : 고정금리, 연 3%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출기간 : 30년<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>월 저당상수(360개월 기준) : 0.00422<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>월 저당상수(300개월 기준) : 0.00474<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>월 원리금균등분할상환방식<\/span><\/div>","o":["52,000원","54,600원","57,200원","59,800원","62,400원"],"a":[4],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. A(거치 5년, 300개월 상환): 1억 2천만 × 0.00474 = 568,800원, B(360개월): 1억 2천만 × 0.00422 = 506,400원. 차액 62,400원(첫 회차 이자는 동일하므로 원금 차액도 이와 같다)."],"k":"거치기간이 있으면 남은 기간(300개월)으로 원리금을 상환 → 저당상수 증가 → 월상환액 증가.","note":"","t":"투자·금융"},{"id":"2021-24","y":2021,"n":24,"q":"조기상환에 관한 설명으로 옳지 않은 것은?","box":"","o":["조기상환이 어느 정도 일어나는가를 측정하는 지표로 조기상환율(CPR : Constant Prepayment Rate)이 있다.","저당대출차입자에게 주어진 조기상환권은 풋옵션(put option)의 일종으로, 차입자가 조기상환을 한다는 것은 대출잔액을 행사가격으로 하여 대출채권을 매각하는 것과 같다.","저당대출차입자의 조기상환 정도에 따라 MPTS(Mortgage Pass-Through Securities)의 현금흐름과 가치가 달라진다.","이자율 하락에 따른 위험을 감안하여 금융기관은 대출기간 중 조기상환을 금지하는 기간을 설정하고, 위반 시에는 위약금으로 조기상환수수료를 부과하기도 한다.","저당대출차입자의 조기상환은 MPTS(Mortgage Pass-Through Securities) 투자자에게 재투자 위험을 유발한다."],"a":[1],"e":["옳음. CPR은 조기상환 정도를 측정하는 지표이다.","틀림(정답). 조기상환권은 대출잔액을 행사가격으로 대출채권을 '매입'하는 콜옵션(call option)에 해당한다.","옳음. 조기상환 정도에 따라 MPTS의 현금흐름·가치가 변한다.","옳음. 조기상환 금지기간과 조기상환수수료를 두기도 한다.","옳음. 조기상환된 자금을 더 낮은 금리로 재투자해야 하는 재투자위험이 생긴다."],"k":"차입자의 조기상환권 = 콜옵션(대출잔액을 행사가격으로 대출채권을 되사는 권리).","note":"","t":"투자·금융"},{"id":"2021-25","y":2021,"n":25,"q":"부동산신탁에 있어 위탁자가 부동산의 관리와 처분을 부동산신탁회사에 신탁한 후 수익증권을 발급받아 이를 담보로 금융기관에서 대출을 받는 신탁방식은?","box":"","o":["관리신탁","처분신탁","담보신탁","개발신탁","명의신탁"],"a":[2],"e":["오답. 관리신탁은 신탁회사가 부동산의 관리를 맡는 신탁이다.","오답. 처분신탁은 처분을 목적으로 하는 신탁이다.","정답. 담보신탁은 위탁자가 부동산을 신탁하고 받은 수익증권(수익권증서)을 담보로 금융기관에서 대출을 받는 방식이다.","오답. 개발(토지)신탁은 신탁회사가 개발·분양·임대까지 수행하는 신탁이다.","오답. 명의신탁은 부동산실명법상 원칙적으로 무효인 명의만 빌리는 약정이다."],"k":"담보신탁: 신탁 후 수익권증서를 받아 이를 담보로 대출. 관리신탁=관리, 처분신탁=처분, 개발(토지)신탁=개발·분양.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2021-26","y":2021,"n":26,"q":"A는 단독주택의 감정평가를 의뢰받고 관련 공부를 통하여 다음과 같은 사항을 확인 하였다. 이 단독주택의 건폐율(ㄱ)과 용적률(ㄴ)은? (단, 주어진 자료에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>토지대장상 토지면적 : 240㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대지 중 도시·군계획시설(공원)저촉 면적 : 40㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>건축물의 용도 : 지하1층(주차장), 지상1층(단독주택), 지상2층(단독주택)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>건축물대장상 건축면적 : 120㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>건축물대장상 각 층 바닥면적 : 지하1층(60㎡), 지상1층(120㎡), 지상2층(120㎡)<\/span><\/div>","o":["ㄱ : 50%, ㄴ : 100%","ㄱ : 50%, ㄴ : 120%","ㄱ : 50%, ㄴ : 150%","ㄱ : 60%, ㄴ : 120%","ㄱ : 60%, ㄴ : 150%"],"a":[3],"e":["오답. 계산 결과와 다르다.","오답. 대지면적을 240㎡로 잘못 본 값이다.","오답. 계산 결과와 다르다.","정답. 대지면적 = 240 − 40 = 200㎡. 건폐율 = 120/200 = 60%. 용적률 = (120+120)/200 = 120%(지하층 제외).","오답. 지하층(60㎡)까지 연면적에 포함한 값이다. 용적률 산정 시 지하층은 제외한다."],"k":"건폐율 = 건축면적/대지면적, 용적률 = 지상층 연면적/대지면적. 도시·군계획시설 저촉 부분은 대지면적에서 제외.","note":"","t":"부동산학 총론"},{"id":"2021-27","y":2021,"n":27,"q":"토지개발방식으로서 수용방식과 환지방식의 비교에 관한 설명으로 옳지 않은 것은? (단, 사업구역은 동일함)","box":"","o":["수용방식은 환지방식에 비해 종전 토지소유자에게 개발이익이 귀속될 가능성이 큰 편이다.","수용방식은 환지방식에 비해 사업자의 부담이 큰 편이다.","수용방식은 환지방식에 비해 기반시설의 확보가 용이한 편이다.","환지방식은 수용방식에 비해 사업시행자의 개발토지 매각부담이 적은 편이다.","환지방식은 수용방식에 비해 종전 토지소유자의 재정착이 쉬운 편이다."],"a":[0],"e":["틀림(정답). 종전 토지소유자에게 개발이익이 귀속될 가능성이 큰 것은 '환지방식'이다. 수용방식은 보상금만 받는다.","옳음. 수용방식은 보상비 등 초기 자금부담이 크다.","옳음. 수용방식은 전면매수하므로 기반시설 부지 확보가 쉽다.","옳음. 환지방식은 토지를 소유자에게 돌려주므로 매각할 토지(체비지)가 적다.","옳음. 환지방식은 종전 소유자가 토지를 다시 받으므로 재정착이 쉽다."],"k":"환지방식: 종전 소유자에게 토지로 돌려줌 → 개발이익 귀속, 재정착 용이, 매각부담 적음. 수용방식: 사업자 부담 큼, 기반시설 확보 용이.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2021-28","y":2021,"n":28,"q":"부동산개발사업에 관련된 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>개발기간의 연장, 이자율의 인상, 인플레이션의 영향으로 개발비용이 증가하는 위험은 비용위험에 속한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>개발부동산의 선분양제도는 후분양제도에 비해 사업시행자가 부담하는 시장위험을 줄일 수 있다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>민감도분석에 있어 주요 변수로는 토지구입비, 개발기간, 분양가격 등이 있다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>수익성지수가 1보다 크다는 것은 순현가가 ‘0’(zero)보다 크다는 뜻이다.<\/span><\/div>","o":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":[4],"e":["오답. ㄷ·ㄹ도 옳다.","오답. ㄱ·ㄹ도 옳다.","오답. ㄴ도 옳다.","오답. ㄱ도 옳다.","정답. ㄱ(비용위험), ㄴ(선분양으로 시장위험 감소), ㄷ(민감도분석의 주요 변수), ㄹ(PI > 1 ⇔ NPV > 0) 모두 옳다."],"k":"선분양은 분양위험을 소비자에게 이전 → 시행사의 시장위험↓. PI > 1 ⇔ NPV > 0.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2021-29","y":2021,"n":29,"q":"공인중개사법령상 공인중개사 정책심의위원회에서 공인중개사의 업무에 관하여 심의하는 사항으로 명시되지 않은 것은?","box":"","o":["개업공인중개사의 교육에 관한 사항","부동산 중개업의 육성에 관한 사항","공인중개사의 시험 등 공인중개사의 자격취득에 관한 사항","중개보수 변경에 관한 사항","손해배상책임의 보장 등에 관한 사항"],"a":[0],"e":["명시되지 않음(정답). 개업공인중개사의 교육은 정책심의위원회의 심의사항이 아니다.","명시됨. 부동산 중개업의 육성에 관한 사항이다.","명시됨. 시험 등 공인중개사 자격취득에 관한 사항이다.","명시됨. 중개보수 변경에 관한 사항이다.","명시됨. 손해배상책임의 보장 등에 관한 사항이다."],"k":"공인중개사 정책심의위원회 심의사항: 자격취득(시험), 중개업 육성, 중개보수 변경, 손해배상책임 보장 등. 교육은 해당 없음.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2021-30","y":2021,"n":30,"q":"공인중개사법령상 공인중개사의 중개대상물이 아닌 것은?","box":"<div class=\"bp\">(다툼이 있으면 판례에 따름)<\/div>","o":["토지거래허가구역 내의 토지","가등기가 설정되어 있는 건물","「입목에 관한 법률」에 따른 입목","하천구역에 포함되어 사권이 소멸된 포락지","「공장 및 광업재단 저당법」에 따른 광업재단"],"a":[3],"e":["대상임. 허가구역 내 토지도 허가를 조건으로 중개대상물이 된다.","대상임. 가등기가 설정된 건물도 거래 가능하므로 중개대상물이다.","대상임. 입목은 중개대상물이다.","대상 아님(정답). 하천구역에 포함되어 사권이 소멸된 포락지는 사적 거래의 대상이 될 수 없어 중개대상물이 아니다(판례).","대상임. 광업재단은 중개대상물이다."],"k":"중개대상물: 토지, 건축물 그 밖의 정착물, 입목, 공장·광업재단. 사권이 소멸된 포락지는 거래 대상이 아님.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2021-31","y":2021,"n":31,"q":"우리나라의 부동산조세제도에 관한 설명으로 옳지 않은 것은?","box":"","o":["양도소득세와 취득세는 신고납부방식이다.","취득세와 증여세는 부동산의 취득단계에 부과한다.","양도소득세와 종합부동산세는 국세에 속한다.","상속세와 증여세는 누진세율을 적용한다.","종합부동산세와 재산세의 과세기준일은 매년 6월 30일이다."],"a":[4],"e":["옳음. 양도소득세와 취득세는 신고납부방식이다.","옳음. 취득세와 증여세는 취득단계 조세이다.","옳음. 양도소득세와 종합부동산세는 국세이다.","옳음. 상속세·증여세는 초과누진세율을 적용한다.","틀림(정답). 종합부동산세와 재산세의 과세기준일은 매년 '6월 1일'이다."],"k":"재산세·종합부동산세 과세기준일 = 매년 6월 1일.","note":"","t":"정책·조세"},{"id":"2021-32","y":2021,"n":32,"q":"부동산 권리분석에 관련된 설명으로 옳지 않은 것은?","box":"","o":["부동산 권리관계를 실질적으로 조사·확인·판단하여 일련의 부동산활동을 안전하게 하려는 것이다.","대상부동산의 권리관계를 조사·확인하기 위한 판독 내용에는 권리의 하자나 거래규제의 확인·판단이 포함된다.","매수인이 대상부동산을 매수하기 전에 소유권이전을 저해하는 사항이 있는지 여부를 확인하기 위하여 공부(公簿) 등을 조사하는 일도 포함된다.","우리나라 등기는 관련 법률에 다른 규정이 있는 경우를 제외하고는 당사자의 신청 또는 관공서의 촉탁에 따라 행하는 신청주의 원칙을 적용한다.","부동산 권리분석을 행하는 주체가 분석대상권리의 주요한 사항을 직접 확인해야 한다는 증거주의의 원칙은 권리분석활동을 하는 데 지켜야 할 이념이다."],"a":[4],"e":["옳음. 권리분석의 목적이다.","옳음. 판독 내용에는 권리의 하자, 거래규제의 확인·판단이 포함된다.","옳음. 매수 전 공부 조사도 권리분석에 포함된다.","옳음. 우리나라 등기는 신청주의(당사자 신청·관공서 촉탁)가 원칙이다.","틀림(정답). 분석 주체가 직접 탐문·확인해야 한다는 것은 '탐문주의'의 내용이며, 증거주의는 확인·판단을 증거에 근거해야 한다는 원칙이다."],"k":"권리분석 원칙: 능률성, 안전성(하자전제·범위확인·차단·완전심증), 탐문주의(직접 탐문·확인), 증거주의(증거에 근거한 판단).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2021-33","y":2021,"n":33,"q":"다음 중 부동산 권리분석시 등기사항전부증명서를 통해 확인할 수 없는 것은 몇 개인가?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>유치권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>점유권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>지역권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>법정지상권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>전세권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>구분지상권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>분묘기지권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>근저당권<\/span><\/div>","o":["3개","4개","5개","6개","7개"],"a":[1],"e":["오답. 4개이다.","정답(4개). 유치권·점유권·법정지상권·분묘기지권은 등기 없이 성립하므로 등기부로 확인할 수 없다.","오답. 지역권·전세권·구분지상권·근저당권은 을구에서 확인할 수 있다.","오답. 4개이다.","오답. 4개이다."],"k":"등기부로 확인 불가: 유치권, 점유권, 법정지상권(성립 시), 분묘기지권. 확인 가능: 지역권, 전세권, 구분지상권, 근저당권.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2021-34","y":2021,"n":34,"q":"감정평가 과정상 지역분석과 개별분석에 관한 설명으로 옳지 않은 것은?","box":"","o":["지역분석을 통해 해당 지역 내 부동산의 표준적 이용과 가격수준을 파악할 수 있다.","지역분석은 개별분석보다 먼저 실시하는 것이 일반적이다.","인근지역이란 대상부동산이 속한 지역으로서 부동산의 이용이 동질적이고 가치형성요인 중 개별요인을 공유하는 지역을 말한다.","유사지역이란 대상부동산이 속하지 아니하는 지역으로서 인근지역과 유사한 특성을 갖는 지역을 말한다.","지역분석은 대상지역에 대한 거시적인 분석인 반면, 개별분석은 대상부동산에 대한 미시적인 분석이다."],"a":[2],"e":["옳음. 지역분석으로 표준적 이용과 가격수준을 파악한다.","옳음. 지역분석 → 개별분석 순서가 일반적이다.","틀림(정답). 인근지역은 가치형성요인 중 '지역요인'을 공유하는 지역이다.","옳음. 유사지역의 정의이다.","옳음. 지역분석은 거시적, 개별분석은 미시적 분석이다."],"k":"인근지역 = 대상부동산이 속한 지역 + 이용이 동질적 + '지역요인' 공유.","note":"","t":"감정평가"},{"id":"2021-35","y":2021,"n":35,"q":"부동산 평가활동에서 부동산 가격의 원칙에 관한 설명으로 옳지 않은 것은?","box":"","o":["예측의 원칙이란 평가활동에서 가치형성요인의 변동추이 또는 동향을 주시해야 한다는 것을 말한다.","대체의 원칙이란 부동산의 가격이 대체관계의 유사 부동산으로부터 영향을 받는다는 것을 말한다.","균형의 원칙이란 부동산의 유용성이 최고도로 발휘되기 위해서는 부동산이 외부환경과 균형을 이루어야 한다는 것을 말한다.","변동의 원칙이란 가치형성요인이 시간의 흐름에 따라 지속적으로 변화함으로써 부동산 가격도 변화한다는 것을 말한다.","기여의 원칙이란 부동산의 가격이 대상부동산의 각 구성요소가 기여하는 정도의 합으로 결정된다는 것을 말한다."],"a":[2],"e":["옳음. 예측의 원칙의 내용이다.","옳음. 대체의 원칙의 내용이다.","틀림(정답). 외부환경과의 균형(적합)은 '적합의 원칙'이다. 균형의 원칙은 부동산 내부 구성요소 간의 균형을 말한다.","옳음. 변동의 원칙의 내용이다.","옳음. 기여의 원칙의 내용이다."],"k":"균형의 원칙 = 내부 구성요소 간 균형. 적합의 원칙 = 외부환경과 적합.","note":"","t":"감정평가"},{"id":"2021-36","y":2021,"n":36,"q":"감정평가에 관한 규칙상 현황기준 원칙에 관한 내용으로 옳지 않은 것은? (단, 감정평가조건이란 기준시점의 가치형성요인 등을 실제와 다르게 가정하거나 특수한 경우로 한정하는 조건을 말함.)","box":"","o":["감정평가업자는 감정평가조건의 합리성, 적법성이 결여되거나 사실상 실현 불가능하다고 판단할 때에는 의뢰를 거부하거나 수임을 철회할 수 있다.","현황기준 원칙에도 불구하고 법령에 다른 규정이 있는 경우에는 감정평가조건을 붙여 감정평가할 수 있다.","현황기준 원칙에도 불구하고 대상물건의 특성에 비추어 사회통념상 필요하다고 인정되는 경우에는 감정평가조건을 붙여 감정평가할 수 있다.","감정평가의 목적에 비추어 사회통념상 필요하다고 인정되어 감정평가조건을 붙여 감정평가하는 경우에는 감정평가조건의 합리성, 적법성 및 실현가능성의 검토를 생략할 수 있다.","현황기준 원칙에도 불구하고 감정평가 의뢰인이 요청하는 경우에는 감정평가조건을 붙여 감정평가할 수 있다."],"a":[3],"e":["옳음. 조건이 합리성·적법성이 없거나 실현 불가능하면 의뢰 거부 또는 수임 철회가 가능하다.","옳음. 법령에 다른 규정이 있으면 조건을 붙일 수 있다.","옳음. 대상물건의 특성상 사회통념상 필요하면 조건을 붙일 수 있다.","틀림(정답). 검토를 생략할 수 있는 것은 '법령에 다른 규정이 있는 경우'뿐이다. 사회통념상 필요해 조건을 붙인 경우에는 합리성·적법성·실현가능성을 검토해야 한다.","옳음. 의뢰인이 요청하는 경우 조건을 붙일 수 있다."],"k":"감정평가조건 부가 사유: ① 법령 규정 ② 의뢰인 요청 ③ 목적·특성상 사회통념상 필요. 법령에 따른 경우만 합리성·적법성·실현가능성 검토 생략 가능.","note":"","t":"감정평가"},{"id":"2021-37","y":2021,"n":37,"q":"감정평가에 관한 규칙상 대상물건별 주된 감정평가방법으로 옳지 않은 것은? (단, 대상물건은 본래 용도의 효용가치가 있음을 전제함.)","box":"","o":["선박 - 거래사례비교법","건설기계 - 원가법","자동차 - 거래사례비교법","항공기 - 원가법","동산 - 거래사례비교법"],"a":[0],"e":["틀림(정답). 선박의 주된 평가방법은 '원가법'이다(선체·기관·의장별 구분 평가).","옳음. 건설기계는 원가법이다.","옳음. 자동차는 거래사례비교법이다.","옳음. 항공기는 원가법이다.","옳음. 동산은 거래사례비교법이다."],"k":"원가법: 건물, 건설기계, 선박, 항공기. 거래사례비교법: 자동차, 동산, 과수원, 구분소유건물, 산림(입목).","note":"","t":"감정평가"},{"id":"2021-38","y":2021,"n":38,"q":"다음 자료를 활용하여 공시지가기준법으로 평가한 대상토지의 단위면적당 가액은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>기준시점 : 2021.04.24<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>비교표준지 : A시 B구 C동 183번지, 일반상업지역, 상업용 2021.01.01. 기준 공시지가 6,000,000원/㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>지가변동률(2021.01.01. ~ 2021.04.24.) : A시 B구 상업지역 2% 상승함<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>지역요인 : 비교표준지와 대상토지는 인근지역에 위치하여 지역요인 동일함<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>개별요인 : 대상토지는 비교표준지에 비해 가로조건에서 5% 우세하고, 환경조건에서 10% 열세하며, 다른 조건은 동일함(상승식으로 계산할 것)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>그 밖의 요인 보정 : 대상토지 인근지역의 가치형성요인이 유사한 정상적인 거래사례 및 평가사례 등을 고려하여 그 밖의 요인으로 50% 증액 보정함.<\/span><\/div>","o":["5,700,000원/㎡","5,783,400원/㎡","8,505,000원/㎡","8,675,100원/㎡","8,721,000원/㎡"],"a":[3],"e":["오답. 그 밖의 요인 보정과 시점수정을 빠뜨린 값이다.","오답. 그 밖의 요인 보정(1.5)을 빠뜨린 값이다.","오답. 시점수정(1.02)을 빠뜨린 값이다.","정답. 6,000,000 × 1.02 × 1.00 × (1.05 × 0.90) × 1.50 = 8,675,100원/㎡.","오답. 개별요인을 상승식이 아닌 합산식(1+0.05−0.10)으로 계산하는 등 잘못된 값이다."],"k":"공시지가 × 시점수정 × 지역요인 × 개별요인(상승식) × 그 밖의 요인 보정.","note":"","t":"감정평가"},{"id":"2021-39","y":2021,"n":39,"q":"다음 자료를 활용하여 원가법으로 평가한 대상건물의 가액은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>대상건물 현황 : 연와조, 단독주택, 연면적 200㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>사용승인시점 : 2016.06.30<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>기준시점 : 2021.04.24<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>사용승인시점의 신축공사비 : 1,000,000원/㎡(신축공사비는 적정함)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>건축비지수 - 사용승인시점 : 100 - 기준시점 : 110<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>경제적 내용연수 : 40년<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>감가수정방법 : 정액법(만년감가기준)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>내용연수 만료시 잔존가치 없음<\/span><\/div>","o":["175,000,000원","180,000,000원","192,500,000원","198,000,000원","203,500,000원"],"a":[3],"e":["오답. 계산 결과와 다르다.","오답. 시점수정을 하지 않은 값이다(200,000,000 × 36/40).","오답. 경과연수를 5년으로 본 값이다(220,000,000 × 35/40).","정답. 재조달원가 = 1,000,000 × 110/100 × 200 = 220,000,000원. 경과 4년(만년감가) → 220,000,000 × 36/40 = 198,000,000원.","오답. 계산 결과와 다르다."],"k":"만년감가: 1년 미만 절사. 2016.6.30 → 2021.4.24 = 4년 경과(잔존 36년).","note":"","t":"감정평가"},{"id":"2021-40","y":2021,"n":40,"q":"감정평가 실무기준에서 규정하고 있는 수익환원법에 관한 내용으로 옳지 않은 것은?","box":"","o":["수익환원법으로 감정평가할 때에는 직접환원법이나 할인현금흐름분석법 중에서 감정평가 목적이나 대상물건에 적절한 방법을 선택하여 적용한다.","부동산의 증권화와 관련하여 감정평가 등 매기의 순수익을 예상해야 하는 경우에는 할인현금흐름분석법을 원칙으로 하고 직접환원법으로 합리성을 검토한다.","직접환원법에서 사용할 환원율은 요소구성법으로 구하는 것을 원칙으로 한다. 다만, 요소구성법의 적용이 적절하지 않은 때에는 시장추출법, 투자결합법, 유효총수익승수에 의한 결정방법, 시장에서 발표된 환원율 등을 검토하여 조정할 수 있다.","할인현금흐름분석법에서 사용할 할인율은 투자자조사법(지분할인율), 투자결합법(종합할인율), 시장에서 발표된 할인율 등을 고려하여 대상물건의 위험이 적절히 반영되도록 결정하되 추정된 현금흐름에 맞는 할인율을 적용한다.","복귀가액 산정을 위한 최종환원율은 환원율에 장기위험프리미엄·성장률·소비자물가상승률 등을 고려하여 결정한다."],"a":[2],"e":["옳음. 직접환원법과 DCF법 중 적절한 방법을 선택한다.","옳음. 증권화 관련 평가는 DCF법을 원칙으로 하고 직접환원법으로 합리성을 검토한다.","틀림(정답). 환원율은 '시장추출법'으로 구하는 것이 원칙이며, 곤란한 경우 요소구성법·투자결합법 등을 검토한다.","옳음. 할인율 결정 방법에 대한 설명이다.","옳음. 최종환원율 결정 방법이다."],"k":"환원율 = 시장추출법 원칙. 곤란하면 요소구성법·투자결합법·유효총수익승수·발표 환원율 등 검토.","note":"","t":"감정평가"},{"id":"2022-02","y":2022,"n":2,"q":"부동산활동에 관련된 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>공유지(公有地)란 1필지의 토지를 2인 이상이 공동으로 소유한 토지로, 지분비율 또는 지분의 위치에 따라 감정평가한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>일단지란 용도상 불가분의 관계에 있고 지가형성요인이 같은 2필지 이상의 토지로, 필지별로 감정평가한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>선하지란 고압선 아래의 토지로, 고압선등 통과부분의 면적 등 제한의 정도를 고려하여 감정평가 한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>맹지란 도로와 접한 면이 없는 토지로, 도로로 사용하기 위한 지역권이 설정되어 있는 경우 도로가 있는 것으로 보고 감정평가한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㅁ<\/span><span>환지란 도시개발사업에서 사업전 토지의 위치 등을 고려하여 소유자에게 재분배하는 사업후의 토지로, 환지처분 이전에 환지예정지로 지정된 경우에는 종전 토지의 위치 등을 기준으로 감정평가한다.<\/span><\/div>","o":["ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄷ, ㅁ","ㄴ, ㄷ, ㄹ","ㄴ, ㄹ, ㅁ"],"a":[1],"e":["오답. ㄴ이 틀렸다. 일단지는 용도상 불가분 관계이므로 필지별이 아니라 일단지 전체를 일괄평가한다.","정답. ㄱ(공유지는 지분비율·위치에 따라 평가), ㄷ(선하지는 제한 정도 고려), ㄹ(통행 지역권이 있으면 도로가 있는 것으로 보고 평가)이 옳다.","오답. ㅁ이 틀렸다. 환지예정지로 지정된 경우 종전 토지가 아닌 '환지예정지'의 위치·면적 등을 기준으로 평가한다.","오답. ㄴ이 틀렸다.","오답. ㄴ·ㅁ이 틀렸다."],"k":"일단지 = 일괄평가, 환지예정지 = 환지예정지 기준 평가, 선하지 = 제한 정도 고려, 맹지 = 지역권 등 통행 권리 있으면 도로 있는 것으로 봄.","note":"","t":"감정평가"},{"id":"2022-03","y":2022,"n":3,"q":"토지의 특성에 관한 설명이다. ( )에 들어갈 내용으로 옳게 연결된 것은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄱ )은 토지에 대한 소유욕을 증대시키며 토지이용을 집약화시킨다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄴ )은 임장활동과 지역분석의 근거가 된다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄷ )은 토지간의 비교를 어렵게 하며, 완전한 대체를 제약시킨다.<\/span><\/div>","o":["ㄱ : 개별성, ㄴ : 부동성, ㄷ : 영속성","ㄱ : 영속성, ㄴ : 부동성, ㄷ : 용도의 다양성","ㄱ : 영속성, ㄴ : 인접성, ㄷ : 용도의 다양성","ㄱ : 부증성, ㄴ : 인접성, ㄷ : 부동성","ㄱ : 부증성, ㄴ : 부동성, ㄷ : 개별성"],"a":[4],"e":["오답. ㄱ은 부증성, ㄷ은 개별성이다.","오답. ㄱ은 부증성, ㄷ은 개별성이다.","오답. ㄴ은 부동성이다. 인접성은 외부효과·협동적 이용과 관련된다.","오답. ㄴ은 부동성, ㄷ은 개별성이다.","정답. ㄱ: 부증성(희소성 → 소유욕·집약적 이용), ㄴ: 부동성(임장활동·지역분석), ㄷ: 개별성(비교 곤란·대체 제약)."],"k":"부증성 → 소유욕 증대·집약적 이용, 부동성 → 임장활동·지역분석, 개별성 → 비교 곤란·완전 대체 불가.","note":"","t":"부동산학 총론"},{"id":"2022-04","y":2022,"n":4,"q":"부동산의 특성에 관한 설명으로 옳은 것의 개수는?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>용도의 다양성은 최유효이용을 선택할 수 있는 근거가 된다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>인접성은 외부효과의 원인이 된다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>분할·합병의 가능성은 부동산의 가치를 변화시킨다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>부동성은 인근지역과 유사지역의 분류를 가능하게 한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>영속성은 부동산활동을 장기적으로 고려하게 한다.<\/span><\/div>","o":["1","2","3","4","5"],"a":[4],"e":["오답. 5개 모두 옳다.","오답. 5개 모두 옳다.","오답. 5개 모두 옳다.","오답. 5개 모두 옳다.","정답(5개). 제시된 다섯 지문 모두 부동산 특성과 그 파생현상을 올바르게 연결하였다."],"k":"용도의 다양성 → 최유효이용, 인접성 → 외부효과, 병합·분할 → 가치 변화, 부동성 → 인근·유사지역 구분, 영속성 → 장기적 배려.","note":"","t":"부동산학 총론"},{"id":"2022-05","y":2022,"n":5,"q":"디파스퀠리-위튼(Dipasquale & Wheaton)의 사분면 모형에 관한 설명으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["장기균형에서 4개의 내생변수, 즉 공간재고, 임대료, 자본환원율, 건물의 신규공급량이 결정된다.","신축을 통한 건물의 신규공급량은 부동산 자산가격, 생산요소가격 등에 의해 영향을 받는다.","자본환원율은 요구수익률을 의미하며 시장이자율 등에 의해 영향을 받는다.","최초 공간재고가 공간서비스에 대한 수요량과 일치할 때 균형임대료가 결정된다.","건물의 신규공급량과 기존 재고의 소멸에 의한 재고량 감소분이 일치할 때 장기균형에 도달한다."],"a":[0],"e":["틀림(정답). 자본환원율은 시장이자율 등 모형 밖 요인에 의해 결정되는 '외생변수'이다. 내생변수는 공간재고·임대료·자산가격·신규공급량이다.","옳음. 신규공급량은 자산가격과 건설비용(생산요소가격)에 의해 결정된다(3사분면).","옳음. 자본환원율은 요구수익률로서 시장이자율 등의 영향을 받는다.","옳음. 공간시장(1사분면)에서 재고와 공간수요가 일치할 때 임대료가 결정된다.","옳음. 신규건설량 = 재고 소멸량(감가)일 때 재고가 변하지 않는 장기균형이다."],"k":"DW 4사분면 모형: 내생변수 = 임대료, 자산가격, 신규건설량, 공간재고. 자본환원율은 시장이자율 등에 의해 정해지는 외생변수.","note":"","t":"시장·입지·지대"},{"id":"2022-07","y":2022,"n":7,"q":"부동산시장에 대한 정부의 간접개입방식으로 옳게 묶인 것은?","box":"","o":["임대료상한제, 부동산보유세, 담보대출규제","담보대출규제, 토지거래허가제, 부동산거래세","개발부담금제, 부동산거래세, 부동산가격공시제도","지역지구제, 토지거래허가제, 부동산가격공시제도","부동산보유세, 개발부담금제, 지역지구제"],"a":[2],"e":["오답. 임대료상한제는 직접개입(가격통제)이다.","오답. 토지거래허가제는 토지이용규제(직접적 규제)이다.","정답. 개발부담금제·부동산거래세·부동산가격공시제도는 모두 시장기능을 통해 간접적으로 영향을 주는 간접개입방식이다.","오답. 지역지구제·토지거래허가제는 토지이용규제이다.","오답. 지역지구제는 토지이용규제이다."],"k":"직접개입: 공공임대·공영개발·임대료상한제·토지비축 등. 간접개입: 조세·금융·보조금·정보제공(공시제도). 토지이용규제: 지역지구제·토지거래허가제 등.","note":"","t":"정책·조세"},{"id":"2022-08","y":2022,"n":8,"q":"산업입지이론에 관한 설명으로 옳지 않은 것은?","box":"","o":["베버(A. Weber)는 운송비의 관점에서 특정 공장이 원료지향적인지 또는 시장지향적인지 판단하기 위해 원료지수(matertal index)를 사용하였다.","베버(A. Weber)의 최소비용이론에서는 노동비, 운송비, 집적이익 가운데 운송비를 최적입지 결정에 가장 우선적으로 검토한다.","뢰쉬(A. Losch)의 최대수요이론에서는 입지분석에 있어 대상지역내 원자재가 불균등하게 존재한다는 전제 하에, 수요가 최대가 되는 지점이 최적입지라고 본다.","아이사드(W. Isard)는 여러 입지 가운데 하나의 입지를 선정할 때 각 후보지역이 가지고 있는 비용최소 요인을 대체함으로써 최적입지가 달라질 수 있다는 대체원리(subsitution priciple)를 입지이론에 적용하였다.","스미스(D. Smith)의 비용수요통합이론에서는 이윤을 창출할 수 있는 공간한계 내에서는 어디든지 입지할 수 있다는 준최적입지(suboptimal location) 개념을 강조한다."],"a":[2],"e":["옳음. 원료지수(국지원료 중량/제품 중량) > 1이면 원료지향형, < 1이면 시장지향형이다.","옳음. 베버는 운송비를 가장 먼저 검토하고 노동비·집적이익으로 수정한다.","틀림(정답). 뢰쉬는 대상지역 내 원자재가 '균등하게' 존재한다는 전제에서 수요가 최대가 되는 지점을 최적입지로 보았다.","옳음. 아이사드는 대체원리를 입지이론에 적용하였다.","옳음. 스미스는 이윤이 발생하는 공간한계 내라면 어디든 입지 가능하다는 준최적입지를 강조하였다."],"k":"뢰쉬: 원자재가 '균등하게' 분포한다는 전제 하에 수요 최대 지점이 최적입지. 베버: 운송비 → 노동비 → 집적이익 순 검토.","note":"","t":"시장·입지·지대"},{"id":"2022-09","y":2022,"n":9,"q":"부동산시장의 효율성에 관한 설명으로 옳은 것은?","box":"","o":["특정 투자자가 얻는 초과이윤이 이를 발생시키는데 소요되는 정보비용보다 크면 배분효율적 시장이 아니다.","약성 효율적 시장은 정보가 완전하고 모든 정보가 공개되어 있으며 정보비용이 없다는 완전경쟁시장의 조건을 만족한다.","부동산시장은 주식시장이나 일반적인 재화시장보다 더 불완전경쟁적이므로 배분 효율성을 달성할 수 없다.","강성 효율적 시장에서는 정보를 이용하여 초과이윤을 얻을 수 있다.","약성 효율적 시장의 개념은 준강성 효율적 시장의 성격을 포함하고 있다."],"a":[0],"e":["정답. 초과이윤이 정보비용보다 크면 다른 투자자도 정보를 얻으려 할 것이므로 할당(배분)효율적 시장이 아니다.","틀림. 완전경쟁시장 조건을 만족하는 것은 '강성' 효율적 시장이다.","틀림. 불완전경쟁시장이라도 정보비용과 초과이윤이 같다면 배분효율성을 달성할 수 있다.","틀림. 강성 효율적 시장에서는 어떤 정보로도 초과이윤을 얻을 수 없다.","틀림. 준강성 효율적 시장이 약성 효율적 시장의 개념을 포함한다."],"k":"할당(배분)효율적 시장: 초과이윤 = 정보비용. 강성 ⊃ 준강성 ⊃ 약성(포함관계).","note":"","t":"시장·입지·지대"},{"id":"2022-10","y":2022,"n":10,"q":"주거분리와 여과과정에 관한 설명으로 옳은 것은?","box":"","o":["여과과정이 원활하게 작동하면 신규주택에 대한 정부지원으로 모든 소득계층이 이득을 볼 수 있다.","하향여과는 고소득층 주거지역에서 주택의 개량을 통한 가치상승분이 주택개량비용보다 큰 경우에 발생한다.","다른 조건이 동일할 경우 고가주택에 가까이 위치한 저가주택에는 부(-)의 외부효과가 발생한다.","민간주택시장에서 불량주택이 발생하는 것은 시장실패를 의미한다.","주거분리현상은 도시지역에서만 발생하고, 도시와 지리적으로 인접한 근린지역에서는 발생하지 않는다."],"a":[0],"e":["정답. 여과과정이 원활하면 신규(고가)주택 공급 지원이 하향여과를 통해 저가주택 공급 증가로 이어져 모든 소득계층이 이득을 볼 수 있다.","틀림. 개량으로 인한 가치상승분이 개량비용보다 '작을' 때 개량이 이루어지지 않아 하향여과가 발생한다.","틀림. 고가주택 근처의 저가주택은 정(+)의 외부효과를 받는다.","틀림. 불량주택은 시장이 소득수준에 맞게 주택을 배분한 결과로, 시장실패가 아니라 소득분배의 문제이다.","틀림. 주거분리는 도시 전체뿐 아니라 근린지역 차원에서도 발생한다."],"k":"여과과정 작동 시 고가주택 공급 지원 → 하향여과 → 저소득층까지 혜택. 불량주택은 시장실패가 아닌 소득 문제.","note":"","t":"시장·입지·지대"},{"id":"2022-11","y":2022,"n":11,"q":"분양가상한제로 인해 발생할 수 있는 문제점과 그 보완책을 연결한 것으로 옳지 않은 것은?","box":"","o":["분양주택의 질 하락 - 분양가상한제의 기본 건축비 현실화","분양주택 배분 문제 - 주택청약제도를 통한 분양","분양프리미엄 유발 - 분양주택의 전매제한 완화","신규주택 공급량 감소 - 공공의 저렴한 택지 공급","신규주택 공급량 감소 - 신규주택건설에 대한 금융지원"],"a":[2],"e":["옳음. 기본형 건축비를 현실화하면 품질 저하를 막을 수 있다.","옳음. 시세보다 싼 주택의 배분 문제는 청약제도로 해결한다.","틀림(정답). 분양프리미엄은 전매제한을 '강화'해야 억제된다. 완화하면 투기적 분양권 거래로 프리미엄이 더 커진다.","옳음. 저렴한 공공택지 공급으로 공급 감소에 대응한다.","옳음. 건설금융 지원도 공급 감소에 대한 보완책이다."],"k":"분양가상한제 부작용: 질 하락, 공급 감소, 분양 프리미엄(시세차익) → 전매제한 '강화'로 대응.","note":"","t":"정책·조세"},{"id":"2022-12","y":2022,"n":12,"q":"정부의 주택시장 개입에 관한 설명으로 옳지 않은 것은?","box":"","o":["주택은 긍정적인 외부효과를 창출하므로 생산과 소비를 장려해야 할 가치재(merit goods)이다.","저소득층에 대한 임대주택 공급은 소득의 직접분배효과가 있다.","주택구입능력을 제고하기 위한 정책은 소득계층에 따라 달라진다.","자가주택 보유를 촉진하는 정책은 중산층 형성과 사회안정에 기여한다.","주거안정은 노동생산성과 지역사회에 대한 주민참여를 제고하는 효과가 있다."],"a":[1],"e":["옳음. 주택은 정(+)의 외부효과를 낳는 가치재로서 소비를 장려할 필요가 있다.","틀림(정답). 임대주택 공급은 시장임대료와의 차액만큼 소득을 '간접적으로' 재분배하는 효과가 있다. 현금을 직접 지급하는 것이 아니다.","옳음. 소득계층에 따라 정책 수단(보조금·금융지원 등)이 달라진다.","옳음. 자가 보유 촉진은 중산층 형성과 사회안정에 기여한다.","옳음. 주거안정은 노동생산성 향상과 지역사회 참여를 높인다."],"k":"공공임대주택 공급 = 시장임대료와의 차액만큼 '간접적' 소득재분배 효과.","note":"","t":"정책·조세"},{"id":"2022-13","y":2022,"n":13,"q":"A투자안의 현금흐름이다. 추가투자가 없었을 때의 NPV(ㄱ)와 추가투자로 인한 NPV증감(ㄴ)은? (단, 0기 기준이며, 주어진 자료에 한함)","box":"<table class=\"bt\"><tr><td>구분<\/td><td>0기<\/td><td>1기<\/td><td>2기<\/td><td>3기<\/td><\/tr><tr><td>초기투자<\/td><td>(1억원)<\/td><td>| |<\/td><\/tr><tr><td>NOI<\/td><td>| 4천만원<\/td><td>3천만원<\/td><td>4천만원<\/td><\/tr><tr><td>추가투자<\/td><td>|<\/td><td>(5천만원) |<\/td><\/tr><tr><td>추가투자에 따른 NOI증감<\/td><td>|<\/td><td>+3천만원<\/td><td>+4천만원<\/td><\/tr><tr><td>현가계수<\/td><td>| 0.952<\/td><td>0.906<\/td><td>0.862<\/td><\/tr><\/table>","o":["ㄱ : -260,000원, ㄴ : +16,360,000원","ㄱ : -260,000원, ㄴ : +17,240,000원","ㄱ : -260,000원, ㄴ : +18,120,000원","ㄱ : +260,000원, ㄴ : +16,360,000원","ㄱ : +260,000원, ㄴ : +17,240,000원"],"a":[0],"e":["정답. ㄱ: −1억 + 4,000×0.952 + 3,000×0.906 + 4,000×0.862 = −1억 + 3,808 + 2,718 + 3,448 = −26만원. ㄴ: 2기 순증감 (−5,000+3,000)×0.906 = −1,812만원, 3기 4,000×0.862 = +3,448만원 → +1,636만원.","오답. ㄴ에서 2기 추가투자를 0기에 한 것으로 처리하는 등 시점을 잘못 잡은 값이다.","오답. ㄴ 계산이 틀렸다.","오답. ㄱ은 음수(−26만원)이다.","오답. ㄱ의 부호와 ㄴ 모두 틀렸다."],"k":"추가투자분 NPV = −5,000×0.906 + 3,000×0.906 + 4,000×0.862 (2기의 순현금흐름 = −5,000+3,000).","note":"","t":"투자·금융"},{"id":"2022-14","y":2022,"n":14,"q":"부동산투자회사법상 부동산투자회사에 관한 설명으로 옳은 것은?","box":"","o":["최저자본금준비기간이 지난 위탁관리 부동산투자회사의 자본금은 70억원 이상이 되어야 한다.","자기관리 부동산투자회사의 설립자본금은 3억원 이상으로 한다.","자기관리 부동산투자회사에 자산운용 전문인력으로 상근하는 감정평가사는 해당분야에 3년 이상 종사한 사람이어야 한다.","최저자본금준비기간이 끝난 후에는 매 분기 말 현재 총자산의 100분의 80 이상이 부동산 (건축 중인 건축물 포함)이어야 한다.","위탁관리 부동산투자회사는 해당 연도 이익을 초과하여 배당할 수 있다."],"a":[4],"e":["틀림. 위탁관리 리츠의 최저자본금은 50억원이다(자기관리는 70억원).","틀림. 자기관리 리츠의 설립자본금은 5억원 이상이다(위탁관리·CR리츠는 3억원).","틀림. 감정평가사·공인중개사가 자산운용 전문인력이 되려면 해당 분야에 5년 이상 종사해야 한다.","틀림. 총자산의 80% 이상은 부동산·관련증권·현금이고, 그중 '70%' 이상이 부동산이어야 한다.","정답. 위탁관리 리츠는 감가상각비 범위 내 등에서 해당 연도 이익을 초과하여 배당할 수 있다."],"k":"리츠: 위탁·CR리츠 최저자본금 50억, 자기관리 70억, 자기관리 설립자본금 5억(위탁 3억), 자산 70% 이상 부동산, 위탁관리리츠는 이익초과배당 가능.","note":"","t":"투자·금융"},{"id":"2022-15","y":2022,"n":15,"q":"부동산투자이론에 관한 설명으로 옳지 않은 것은?","box":"","o":["변동계수는 수익률을 올리기 위해 감수하는 위험의 비율로 표준편차를 기대수익률로 나눈 값이다.","포트폴리오를 구성하면 비체계적 위험을 회피할 수 있다.","위험기피형 투자자는 위험부담에 대한 보상심리로 위험할증률을 요구수익률에 반영한다.","두 개별자산으로 구성된 포트폴리오에서 자산간 상관계수가 양수인 경우에 음수인 경우보다 포트폴리오 위험절감효과가 높다.","투자안의 기대수익률이 요구수익률보다 높으면 해당 투자안의 수요증가로 기대수익률이 낮아져 요구수익률에 수렴한다."],"a":[3],"e":["옳음. 변동계수 = 표준편차 ÷ 기대수익률로 단위 수익당 위험이다.","옳음. 포트폴리오로 비체계적 위험을 줄일 수 있다.","옳음. 위험기피형은 위험할증률을 요구수익률에 더한다.","틀림(정답). 상관계수가 '음수'일 때 위험절감 효과가 더 높다. 상관계수가 낮을수록 분산효과가 크다.","옳음. 기대수익률 > 요구수익률이면 수요 증가로 가격이 상승해 기대수익률이 하락, 결국 요구수익률에 수렴한다."],"k":"상관계수가 −1에 가까울수록 분산투자 효과(위험절감)가 크다. +1이면 효과 없음.","note":"","t":"투자·금융"},{"id":"2022-16","y":2022,"n":16,"q":"부동산 투자분석기법에 관한 설명으로 옳은 것은?","box":"","o":["투자규모가 상이한 투자안에서 수익성지수(PI)가 큰 투자안이 순현재가치(NPV)도 크다.","서로 다른 투자안 A, B를 결합한 새로운 투자안의 내부수익률(IRR)은 A의 내부수익률과 B의 내부수익률을 합한 값이다.","순현재가치법과 수익성지수법에서는 화폐의 시간가치를 고려하지 않는다.","투자안마다 단일의 내부수익률만 대응된다.","수익성지수가 1보다 크면 순현재가치는 0보다 크다."],"a":[4],"e":["틀림. 투자규모가 다르면 PI가 큰 투자안의 NPV가 더 작을 수 있다.","틀림. IRR은 가치가산원칙이 성립하지 않는다.","틀림. NPV법과 PI법은 할인을 통해 화폐의 시간가치를 고려한다.","틀림. 현금흐름 부호가 여러 번 바뀌면 IRR이 복수이거나 존재하지 않을 수 있다.","정답. PI = 유입현가/유출현가 > 1이면 유입현가 − 유출현가 = NPV > 0이다."],"k":"PI > 1 ⇔ NPV > 0. 규모가 다르면 PI와 NPV 순위가 달라질 수 있음. IRR은 가산 불가, 복수/부존재 가능.","note":"","t":"투자·금융"},{"id":"2022-17","y":2022,"n":17,"q":"대출상환방식에 관한 설명으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["원금균등분할상환방식은 만기에 가까워질수록 차입자의 원리금상환액이 감소한다.","원리금균등분할상환방식은 만기에 가까워질수록 원리금상환액 중 원금의 비율이 높아진다.","대출조건이 동일하다면 대출기간동안 차입자의 총원리상환액은 원금균등분할상환방식이 원리금균등분할상환방식보다 크다.","차입자의 소득에 변동이 없는 경우 원금균등상환방식의 총부채상환비율(DTI)은 만기에 가까워질수록 낮아진다.","차입자의 소득에 변동이 없는 경우 원리금균등분할상환방식의 총부채상환비율은 대출기간동안 일정하게 유지된다."],"a":[2],"e":["옳음. 원금균등은 잔액이 줄면서 이자가 감소해 원리금이 점차 감소한다.","옳음. 원리금균등은 후기로 갈수록 원금 비중이 높아진다.","틀림(정답). 원금균등분할은 원금을 빨리 갚아 누적이자가 적으므로 총원리금상환액이 원리금균등분할보다 '작다'.","옳음. 원금균등은 원리금이 감소하므로 소득이 일정하면 DTI가 점차 낮아진다.","옳음. 원리금균등은 매기 상환액이 일정하므로 소득이 일정하면 DTI도 일정하다."],"k":"총이자(총상환액): 만기일시 > 점증 > 원리금균등 > 원금균등. 원금균등은 원금이 빨리 줄어 총이자가 가장 적음.","note":"","t":"투자·금융"},{"id":"2022-18","y":2022,"n":18,"q":"A는 다음과 같은 조건을 가지는 원리금균등분할상환방식의 주택저당대출을 받았다. 5년 뒤 대출 잔액은 얼마인가? (단, 주어진 자료에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>대출액 : 47,400만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출만기 : 15년<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출금리 : 연 6%, 고정금리<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>원리금 매월 말 상환<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>연금현가계수(0.5%, 60) : 51.73<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>연금현가계수(0.5%, 120) : 90.07<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>연금현가계수(0.5%, 180) : 118.50<\/span><\/div>","o":["20,692만원","25,804만원","30,916만원","36,028만원","41,140만원"],"a":[3],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. 월상환액 = 47,400/118.50 = 400만원. 5년 후 잔여기간 10년(120개월) → 잔액 = 400 × 90.07 = 36,028만원.","오답. 계산 결과와 다르다. 잔여기간(120개월)의 계수를 써야 한다."],"k":"잔금 = 월상환액 × 잔여기간 연금현가계수 = 대출액 × (잔여기간 PVAF ÷ 전체기간 PVAF).","note":"","t":"투자·금융"},{"id":"2022-19","y":2022,"n":19,"q":"이자율과 할인율이 연 6%로 일정할 때, A, B, C를 크기 순서로 나열한 것은? (단, 주어진 자료에 한하며, 모든 현금흐름은 연말에 발생함.)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>A : 2차년도부터 6차년도까지 매년 250만원씩 받는 연금의 현재가치<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>B : 2차년도부터 6차년도까지 매년 200만원씩 받는 연금의 6차년도의 미래가치<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>C : 1차년도에 40만원을 받고 매년 전년대비 2%씩 수령액이 증가하는 성장형 영구연금의 현재가치<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>연금현가계수(6%, 5) : 4.212<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>연금현가계수(6%, 6) : 4.917<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>연금내가계수(6%, 5) : 5.637<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>연금내가계수(6%, 6) : 6.975<\/span><\/div>","o":["A > B > C","A>C>B","B > A > C","B>C>A","C>B>A"],"a":[3],"e":["오답. B가 가장 크고 A가 가장 작다.","오답. A가 가장 작다.","오답. C(1,000만원)가 A(약 993만원)보다 크다.","정답. A = 250×4.212÷1.06 ≈ 993만원, B = 200×5.637(5회 납입의 내가) = 1,127.4만원, C = 40÷(0.06−0.02) = 1,000만원 → B > C > A.","오답. B가 C보다 크다."],"k":"거치 연금 현가 = 연금 × PVAF ÷ (1+r). 성장형 영구연금 현가 = C₁ ÷ (r − g).","note":"","t":"투자·금융"},{"id":"2022-20","y":2022,"n":20,"q":"부동산증권에 관한 설명으로 옳지 않은 것은?","box":"","o":["한국주택금융공사는 유동화증권의 발행을 통해 자본시장에서 정책모기지 재원을 조달할 수 있다.","금융기관은 주택저당증권(MBS)을 통해 유동성 위험을 감소시킬 수 있다.","저당담보부채권(MBB)의 투자자는 채무불이행위험을 부담한다.","저당이체증권(MPTS)은 지분형 증권이며 유동화기관의 부채로 표기되지 않는다.","지불이체채권(MPTB)의 투자자는 조기상환위험을 부담한다."],"a":[2],"e":["옳음. 주택금융공사는 MBS 발행으로 자본시장에서 정책모기지 재원을 조달한다.","옳음. 대출채권을 유동화하여 유동성 위험을 줄인다.","틀림(정답). MBB는 발행자가 소유권과 원리금수취권을 보유하므로 채무불이행위험과 조기상환위험을 모두 '발행자'가 부담한다.","옳음. MPTS는 지분형으로 발행기관의 부채로 표시되지 않는다.","옳음. MPTB 투자자는 원리금수취권을 가져 조기상환위험을 부담한다."],"k":"MBB(채권형): 발행자가 모든 위험 부담, 투자자는 위험 부담 없음. MPTB: 조기상환위험은 투자자, 채무불이행위험은 발행자.","note":"","t":"투자·금융"},{"id":"2022-21","y":2022,"n":21,"q":"부동산금융에 관한 설명으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["대출채권의 듀레이션(평균 회수기간)은 만기일시상환대출이 원리금균등분할상환대출보다 길다.","대출수수료와 조기상환수수료를 부담하는 경우 차입자의 실효이자율은 조기상환시점이 앞당겨질수록 상승한다.","금리하락기에 변동금리대출은 고정금리대출에 비해 대출자의 조기상환위험이 낮다.","금리상승기에 변동금리대출의 금리조정주기가 짧을수록 대출자의 금리위험은 낮아진다.","총부채원리금상환비율(DSR)과 담보인정비율(LTV)은 소득기준으로 채무불이행위험을 측정하는 지표이다."],"a":[4],"e":["옳음. 만기일시상환은 원금을 만기에 받으므로 듀레이션이 가장 길다.","옳음. 수수료 부담이 짧은 기간에 집중되므로 조기상환이 빠를수록 실효이자율이 상승한다.","옳음. 변동금리는 금리 하락이 대출금리에 반영되므로 차입자가 조기상환할 유인이 작다.","옳음. 조정주기가 짧을수록 시장금리 변동이 빨리 반영되어 대출자의 금리위험이 낮다.","틀림(정답). DSR은 소득 기준이지만, LTV는 담보(자산)가치 기준으로 채무불이행위험을 측정하는 지표이다."],"k":"LTV = 담보가치(자산) 기준 지표, DTI·DSR = 소득 기준 지표. 변동금리는 대출자 금리위험↓, 고정금리는 금리하락기 조기상환위험↑.","note":"","t":"투자·금융"},{"id":"2022-23","y":2022,"n":23,"q":"부동산관리와 생애주기에 관한 설명으로 옳지 않은 것은?","box":"","o":["자산관리(Asset Management)란 소유자의 부를 극대화시키기 위하여 대상부동산을 포트폴리오 관점에서 관리하는 것을 말한다.","시설관리(Facility Management)란 각종 부동산시설을 운영하고 유지하는 것으로 시설사용자나 건물주의 요구에 단순히 부응하는 정도의 소극적이고 기술적인 측면의 관리를 말한다.","생애주기상 노후단계는 물리적*기능적 상태가 급격히 악화되기 시작하는 단계로 리모델링을 통하여 가치를 올릴 수 있다.","재산관리(Property Management)란 부동산의 운영수익을 극대화하고 자산가치를 증진시키기 위한 임대차관리 등의 일상적인 건물운영 및 관리뿐만 아니라 부동산 투자의 위험관리와 프로젝트 파이낸싱 등의 업무를 하는 것을 말한다.","건물의 이용에 의한 마멸, 파손, 노후화, 우발적 사고 등으로 사용이 불가능할 때까지의 기간을 물리적 내용연수라고 한다."],"a":[3],"e":["옳음. 자산관리는 포트폴리오 관점의 적극적 관리이다.","옳음. 시설관리는 소극적·기술적 관리이다.","옳음. 노후단계에서는 리모델링 등으로 가치를 회복시킬 수 있다.","틀림(정답). 투자위험관리·프로젝트 파이낸싱 등은 '자산관리(AM)'의 업무이다. 재산관리는 임대차 관리, 수지관리 등 건물의 일상적 운영관리이다.","옳음. 물리적 내용연수의 정의이다."],"k":"재산관리(PM) = 임대차·수익 극대화 등 일상적 운영관리. 위험관리·PF·포트폴리오는 자산관리(AM).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2022-24","y":2022,"n":24,"q":"건물의 관리방식에 관한 설명으로 옳은 것은?","box":"","o":["위탁관리방식은 부동산관리 전문업체에 위탁해 관리하는 방식으로 대형건물의 관리에 유용하다.","혼합관리방식은 필요한 부분만 일부 위탁하는 방식으로 관리자들간의 협조가 긴밀하게 이루어 진다.","자기관리방식은 관리업무의 타성을 방지할 수 있다.","위탁관리방식은 외부 전문가가 관리하므로 기밀 및 보안유지에 유리하다.","혼합관리방식은 관리문제 발생시 책임소재가 명확하다."],"a":[0],"e":["정답. 위탁관리는 전문업체에 맡기는 방식으로 대형건물 관리에 유용하다.","틀림. 혼합관리는 자기관리자와 위탁관리자 간 협조가 '어려울' 수 있다.","틀림. 자기관리는 관리업무가 타성에 젖기 '쉽다'.","틀림. 위탁관리는 외부인이 관여하므로 기밀·보안유지에 '불리'하다.","틀림. 혼합관리는 문제 발생 시 책임소재가 '불분명'하다."],"k":"위탁관리: 대형건물 적합, 전문성↑, 기밀유지 불리. 자기관리: 기밀유지 유리, 타성 우려. 혼합관리: 책임소재 불분명, 협조 곤란.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2022-25","y":2022,"n":25,"q":"부동산개발에 관한 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><spa
