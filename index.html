n>부동산개발법의 관리 및 육성에 관한 법률상 부동산개발은 토지를 건설공사의 수행 또는 형질변경의 방법으로 조성하는 행위 및 건축물을 건축, 대수선, 리모델링 또는 용도를 변경하거나 공작물을 설치하는 행위를 말하며, 시공을 담당하는 행위는 제외한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>혼합방식은 개발전의 면적·등급·지목 등을 고려하여, 개발된 토지를 토지소유주에게 종전의 토지위치에 재분배하는 것을 말한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>흡수율분석은 수요·공급분석을 통하여 대상부동산이 언제 얼마만큼 시장에서 매각 또는 임대될 수 있는지를 파악하는 것이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>개발권양도제(TDR)는 일정하게 주어진 개발허용한도 내에서 해당 지역의 토지이용규제로 인해 사용하지 못하는 부분을 다른 지역에 양도할 수 있는 것이다.<\/span><\/div>","o":["ㄱ, ㄷ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄴ, ㄷ, ㄹ"],"a":[3],"e":["오답. ㄹ도 옳다.","오답. ㄱ도 옳다.","오답. ㄴ은 '환지방식'의 설명이므로 틀렸다.","정답. ㄱ(부동산개발업법상 정의, 시공 제외), ㄷ(흡수율분석), ㄹ(개발권양도제)가 옳다.","오답. ㄴ이 틀렸다."],"k":"환지방식 = 개발 후 종전 위치에 재분배. 혼합방식 = 수용 + 환지 혼용. TDR = 규제지역 개발권을 다른 지역에 양도.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2022-26","y":2022,"n":26,"q":"부동산마케팅에 관한 설명으로 옳지 않은 것은?","box":"","o":["STP란 시장세분화(Segmentation), 표적시장(Target market), 포지셔닝(Positioning)을 말한다.","마케팅믹스 전략에서의 4P는 유통경로(Place), 제품(Product), 가격(Price), 판매촉진 (Promotion)을 말한다.","노벨티(Novelty) 광고는 개인 또는 가정에서 이용되는 실용적이며 장식적인 물건에 상호·전화번호 등을 표시하는 것으로 분양광고에 주로 활용된다.","관계마케팅 전략은 공급자와 소비자 간의 장기적·지속적인 상호작용을 중요시하는 전략을 말한다.","AIDA원리에 따르면 소비자의 구매의사결정은 행동(Action), 관심(Interest), 욕망(Desire), 주의(Attention)의 단계를 순차적으로 거친다."],"a":[4],"e":["옳음. STP 전략의 구성이다.","옳음. 4P는 제품·가격·유통·촉진이다.","옳음. 노벨티 광고는 달력·볼펜 등 실용품에 상호 등을 넣는 광고이다.","옳음. 관계마케팅은 장기적·지속적 관계를 중시한다.","틀림(정답). AIDA는 주의 → 관심 → 욕망 → 행동 순서이다."],"k":"AIDA: 주의(Attention) → 관심(Interest) → 욕망(Desire) → 행동(Action).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2022-27","y":2022,"n":27,"q":"부동산개발의 타당성분석 유형을 설명한 것이다. ( )에 들어갈 내용으로 옳게 연결된 것은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄱ )은 부동산이 현재나 미래의 시장상황에서 매매 또는 임대될 수 있는 가능성을 분석하는 것이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄴ )은 개발업자가 대상부동산에 대해 수립한 사업안들 중에서 최유효이용을 달성할 수 있는 방식을 판단할 수 있도록 자료를 제공해주는 것이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄷ )은 주요 변수들의 초기 투입값을 변화시켜 적용함으로써 낙관적 또는 비관적인 상황에서 발생 할 수 있는 수익성 및 부채상환능력 등을 예측하는 것이다.<\/span><\/div>","o":["ㄱ : 시장성분석, ㄴ : 민감도분석, ㄷ : 투자분석","ㄱ : 민감도분석, ㄴ : 투자분석, ㄷ : 시장성분석","ㄱ : 투자분석, ㄴ : 시장성분석, ㄷ : 민감도분석","ㄱ : 시장성분석, ㄴ : 투자분석, ㄷ : 민감도분석","ㄱ : 민감도분석, ㄴ : 시장성분석, ㄷ : 투자분석"],"a":[3],"e":["오답. ㄴ은 투자분석, ㄷ은 민감도분석이다.","오답. ㄱ은 시장성분석이다.","오답. ㄱ은 시장성분석, ㄴ은 투자분석이다.","정답. ㄱ: 시장성분석, ㄴ: 투자분석, ㄷ: 민감도분석.","오답. 모두 잘못 연결되었다."],"k":"시장성분석 = 매매·임대 가능성, 투자분석 = 최유효이용 방식 판단 자료, 민감도분석 = 투입변수 변화에 따른 결과 변화.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2022-28","y":2022,"n":28,"q":"에스크로우(Escrow)에 관한 설명으로 옳지 않은 것은?","box":"","o":["부동산매매 및 교환 등에 적용된다.","권리관계조사, 물건확인 등의 업무를 포함한다.","매수자, 매도자, 저당대출기관 등의 권익을 보호한다.","은행이나 신탁회사는 해당업무를 취급할 수 없다.","에스크로우 업체는 계약조건이 이행될 때까지 금전*문서*권원증서 등을 점유한다."],"a":[3],"e":["옳음. 매매·교환 등 부동산거래에 적용된다.","옳음. 권리관계 조사, 물건 확인 등의 업무를 포함한다.","옳음. 매수자·매도자·대출기관 모두의 권익을 보호한다.","틀림(정답). 은행·신탁회사도 에스크로우 업무를 취급할 수 있다.","옳음. 계약조건 이행 시까지 금전·문서·권원증서를 보관(점유)한다."],"k":"에스크로우: 중립적 제3자가 계약 이행 시까지 금전·문서를 보관. 은행·신탁회사·에스크로 회사 등이 취급 가능.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2022-29","y":2022,"n":29,"q":"부동산 중개계약에 관한 설명으로 옳지 않은 것은?","box":"","o":["순가중개계약에서는 매도자가 개업공인중개사에게 제시한 가격을 초과해 거래가 이루어진 경우 그 초과액을 매도자와 개업공인중개사가 나누어 갖는다.","일반중개계약에서는 의뢰인이 다수의 개업공인중개사에게 동등한 기회로 거래를 의뢰한다.","공인중개사법령상 당사자간에 다른 약정이 없는 경우 전속중개계약의 유효기간은 3월로 한다.","공동중개계약에서는 부동산거래정보망 등을 통하여 다수의 개업공인중개사가 상호 협동하여 공동으로 거래를 촉진한다.","독점중개계약에서는 의뢰인이 직접 거래를 성사시킨 경우에도 중개보수 청구권이 발생한다."],"a":[0],"e":["틀림(정답). 순가중개계약은 의뢰인이 정한 가격을 초과하는 금액 전부를 중개업자가 보수로 갖는 계약이다. 나누어 갖는 것이 아니다.","옳음. 일반중개계약은 다수 중개사에게 동등하게 의뢰한다.","옳음. 약정이 없으면 전속중개계약의 유효기간은 3개월이다.","옳음. 공동중개는 거래정보망 등을 통해 다수 중개사가 협동한다.","옳음. 독점중개계약은 누가 거래를 성사시키든(의뢰인 본인 포함) 보수 청구권이 인정된다."],"k":"순가중개계약: 매도자가 정한 순가를 초과하는 금액 전부를 중개보수로 취득(공인중개사법상 금지). 전속중개계약 유효기간 3개월.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2022-31","y":2022,"n":31,"q":"A지역 주택시장의 시장수요함수는 QD = -2P + 2,400이고 시장공급함수는 QS = 3P - 1,200이다. 정부가 부동산거래세를 공급측면에 단위당 세액 20만원의 종량세 형태로 부과하는 경우에 A지역 주택시장의 경제적 순손실은? (단, QD : 수요량, QS : 공급량, P : 가격, 단위는 만호, 만원이며, 다른 조건은 동일함.)","box":"","o":["60억원","120억원","240억원","360억원","480억원"],"a":[2],"e":["오답. 계산 결과와 다르다.","오답. ½을 두 번 적용하는 등 잘못 계산한 값이다.","정답. 조세 전: −2P+2,400 = 3P−1,200 → P=720, Q=960. 조세 후 공급: Q=3(P−20)−1,200 → −2P+2,400 = 3P−1,260 → P=732, Q=936. 거래량 감소 24만호. 순손실 = ½ × 20만원 × 24만호 = 240억원.","오답. 계산 결과와 다르다.","오답. ½을 곱하지 않은 값(조세×거래량 감소분)이다."],"k":"종량세 부과 시 경제적 순손실(사중손실) = ½ × 단위당 세액 × 거래량 감소분.","note":"","t":"정책·조세"},{"id":"2022-32","y":2022,"n":32,"q":"다음 설명에 모두 해당하는 부동산조세는?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>시·군·구세, 특별자치시(도)세<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>과세대상에 따라 누진세율 또는 단일세율 적용<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>보통징수 방식<\/span><\/div>","o":["종합부동산세","양도소득세","취득세","등록면허세","재산세"],"a":[4],"e":["오답. 종합부동산세는 국세이다.","오답. 양도소득세는 국세이며 신고납부이다.","오답. 취득세는 도세이며 신고납부이다.","오답. 등록면허세는 도세(구세)이며 신고납부가 원칙이다.","정답. 재산세는 시·군·구세로 과세관청이 부과·고지하는 보통징수 방식이며, 과세대상에 따라 누진세율 또는 단일세율을 적용한다."],"k":"재산세: 시·군·구세, 보통징수(부과고지), 토지는 누진세율·건축물은 단일(비례)세율 등 대상별로 다름.","note":"","t":"정책·조세"},{"id":"2022-33","y":2022,"n":33,"q":"부동산 권리분석에 관한 설명으로 옳지 않은 것은?","box":"","o":["권리분석의 원칙에는 능률성, 안전성, 탐문주의, 증거주의 등이 있다.","건물의 소재지, 구조, 용도 등의 사실관계는 건축물대장으로 확인*판단한다.","임장활동 이전 단계 활동으로 여러 가지 물적 증거를 수집하고 탁상으로 검토하여 1차적으로 하자의 유무를 발견하는 작업을 권리보증이라고 한다.","부동산의 상태 또는 사실관계, 등기능력이 없는 권리 및 등기를 요하지 않는 권리관계 등 자세한 내용까지 분석의 대상으로 하는 것이 최광의의 권리분석이다.","매수인이 대상부동산을 매수하기 전에 소유권을 저해하는 조세체납, 계약상 하자 등을 확인하기 위해 공부 등을 조사하는 일도 포함된다."],"a":[2],"e":["옳음. 능률성·안전성·탐문주의·증거주의 등이 권리분석의 원칙이다.","옳음. 건물의 사실관계는 건축물대장으로 확인한다.","틀림(정답). 지문은 임장활동 전의 '판독(탁상검토)' 작업에 대한 설명이다. 권리보증은 권리분석 결과에 대해 보증하는 것이다.","옳음. 최광의의 권리분석은 사실관계, 등기능력 없는 권리까지 분석한다.","옳음. 매수 전 조세체납·계약상 하자 등의 확인도 권리분석에 포함된다."],"k":"임장활동 전 공부 등 물적 증거를 탁상검토하여 하자를 1차 발견하는 작업 = 판독(탁상조사) 작업. 권리보증은 분석 결과에 대한 보증.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2022-34","y":2022,"n":34,"q":"부동산 권리분석 시 등기능력이 없는 것으로 묶인 것은?","box":"","o":["지역권, 지상권","유치권, 점유권","전세권, 법정지상권","가압류, 분묘기지권","저당권, 권리질권"],"a":[1],"e":["오답. 지역권과 지상권은 등기할 수 있다.","정답. 유치권과 점유권은 점유를 요건으로 하는 권리로서 등기능력이 없다.","오답. 전세권은 등기할 수 있다.","오답. 가압류는 등기할 수 있다(분묘기지권은 등기 불가).","오답. 저당권은 등기할 수 있고, 권리질권(저당권부 채권질권)도 부기등기가 가능하다."],"k":"등기능력 없는 권리: 점유권, 유치권, 분묘기지권, 법정지상권(성립 시 등기 불요 — 이후 처분 시 등기), 동산질권 등.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2022-35","y":2022,"n":35,"q":"감정평가에 관한 규칙상 원가방식에 관한 설명으로 옳지 않은 것은?","box":"","o":["원가법과 적산법은 원가방식에 속한다.","적산법에 의한 임대료 평가에서는 대상물건의 재조달원가에 기대이율을 곱하여 산정된 기대수익에 대상물건을 계속하여 임대하는 데에 필요한 경비를 더한다.","원가방식을 적용한 감정평가서에는 부득이한 경우를 제외하고는 재조달원가 산정 및 감가수정 등의 내용이 포함되어야 한다.","입목 평가 시 소경목림(小徑木林)인 경우에는 원가법을 적용할 수 있다.","선박 평가 시 본래 용도의 효용가치가 있으면 선체*기관*의장별로 구분한 후 각각 원가법을 적용해야 한다."],"a":[1],"e":["옳음. 원가방식 = 원가법(가액) + 적산법(임대료).","틀림(정답). 적산법은 대상물건의 '기초가액'에 기대이율을 곱해 기대수익을 구하고 필요제경비를 더한다.","옳음. 원가방식 적용 시 재조달원가·감가수정 내용을 감정평가서에 기재해야 한다.","옳음. 소경목림인 입목은 원가법을 적용할 수 있다(원칙은 거래사례비교법).","옳음. 선박은 선체·기관·의장별로 구분하여 각각 원가법을 적용한다."],"k":"적산법: 적산임료 = 기초가액 × 기대이율 + 필요제경비. (재조달원가가 아니라 기초가액)","note":"","t":"감정평가"},{"id":"2022-36","y":2022,"n":36,"q":"할인현금흐름분석법에 의한 수익가액은? (단, 주어진 자료에 한함, 모든 현금흐름은 연말에 발생함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>보유기간(5년)의 순영업소득 : 매년 9천만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>6기 순영업소득 : 1억원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>매도비용 : 재매도가치의 5%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>기입환원율 : 4%, 기출환원율 : 5%, 할인율 : 연 5%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>연금현가계수(5%, 5년) : 4.329<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>일시불현가계수(5%, 5년) : 0.783<\/span><\/div>","o":["1,655,410,000원","1,877,310,000원","2,249,235,000원","2,350,000,000원","2,825,000,000원"],"a":[1],"e":["오답. 계산 결과와 다르다.","정답. NOI 현가 = 9,000만 × 4.329 = 3억 8,961만원. 재매도가치 = 1억 ÷ 5% = 20억, 매도비용 1억 차감 → 19억 × 0.783 = 14억 8,770만원. 합계 18억 7,731만원.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 기입환원율(4%) 등을 잘못 적용한 값이다."],"k":"DCF 가액 = Σ보유기간 NOI 현가 + (재매도가치 − 매도비용)의 현가. 재매도가치 = (n+1)기 NOI ÷ 기출환원율.","note":"","t":"감정평가"},{"id":"2022-37","y":2022,"n":37,"q":"수익환원법에 관한 설명으로 옳지 않은 것은?","box":"","o":["운영경비에 감가상각비를 포함시킨 경우 상각전환원율을 적용한다.","직접환원법에서 사용할 환원율은 시장추출법으로 구하는 것을 원칙으로 한다.","재매도가치를 내부추계로 구할 때 보유기간 경과 후 초년도 순수익을 반영한다.","할인 또는 환원할 순수익을 구할 때 자본적지출은 비용으로 고려하지 않는다.","요소구성법으로 환원율을 결정할 때 위험요소를 적극적으로 반영하면 환원율은 커진다."],"a":[0],"e":["틀림(정답). 운영경비에 감가상각비를 포함시켜 순수익이 상각후 순수익이 되었다면 '상각후환원율'을 적용해야 한다.","옳음. 환원율은 시장추출법이 원칙이다.","옳음. 재매도가치는 보유기간 경과 후 초년도 순수익을 최종환원율로 환원해 구한다.","옳음. 자본적 지출은 운영경비(비용)에 포함하지 않는다.","옳음. 위험요소를 크게 반영하면 위험할증률이 커져 환원율이 커진다."],"k":"순수익에서 감가상각비를 공제(운영경비에 포함)했다면 상각후환원율, 공제하지 않았다면 상각전환원율 적용.","note":"","t":"감정평가"},{"id":"2022-38","y":2022,"n":38,"q":"A는 B토지의 감정평가를 의뢰받고 인근지역 나지 거래사례인 C토지를 활용해 2억원으로 평가했다. A가 C토지 거래금액에 대해 판단할 사항은? (단, 주어진 자료에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>B, C 토지의 소재지, 용도지역 : D구, 제2종일반주거지역<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>면적 : B토지 200㎡, C토지 150㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>거래금액 : 1.5억원(거래시점 일괄지급)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>D구 주거지역 지가변동률(거래시점 ~ 기준시점) : 10% 상승<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>개별요인 : B토지 가로조건 10% 우세, 그 외 조건 대등<\/span><\/div>","o":["정상","10% 고가","20% 고가","21% 고가","31% 고가"],"a":[3],"e":["오답. 사정보정 없이 계산하면 2.42억원이 되어 평가액(2억원)과 맞지 않는다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. 1.5억 × 1.1(시점) × 1.1(개별) × 200/150 = 2.42억원. 평가액 2억원이 되려면 사정보정치 = 2/2.42 = 1/1.21 → 사례가 21% 고가로 거래되었다.","오답. 계산 결과와 다르다."],"k":"비준가액 = 사례가격 × 사정보정 × 시점수정 × 지역요인 × 개별요인 × 면적비.","note":"","t":"감정평가"},{"id":"2022-39","y":2022,"n":39,"q":"감정평가에 관한 규칙에서 규정하고 있는 내용으로 옳지 않은 것은?","box":"","o":["기업가치의 주된 평가방법은 수익환원법이다.","적정한 실거래가는 감정평가의 기준으로 적용하기에 적정하다고 판단되는 거래가격으로서, 거래시점이 도시지역은 5년 이내, 그 밖의 지역은 3년 이내인 거래가격을 말한다.","시산가액 조정시, 공시지가기준법과 그 밖의 비교방식에 속한 감정평가방법은 서로 다른 감정평가방식에 속한 것으로 본다.","필요한 경우 관련 전문가에 대한 자문등을 거쳐 감정평가할 수 있다.","항공기의 주된 평가방법은 원가법이며, 본래 용도의 효용가가 없는 물건은 해체처분가액으로 감정평가할 수 있다."],"a":[1],"e":["옳음. 기업가치는 수익환원법이 주된 방법이다.","틀림(정답). 도시지역은 '3년' 이내, 그 밖의 지역은 '5년' 이내이다. 지문은 기간이 바뀌었다.","옳음. 시산가액 조정 시 공시지가기준법과 그 밖의 비교방식은 서로 다른 방식으로 본다.","옳음. 필요한 경우 관련 전문가의 자문 등을 거칠 수 있다.","옳음. 항공기는 원가법이 주된 방법이며, 효용가치가 없으면 해체처분가액으로 평가할 수 있다."],"k":"적정한 실거래가: 도시지역 3년 이내, 그 밖의 지역 5년 이내.","note":"","t":"감정평가"},{"id":"2022-40","y":2022,"n":40,"q":"수익환원법(직접환원법)에 의한 대상부동산의 가액이 8억원일 때, 건물의 연간 감가율(회수율)은? (단, 주어진 자료에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>가능총수익 : 월 6백만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>공실 및 대손 : 연 1천 2백만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>운영경비(감가상각비 제외) : 유효총수익의 20%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지, 건물 가격구성비 : 각각 50%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지환원율, 건물상각후환원율 : 각각 연 5%<\/span><\/div>","o":["1%","2%","3%","4%","5%"],"a":[1],"e":["오답. 계산 결과와 다르다.","정답. PGI 7,200만 − 공실 1,200만 = EGI 6,000만, 경비 20% 1,200만 → NOI 4,800만. R = 4,800만/8억 = 6%. 6% = 0.5×5% + 0.5×(5%+d) → d = 2%.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 5%는 상각후환원율이다."],"k":"종합환원율 = NOI ÷ 가액. 물리적 투자결합법: R = 토지비율×토지환원율 + 건물비율×(상각후환원율 + 상각률).","note":"","t":"감정평가"},{"id":"2023-01","y":2023,"n":1,"q":"토지의 분류 및 용어에 관한 설명으로 옳은 것은?","box":"","o":["획지(劃地)는 하나의 필지 중 일부에 대해서도 성립한다.","건부지(健敷地)는 건축물의 부지로 이용중인 토지 또는 건축물의 부지로 이용가능한 토지를 말한다.","나지(裸地)는 택지 중 정착물이 없는 토지로서 공법상 제한이 없는 토지를 말한다.","제내지(堤內地)는 제방으로부터 하심측으로의 토지를 말한다.","일단지(一團地)는 제방으로부터 하심측으로의 토지를 말한다."],"a":[0],"e":["정답. 획지는 이용상황·가격수준에 따른 경제적 개념이므로 1필지의 일부에도, 여러 필지에 걸쳐서도 성립할 수 있다.","틀림. 건부지는 '이미' 건축물의 부지로 이용 중인 토지이다. 이용 가능한 토지까지 포함하지 않는다.","틀림. 나지는 정착물이 없고 '사법상' 제한이 없는 토지이다. 공법상 제한은 받을 수 있다.","틀림. 제내지는 제방에 의해 보호되는 마을 쪽(제방 안쪽) 토지이다. 제방에서 하심(河心) 측 토지는 제외지이다.","틀림. 일단지는 용도상 불가분 관계에 있는 2필지 이상의 토지를 말한다. 지문은 제외지의 설명이다."],"k":"획지는 이용·가격 개념이므로 1필지 일부 또는 여러 필지에도 성립. 제내지=제방 안쪽(마을 쪽), 제외지=하천 쪽.","note":"","t":"부동산학 총론"},{"id":"2023-02","y":2023,"n":2,"q":"A가 실지조사를 통해 확인한 1개 동의 건축물 현황이 다음과 같다. 건축법령상 용도별 건축물의 종류는?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>1층 전부를 필로티 구조로 하여 주차장으로 사용하며, 2층부터 5층까지 주택으로 사용함<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>주택으로 쓰는 바닥면적의 합계가 1,000㎡임<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>세대수 합계가 16세대로서 모든 세대에 취사시설이 설치됨<\/span><\/div>","o":["아파트","기숙사","연립주택","다가구주택","다세대주택"],"a":[2],"e":["오답. 1층 필로티(주차장)는 층수에서 제외하므로 주택 층수는 4개 층이다. 아파트는 5개 층 이상이어야 한다.","오답. 기숙사는 학생·종업원 등을 위해 공동취사 등을 할 수 있는 구조로서 독립된 주거형태를 갖추지 않은 것(일반기숙사 기준)이다.","정답. 주택 층수 4개 층 이하이고 주택 바닥면적 합계가 1,000㎡로 660㎡를 초과하므로 연립주택이다.","오답. 다가구주택은 단독주택으로 구분소유가 불가하며 주택 층수 3개 층 이하, 바닥면적 660㎡ 이하, 19세대 이하이다.","오답. 다세대주택은 바닥면적 합계 660㎡ 이하여야 하는데 1,000㎡이므로 해당하지 않는다."],"k":"필로티 주차장 층은 주택 층수에서 제외. 4개 층 이하 + 바닥면적 660㎡ 초과 = 연립주택, 660㎡ 이하 = 다세대주택, 5개 층 이상 = 아파트.","note":"","t":"부동산학 총론"},{"id":"2023-03","y":2023,"n":3,"q":"등기를 통해 소유권을 공시할 수 있는 물건 또는 권리는 몇 개인가?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>총톤수 30톤인 기선(機船)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>적재용량 25톤인 덤프트럭<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>최대 이륙중량 400톤인 항공기<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>동력차 2량과 객차 8량으로 구성된 철도차량<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>면허를 받아 김 양식업을 경영할 수 있는 권리<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>5천만원을 주고 구입하여 심은 한 그루의 소나무<\/span><\/div>","o":["1개","2개","3개","4개","5개"],"a":[0],"e":["정답(1개). 총톤수 30톤 기선만 선박등기법상 등기 대상이다(20톤 이상). 덤프트럭(건설기계)·항공기·철도차량은 '등록', 어업권은 어업권원부에 '등록', 소나무 한 그루는 입목(수목의 집단)이 아니어서 등기 불가(명인방법으로 공시)이다.","오답. 등기로 공시되는 것은 기선 하나뿐이다.","오답. 항공기는 항공안전법상 등록으로 공시한다.","오답. 철도차량도 등록 대상이다.","오답. 어업권은 등록, 단일 수목은 명인방법이다."],"k":"등기 가능: 토지·건물, 입목(수목의 집단), 총톤수 20톤 이상 기선·범선, 100톤 이상 부선, 공장·광업재단. 등록: 자동차·건설기계·항공기·철도차량·어업권 등.","note":"","t":"부동산학 총론"},{"id":"2023-04","y":2023,"n":4,"q":"주택법령상 준주택에 해당하지 않는 것은?","box":"","o":["건축법령상 공동주택 중 기숙사","건축법령상 업무시설 중 오피스텔","건축법령상 숙박시설 중 생활숙박시설","건축법령상 제2종 근린생활시설 중 다중생활시설","건축법령상 노유자시설 중 노인복지시설로서 <노인복지법>상 노인복지주택"],"a":[2],"e":["해당함. 기숙사는 준주택이다.","해당함. 오피스텔은 준주택이다.","해당하지 않음(정답). 생활숙박시설은 숙박시설이며 주택법상 준주택이 아니다.","해당함. 제2종 근린생활시설 및 숙박시설 중 다중생활시설은 준주택이다.","해당함. 노인복지주택은 준주택이다."],"k":"준주택(주택법): 기숙사, 다중생활시설, 노인복지주택, 오피스텔. 생활숙박시설은 포함되지 않음.","note":"","t":"부동산학 총론"},{"id":"2023-05","y":2023,"n":5,"q":"토지의 특성과 내용에 관한 설명으로 옳지 않은 것은?","box":"","o":["토지는 시간의 경과에 의해 마멸되거나 소멸되지 않으므로 투자재로서 선호도가 높다.","물리적으로 완전히 동일한 토지는 없으므로 부동산시장은 불완전경쟁시장이 된다.","토지는 공간적으로 연결되어 있으므로 외부효과를 발생시키고, 개발이익 환수의 근거가 된다.","토지는 용익물권의 목적물로 활용할 수 있으므로 하나의 토지에 다양한 물권자가 존재할 수 있다.","토지의 소유권은 정당한 이익있는 범위내에서 토지의 상하에 미치며, 한계고도와 한계심도의 범위는 법률로 정하고 있다."],"a":[4],"e":["옳음. 영속성(불변성)으로 물리적 소모가 없어 투자재로 선호된다.","옳음. 개별성으로 부동산시장은 불완전경쟁시장이 된다.","옳음. 인접성(연결성)으로 외부효과가 발생하고 개발이익 환수의 근거가 된다.","옳음. 지상권·전세권 등 용익물권을 설정할 수 있어 한 토지에 여러 권리자가 있을 수 있다.","틀림(정답). 토지소유권이 정당한 이익 있는 범위 내에서 상하에 미친다는 것은 맞지만, 한계고도와 한계심도의 범위를 법률로 정하고 있지는 않다(한계심도는 지자체 조례 등으로 정함)."],"k":"토지소유권의 상하 범위: '정당한 이익이 있는 범위'(민법 제212조). 한계심도는 조례 등으로 정하며 한계고도는 법률로 명확히 규정되어 있지 않다.","note":"","t":"부동산학 총론"},{"id":"2023-06","y":2023,"n":6,"q":"A는 표준지공시지가의 조사·평가를 의뢰받고 실지조사를 통해 표준지에 대해 다음과 같이 확인하였다. 표준지조사·평가보고서상 토지특성 기재방법의 연결이 옳은 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>토지이용상황 : 주변의 토지이용상황이 ‘전’으로서 돈사와 우사로 이용되고 있음<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>도로접면 : 폭 10미터의 도로와 한면이 접하면서 자동차 통행이 불가능한 폭 2미터의 도로에 다른 한면이 접함<\/span><\/div>","o":["ㄱ: 전기타, ㄴ: 중로한면","ㄱ: 전기타, ㄴ: 소로한면","ㄱ: 전축사, ㄴ: 소로각지","ㄱ: 전축사, ㄴ: 소로한면","ㄱ: 목장용지, ㄴ: 소로한면"],"a":[3],"e":["오답. 축사로 이용되므로 '전기타'가 아니라 '전축사'이며, 폭 10m 도로는 소로(8m 이상 12m 미만)이다.","오답. 이용상황은 '전축사'이다.","오답. 자동차 통행이 불가능한 세로(불)에 접한 면은 각지 판단에서 제외하므로 '각지'가 아니다.","정답. ㄱ: 전축사, ㄴ: 폭 10m 도로(소로)에 한면 접함 → 소로한면.","오답. 지목상 목장용지가 아니라 주변 이용상황이 '전'인 축사이다."],"k":"이용상황: 주변이 '전'이고 축사로 이용 → 전축사. 자동차 통행 불가 도로(세로(불))에 접한 경우 각지로 보지 않음.","note":"","t":"감정평가"},{"id":"2023-07","y":2023,"n":7,"q":"아파트 가격이 5% 하락함에 따라 아파트의 수요량 4% 증가, 아파트의 공급량 6% 감소, 연립주택의 수요량이 2% 증가하는 경우, (ㄱ)아파트 공급의 가격탄력성, (ㄴ)아파트와 연립주택의 관계는? (단, 수요의 가격탄력성은 절대값이며, 주어진 조건에 한함)","box":"","o":["ㄱ: 탄력적, ㄴ: 보완재","ㄱ: 비탄력적, ㄴ: 보완재","ㄱ: 탄력적, ㄴ: 대체재","ㄱ: 비탄력적, ㄴ: 대체재","ㄱ: 단위탄력적, ㄴ: 대체재"],"a":[0],"e":["정답. 공급탄력성 = 6%/5% = 1.2 > 1 → 탄력적. 아파트 가격 하락 시 연립주택 수요량 증가 → 교차탄력성 = 2%/(−5%) < 0 → 보완재.","오답. 1.2는 1보다 크므로 탄력적이다.","오답. 교차탄력성이 음(−)이므로 대체재가 아니라 보완재이다.","오답. 탄력적이고 보완재이다.","오답. 단위탄력적은 탄력성이 정확히 1일 때이다."],"k":"공급탄력성 = 공급량변화율/가격변화율. 교차탄력성 < 0 → 보완재, > 0 → 대체재.","note":"","t":"시장·입지·지대"},{"id":"2023-08","y":2023,"n":8,"q":"부동산의 가격탄력성과 균형변화에 관한 설명으로 옳지 않은 것은? (단, 완전탄력적과 완전비탄력적 조건이 없는 경우 수요와 공급법칙에 따르며, 다른 조건은 동일함)","box":"","o":["공급이 완전비탄력적일 경우, 수요가 증가하면 균형가격은 상승하고 균형량은 불변이다.","수요가 완전비탄력적일 경우, 공급이 감소하면 균형가격은 상승하고 균형량은 불변이다.","수요가 완전탄력적일 경우, 공급이 증가하면 균형가격은 불변이고 균형량은 증가한다.","공급이 증가하는 경우, 수요의 가격탄력성이 작을수록 균형가격의 하락폭은 크고 균형량의 증가폭은 작다.","수요가 증가하는 경우, 공급의 가격탄력성이 작을수록 균형가격의 상승폭은 작고 균형량의 증가폭은 크다."],"a":[4],"e":["옳음. 공급곡선이 수직이면 수요 증가 시 가격만 상승한다.","옳음. 수요곡선이 수직이면 공급 감소 시 가격만 상승한다.","옳음. 수요곡선이 수평이면 공급 증가 시 가격은 불변, 거래량만 증가한다.","옳음. 수요가 비탄력적일수록 공급 증가 시 가격 하락폭이 크고 거래량 증가폭이 작다.","틀림(정답). 공급이 비탄력적일수록 수요 증가 시 균형가격 상승폭은 '크고' 균형량 증가폭은 '작다'."],"k":"공급이 비탄력적일수록: 수요 증가 시 가격 상승폭↑, 거래량 증가폭↓. 수요가 비탄력적일수록: 공급 증가 시 가격 하락폭↑, 거래량 증가폭↓.","note":"","t":"시장·입지·지대"},{"id":"2023-09","y":2023,"n":9,"q":"저량(stock)의 경제변수가 아닌 것은?","box":"","o":["가계 자산","주택 가격","주택 재고량","주택 보급률","신규주택 공급량"],"a":[4],"e":["저량. 가계 자산은 특정 시점의 저량이다.","저량. 주택 가격은 특정 시점에서 측정되는 저량이다.","저량. 주택 재고량은 특정 시점에 존재하는 총량이다.","저량. 주택 보급률은 특정 시점의 주택수/가구수 비율이다.","유량(정답). 신규주택 공급량은 일정 기간 동안 측정되는 유량변수이다."],"k":"저량 = 특정 시점(자산, 가격, 재고량, 보급률, 인구). 유량 = 일정 기간(신규공급량, 소득, 임대료수입).","note":"","t":"시장·입지·지대"},{"id":"2023-10","y":2023,"n":10,"q":"부동산시장에 관한 설명으로 옳은 것은?","box":"","o":["할당 효율적 시장은 완전경쟁시장을 의미하며 불완전경쟁시장은 할당 효율적 시장이 될 수 없다.","완전경쟁시장이나 강성 효율적 시장에서는 할당 효율적인 시장만 존재한다.","약성 효율적 시장에서 과거의 역사적 정보를 통해 정상 이상의 수익을 획득할 수 있다.","완전경쟁시장에서는 초과이윤이 발생할 수 있다.","준강성 효율적 시장에서 공표된 정보는 물론 공표되지 않은 정보도 시장가치에 반영된다."],"a":[1],"e":["틀림. 불완전경쟁시장이라도 정보비용이 정보가치와 같아 초과이윤이 없다면 할당효율적일 수 있다.","정답. 완전경쟁시장과 강성 효율적 시장에서는 초과이윤이 없으므로 할당효율적인 시장만 존재한다.","틀림. 약성 효율적 시장은 과거 정보가 이미 가격에 반영되어 있어 과거 정보로는 초과수익을 얻을 수 없다.","틀림. 완전경쟁시장에서는 초과이윤이 발생할 수 없다.","틀림. 공표되지 않은 정보까지 반영되는 것은 강성 효율적 시장이다."],"k":"할당효율적 시장 = 초과이윤 없음(정보비용 = 정보가치). 완전경쟁시장·강성효율적 시장은 모두 할당효율적. 불완전경쟁시장도 할당효율적일 수 있음.","note":"","t":"시장·입지·지대"},{"id":"2023-11","y":2023,"n":11,"q":"부동산시장의 수요와 공급의 가격탄력성에 관한 설명으로 옳지 않은 것은? (단, 다른 조건은 동일함)","box":"","o":["측정하는 기간이 길수록 수요의 탄력성은 더 탄력적이다.","공급의 탄력성은 생산요소를 쉽게 얻을 수 있는 상품일수록 더 탄력적이다.","수요의 탄력성이 탄력적일 경우 임대료가 상승하면 전체 임대수입은 감소한다.","대체재가 많을수록 수요의 탄력성은 더 탄력적이다.","제품의 가격이 가계소득에서 차지하는 비중이 작을수록 수요의 탄력성이 더 탄력적이다."],"a":[4],"e":["옳음. 장기일수록 대체재 탐색이 쉬워 수요가 더 탄력적이다.","옳음. 생산요소를 쉽게 얻을수록 공급이 더 탄력적이다.","옳음. 수요가 탄력적이면 임대료 상승률보다 수요량 감소율이 커 임대수입이 감소한다.","옳음. 대체재가 많을수록 수요가 탄력적이다.","틀림(정답). 가계소득에서 차지하는 비중이 '클수록' 가격 변화에 민감하므로 수요가 더 탄력적이다."],"k":"수요가 탄력적인 조건: 대체재 많음, 측정기간 김, 소득 대비 비중 큼, 용도 세분화. 탄력적이면 가격↑ → 총수입↓.","note":"","t":"시장·입지·지대"},{"id":"2023-12","y":2023,"n":12,"q":"A도시와 B도시 사이에 있는 C도시는 A도시로부터 5km, B도시로부터 10km 떨어져있다. 각 도시의 인구 변화가 다음과 같을 때, 작년에 비해 금년에 C도시로부터 B도시의 구매활동에 유인되는 인구수의 증가는? (단, 레일리(W. Reilly)의 소매인력법칙에 따르고, C도시의 모든 인구는 A도시와 B도시에서만 구매하며, 다른 조건은 동일함)","box":"<table class=\"bt\"><tr><td>구분<\/td><td>작년 인구수<\/td><td>금년 인구수<\/td><\/tr><tr><td>A 도시<\/td><td>5만 명<\/td><td>5만 명<\/td><\/tr><tr><td>B 도시<\/td><td>20만 명<\/td><td>30만 명<\/td><\/tr><tr><td>C 도시<\/td><td>2만 명<\/td><td>3만 명<\/td><\/tr><\/table>","o":["6,000명","7,000명","8,000명","9,000명","10,000명"],"a":[2],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. 작년 A:B = 5/5² : 20/10² = 0.2 : 0.2 = 1:1 → B 유인 1만명. 금년 A:B = 0.2 : 0.3 = 2:3 → B 유인 3만×3/5 = 1.8만명. 증가 = 8,000명.","오답. 계산 결과와 다르다.","오답. C도시 인구 증가분(1만명)과 혼동한 값이다."],"k":"레일리 소매인력법칙: 유인력 ∝ 인구 / 거리².","note":"","t":"시장·입지·지대"},{"id":"2023-13","y":2023,"n":13,"q":"시장실패의 원인으로 옳지 않은 것은?","box":"","o":["외부효과","정보의 대칭성","공공재의 공급","불완전경쟁시장","시장의 자율적 조절기능 상실"],"a":[1],"e":["원인 맞음. 외부효과는 대표적인 시장실패 원인이다.","원인 아님(정답). 정보의 '비대칭성'이 시장실패의 원인이다. 정보가 대칭적이면 오히려 효율적 시장에 가깝다.","원인 맞음. 공공재는 비경합성·비배제성으로 무임승차 문제가 생겨 과소공급된다.","원인 맞음. 독과점 등 불완전경쟁은 시장실패 원인이다.","원인 맞음. 시장의 자율적 조절기능 상실 자체가 시장실패이다."],"k":"시장실패 원인: 외부효과, 공공재, 불완전경쟁(독과점), 정보의 '비대칭성', 규모의 경제.","note":"","t":"정책·조세"},{"id":"2023-14","y":2023,"n":14,"q":"외부효과에 관한 설명으로 옳은 것은?","box":"","o":["외부효과란 거래 당사자가 시장메카니즘을 통하여 상대방에게 미치는 유리하거나 불리한 효과를 말한다.","부(-)의 외부효과는 의도되지 않은 손해를 주면서 그 대가를 지불하지 않는 외부경제라고 할 수 있다.","정(+)의 외부효과는 소비에 있어 사회적 편익이 사적 편익보다 큰 결과를 초래한다.","부(-)의 외부효과에는 보조금 지급이나 조세경감의 정책이 필요하다.","부(-)의 외부효과는 사회적 최적생산량보다 시장생산량이 적은 과소생산을 초래한다."],"a":[2],"e":["틀림. 외부효과는 시장메커니즘을 '통하지 않고' 제3자에게 의도하지 않은 이익·손해를 주는 것이다.","틀림. 대가 없이 손해를 주는 것은 외부'불'경제이다.","정답. 정(+)의 외부효과가 있으면 사회적 편익이 사적 편익보다 크다.","틀림. 부(-)의 외부효과에는 조세 부과·규제가 필요하고, 보조금·조세경감은 정(+)의 외부효과에 대한 정책이다.","틀림. 부(-)의 외부효과는 사적비용이 사회적비용보다 작아 '과다생산'을 초래한다."],"k":"정의 외부효과: 사회적 편익 > 사적 편익 → 과소생산 → 보조금. 부의 외부효과(외부불경제): 사회적 비용 > 사적 비용 → 과다생산 → 조세·규제.","note":"","t":"시장·입지·지대"},{"id":"2023-15","y":2023,"n":15,"q":"투자부동산 A에 관한 투자분석을 위해 관련 자료를 수집한 내용은 다음과 같다. 이 경우 순영업소득은? (단, 주어진 자료에 한하며, 연간 기준임)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>유효총소득: 360,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>직원 인건비: 80,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출원리금 상환액: 50,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>감가상각비: 40,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>수도광열비: 36,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>용역비: 30,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>수선유지비: 18,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>재산세: 18,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>공실손실상당액·대손충당금: 18,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>사업소득세: 3,000,000원<\/span><\/div>","o":["138,000,000원","157,000,000원","160,000,000원","178,000,000원","258,000,000원"],"a":[3],"e":["오답. 대출원리금 등 영업경비가 아닌 항목까지 차감한 값이다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. 영업경비 = 인건비 8,000만 + 수도광열비 3,600만 + 용역비 3,000만 + 수선유지비 1,800만 + 재산세 1,800만 = 1억 8,200만원. NOI = 3억 6,000만 − 1억 8,200만 = 1억 7,800만원.","오답. 유효총소득에서 일부 비용만 공제한 값이다."],"k":"영업경비 불포함 항목: 공실·대손(이미 EGI에 반영), 부채서비스액, 감가상각비, 소득세(법인세), 자본적 지출.","note":"","t":"투자·금융"},{"id":"2023-16","y":2023,"n":16,"q":"부동산투자와 위험에 관한 설명으로 옳은 것은?","box":"","o":["상업용 부동산투자는 일반적으로 다른 상품에 비하여 초기투자비용이 많이 들며 투자비용의 회수기간이 길지만 경기침체에 민감하지 않아 투자위험이 낮다.","시장위험이란 부동산이 위치한 입지여건의 변화 때문에 발생하는 위험으로서, 부동산시장의 수요·공급과 관련된 상황의 변화와 관련되어 있다.","사업위험이란 부동산 사업자체에서 발생하는 수익성 변동의 위험을 말하며 시장위험, 입지위험, 관리·운영위험 등이 있다.","법·제도적 위험에는 소유권위험, 정부정책위험, 정치적위험, 불가항력적 위험, 유동성위험이 있다.","위험과 수익간에는 부(-)의 관계가 성립한다."],"a":[2],"e":["틀림. 상업용 부동산은 경기에 민감하여 투자위험이 높은 편이다.","틀림. 입지여건의 변화로 인한 위험은 '위치적 위험'이다. 시장위험은 수요·공급 등 시장상황 변화에 따른 위험이다.","정답. 사업위험은 부동산 사업 자체의 수익성 변동 위험으로 시장위험, 입지위험, 관리·운영위험 등이 있다.","틀림. 유동성위험은 환금성 관련 위험으로 법·제도적 위험에 속하지 않는다.","틀림. 위험이 클수록 요구하는 수익도 커지므로 정(+)의 관계이다."],"k":"사업위험 = 시장위험 + 위치(입지)위험 + 관리·운영위험. 위험과 수익은 정(+)의 관계.","note":"","t":"투자·금융"},{"id":"2023-17","y":2023,"n":17,"q":"부동산투자에 관한 설명으로 옳은 것은?","box":"","o":["부동산투자는 부동산이 갖고 있는 고유한 특성이 있지만 환금성, 안전성 측면에서 주식 투자와 다르지 않다.","부동산은 실물자산이기 때문에 인플레이션 방어 능력이 우수하여 디플레이션과 같은 경기침체기에 좋은 투자대상이다.","부동산은 다른 투자상품에 비하여 거래비용의 부담이 크지만 부동산시장은 정보의 대칭성으로 인한 효율적 시장이다.","부동산투자는 부동산의 사회적·경제적·행정적 위치의 가변성 등으로 인해 부동산시장의 변화를 면밀히 살펴야 한다.","투자의 금융성이란 투자자가 투자자산을 필요한 시기에 손실없이 현금으로 전환할 수 있는 안전성의 정도를 말한다."],"a":[3],"e":["틀림. 부동산은 주식에 비해 환금성이 낮고 안전성은 상대적으로 높은 등 차이가 있다.","틀림. 디플레이션기에는 실물자산 가치가 하락하므로 좋은 투자대상이 아니다.","틀림. 부동산시장은 정보의 비대칭성이 있는 비효율적 시장이다.","정답. 사회적·경제적·행정적 위치는 가변적이므로 시장 변화를 면밀히 분석해야 한다.","틀림. 지문은 '유동성(환금성)'에 대한 설명이다. 금융성은 담보·레버리지 등 금융수단으로 활용할 수 있는 성질이다."],"k":"부동산: 환금성 낮음, 인플레이션 헤지(디플레이션에는 불리), 정보 비대칭·고거래비용 → 비효율적 시장.","note":"","t":"투자·금융"},{"id":"2023-18","y":2023,"n":18,"q":"부동산투자에 관한 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>순현재가치(NPV)법이란 투자로부터 발생하는 현재와 미래의 모든 현금흐름을 적절한 할인율로 할인하여 현재가치로 환산하고 이를 통하여 투자의사결정에 이용하는 기법이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>추계된 현금수지에 대한 위험을 평가하는 위험할증률의 추계는 투자기간의 결정 및 현금수지에 대한 예측 이전에 해야 한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>내부수익률(IRR)이란 투자로부터 발생하는 미래의 현금흐름의 순현재가치와 부동산가격을 1로 만드는 할인율을 말한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>수익성지수(PI)는 투자로 인해 발생하는 현금유입의 현재가치를 현금유출의 현재가치로 나눈 비율로서 1보다 크면 경제적 타당성이 있는 것으로 판단한다.<\/span><\/div>","o":["ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":[0],"e":["정답. ㄱ(NPV법 정의)과 ㄹ(PI = 유입현가/유출현가, 1보다 크면 타당)만 옳다.","오답. ㄴ·ㄷ 모두 틀렸다.","오답. ㄴ·ㄷ이 틀렸다.","오답. ㄴ은 순서가 틀렸다. 위험할증률은 현금수지 예측 이후 그 위험을 평가해 추계한다.","오답. ㄷ은 IRR을 'NPV를 0으로' 만드는 할인율로 고쳐야 한다(수익성지수를 1로 만드는 할인율로 표현할 수도 있다)."],"k":"IRR = NPV를 0으로 만드는 할인율(PI를 1로). 위험할증률은 현금흐름 예측 '이후' 위험을 평가해 결정.","note":"","t":"투자·금융"},{"id":"2023-19","y":2023,"n":19,"q":"화폐의 시간가치에 관한 설명으로 옳지 않은 것은?","box":"","o":["인플레이션, 화폐의 시차선호, 미래의 불확실성은 화폐의 시간가치를 발생시키는 요인이다.","감채기금이란 일정기간 후에 일정금액을 만들기 위해 매 기간 납입해야 할 금액을 말한다.","연금의 미래가치란 매 기간마다 일정금액을 불입해 나갈 때, 미래 일정시점에서의 불입금액 총액의 가치를 말한다.","현재가치에 대한 미래가치를 산출하기 위하여 사용하는 이율을 이자율이라 하고, 미래가치에 대한 현재가치를 산출하기 위하여 사용하는 이율을 할인율이라 한다.","부동산 경기가 침체하는 시기에 상업용 부동산의 수익이 일정함에도 불구하고 부동산가격이 떨어지는 것은 할인율이 낮아지기 때문이다."],"a":[4],"e":["옳음. 인플레이션, 시차선호, 불확실성이 시간가치의 원인이다.","옳음. 감채기금계수를 이용해 매기 적립액을 구한다.","옳음. 연금의 미래가치(연금의 내가계수) 설명이다.","옳음. 미래가치 산출에는 이자율, 현재가치 산출에는 할인율이라 부른다.","틀림(정답). 수익이 일정한데 가격이 떨어지는 것은 위험 증가 등으로 할인율이 '높아지기' 때문이다."],"k":"가치 = 수익 ÷ 할인율. 수익 일정 + 가격 하락 ⇒ 할인율(요구수익률) 상승.","note":"","t":"투자·금융"},{"id":"2023-21","y":2023,"n":21,"q":"주택금융의 상환방식에 관한 설명으로 옳지 않은 것은?","box":"","o":["만기일시상환방식은 대출만기 때까지는 원금상환이 전혀 이루어지지 않기에 매월 내는 이자가 만기 때까지 동일하다.","원금균등분할상환방식은 대출 초기에 대출원리금의 지급액이 가장 크기에 차입자의 원리금지급 부담도 대출 초기에 가장 크다.","원리금균등분할상환방식은 매기의 대출원리금이 동일하기에 대출 초기에는 대체로 원금상환 부분이 작고 이자지급 부분이 크다.","점증상환방식은 초기에 대출이자를 전부 내고, 나머지 대출원금을 상환하는 방식으로 부의 상환 (negative amortization)이 일어날 수 있다.","원금균등분할상환방식이나 원리금균등분할상환방식에서 거치기간을 별도로 정할 수 있다."],"a":[3],"e":["옳음. 만기일시상환은 원금이 그대로이므로 (고정금리라면) 매월 이자가 동일하다.","옳음. 원금균등분할은 초기에 잔액이 커서 이자가 많으므로 초기 원리금 부담이 가장 크다.","옳음. 원리금균등은 초기에 이자 비중이 크고 원금 비중이 작다.","틀림(정답). 점증상환은 초기에 낮은 금액을 내고 점차 늘려가는 방식으로, 초기 상환액이 이자에도 미치지 못할 때 미납이자가 원금에 가산되는 부의 상환이 발생한다. '초기에 이자를 전부 낸다'는 설명은 틀렸다.","옳음. 분할상환방식에서도 거치기간을 둘 수 있다."],"k":"점증상환: 초기 상환액이 이자에도 못 미칠 수 있어 부(-)의 상환 발생 가능. 원금균등: 초기 부담 최대.","note":"","t":"투자·금융"},{"id":"2023-22","y":2023,"n":22,"q":"프로젝트 금융에 관한 설명으로 옳은 것은?","box":"","o":["기업전체의 자산 또는 신용을 바탕으로 자금을 조달하고, 기업의 수익으로 원리금을 상환하거나 수익을 배당하는 방식의 자금조달기법이다.","프로젝트 사업주는 기업 또는 개인일 수 있으나, 법인은 될 수 없다.","프로젝트 사업주는 대출기관으로부터 상환청구를 받지는 않으나, 이러한 방식으로 조달한 부채는 사업주의 재무상태표에는 부채로 계상된다.","프로젝트 회사가 파산 또는 청산할 경우, 채권자들은 프로젝트 회사에 대해 원리금상환을 청구할 수 없다.","프로젝트 사업주의 도덕적 해이를 방지하기 위해 금융기관은 제한적 소구금융의 장치를 마련해두기도 한다."],"a":[4],"e":["틀림. 기업 전체 신용이 아니라 프로젝트 자체의 사업성과 현금흐름을 담보로 자금을 조달한다.","틀림. 사업주는 법인도 될 수 있다.","틀림. PF 부채는 프로젝트 회사(SPC)의 부채이므로 사업주의 재무상태표에 계상되지 않는다(부외금융).","틀림. 채권자는 프로젝트 회사에는 청구할 수 있으나 원칙적으로 사업주에게 상환을 청구할 수 없다.","정답. 사업주의 도덕적 해이를 막기 위해 일정한 경우 사업주에게 책임을 묻는 제한적 소구금융 장치를 두기도 한다."],"k":"PF: 프로젝트 자체 사업성 기반, 부외금융, 비소구·제한적 소구. 사업주 도덕적 해이 방지 → 제한적 소구.","note":"","t":"투자·금융"},{"id":"2023-23","y":2023,"n":23,"q":"부동산금융 및 투자에 관한 설명으로 옳지 않은 것은?","box":"","o":["부동산금융은 부동산의 매입이나 매각, 개발 등과 관련하여 자금이나 신용을 조달하거나 제공하는 것을 말한다.","부동산의 특성과 관련하여 분할거래의 용이성과 생산의 장기성으로 인해 부동산금융은 부동산의 거래나 개발 등에서 중요한 역할을 하게 된다.","부동산투자에서 지분투자자가 대상 부동산에 가지는 권한을 지분권이라 하고, 저당투자자가 대상 부동산에 가지는 권한을 저당권이라 한다.","부동산보유자는 보유부동산의 증권화를 통해 유동성을 확보할 수 있다.","부동산금융이 일반금융과 다른 점으로는 담보기능과 감가상각 및 차입금 이자에 대한 세금감면이 있다."],"a":[1],"e":["옳음. 부동산금융의 정의이다.","틀림(정답). 부동산은 고가이고 분할거래가 '어렵기' 때문에 금융의 역할이 중요하다. 분할거래의 용이성은 틀린 표현이다.","옳음. 지분투자자는 지분권, 저당투자자는 저당권을 가진다.","옳음. 증권화(유동화)를 통해 부동산을 현금화해 유동성을 확보할 수 있다.","옳음. 담보 기능과 감가상각·이자비용의 절세효과가 부동산금융의 특징이다."],"k":"부동산은 고가성·분할거래 곤란·생산의 장기성 → 금융의 중요성↑.","note":"","t":"투자·금융"},{"id":"2023-24","y":2023,"n":24,"q":"부동산시장세분화에 관한 설명으로 옳지 않은 것은?","box":"","o":["시장세분화는 가격차별화, 최적의사결정, 상품차별화 등에 기초하여 부동산시장을 서로 다른 둘 또는 그 이상의 상위시장으로 묶는 과정이다.","시장을 세분화하는데 주로 사용되는 기준으로는 지리적 변수, 인구통계학적 변수, 심리적 변수, 행동적 변수 등이 있다.","시장세분화전략은 세분된 시장을 대상으로 상품의 판매 지향점을 명확히 하는 것을 말한다.","부동산회사가 세분시장을 평가할 때, 우선해야 할 사항으로 적절한 시장규모와 성장성을 들 수 있다.","세분시장에서 경쟁력과 매력도를 평가할 때 기존 경쟁자의 위협, 새로운 경쟁자의 위협, 대체재의 위협, 구매자의 협상력 증가 위협, 공급자의 협상력 증가 위협 등을 고려한다."],"a":[0],"e":["틀림(정답). 시장세분화는 시장을 서로 다른 둘 이상의 '하위시장'으로 구분하는 과정이다. 상위시장으로 묶는 것이 아니다.","옳음. 지리적·인구통계학적·심리적·행동적 변수가 주된 세분화 기준이다.","옳음. 세분된 시장을 대상으로 상품 판매의 지향점을 분명히 하는 것이다.","옳음. 세분시장 평가 시 우선 적절한 규모와 성장성을 본다.","옳음. 포터의 5가지 경쟁요인(기존 경쟁자, 신규 진입자, 대체재, 구매자 교섭력, 공급자 교섭력)을 고려한다."],"k":"시장세분화 = 전체 시장을 동질적인 '하위시장'으로 나누는 것. 세분시장 평가: 규모·성장성 → 구조적 매력도(5 forces) → 목표·자원.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-25","y":2023,"n":25,"q":"다음 설명에 모두 해당하는 부동산개발방식은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>사업부지를 소유하고 있는 토지소유자가 개발이 완료된 후 개발업자나 시공사에게 공사대금을 완공된 일부의 건물로 변제하고, 나머지는 분양하거나 소유하는 형태이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지소유자는 대상 부지의 소유권을 소유한 상태에서 개발사업이 진행되도록 유도할 수 있고, 그 결과 발생되는 부동산가치의 상승분을 취득할 수 있는 이점이 있다.<\/span><\/div>","o":["공영개발방식","직접개발방식","대물교환방식","토지신탁방식","BTL사업방식"],"a":[2],"e":["오답. 공영개발은 공공기관이 토지를 수용·매수해 개발하는 방식이다.","오답. 직접개발은 토지소유자가 자금·위험을 모두 부담하여 직접 개발하는 방식이다.","정답. 대물교환(등가교환)방식은 토지소유자가 개발업자·시공사에게 공사대금을 건물 일부로 변제하고 나머지는 분양·소유하는 방식이다.","오답. 토지신탁방식은 신탁회사에 소유권을 형식적으로 이전하고 개발·분양 후 수익을 배당받는 방식이다.","오답. BTL은 민간이 시설을 건설해 정부에 소유권을 이전하고 임대료를 받는 민간투자방식이다."],"k":"등가교환(대물교환)방식: 토지소유자가 공사대금을 완공 건물 일부로 지급(토지소유권 유지).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-26","y":2023,"n":26,"q":"부동산개발사업의 위험에 관한 설명이다. ( )에 들어갈 내용으로 옳은 것은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄱ )은 추정된 토지비, 건축비, 설계비 등 개발비용의 범위 내에서 개발이 이루어져야 하는데, 인플레이션 및 예상치 못한 개발기간의 장기화 등으로 발생할 수 있다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄴ )은 용도지역제와 같은 토지이용규제와 변화와 관계기관 인허가 승인의 불확실성 등으로 야기될 수 있다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄷ )은 개발기간 중 이자율의 변화, 시장침체에 따른 공실의 장기화 등이 원인일 수 있다.<\/span><\/div>","o":["ㄱ: 시장위험, ㄴ: 계획위험, ㄷ: 비용위험","ㄱ: 시장위험, ㄴ: 법률위험, ㄷ: 비용위험","ㄱ: 비용위험, ㄴ: 계획위험, ㄷ: 시장위험","ㄱ: 비용위험, ㄴ: 법률위험, ㄷ: 시장위험","ㄱ: 비용위험, ㄴ: 법률위험, ㄷ: 계획위험"],"a":[3],"e":["오답. ㄱ은 비용위험, ㄷ은 시장위험이며, ㄴ은 법률위험이다.","오답. ㄱ·ㄷ이 바뀌었다.","오답. ㄴ은 계획위험이 아니라 법률위험이다.","정답. ㄱ: 비용위험(개발비 초과), ㄴ: 법률위험(토지이용규제·인허가), ㄷ: 시장위험(이자율·공실).","오답. ㄷ은 시장위험이다."],"k":"개발위험(Wofford): 법률위험(인허가·규제), 시장위험(수요·공실·이자율), 비용위험(개발비 초과).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-27","y":2023,"n":27,"q":"도시 및 주거환경정비법령상 다음에 해당하는 정비사업은?","box":"<div class=\"bp\">도시저소득 주민이 집단거주하는 지역으로서 정비기반시설이 극히 열악하고 노후·불량건축물이 과도하게 밀집한 지역의 주거환경을 개선하거나 단독주택 및 다세대주택이 밀집한 지역에서 정비기반시설과 공동이용시설 확충을 통하여 주거환경을 보전·정비·개량하기 위한 사업<\/div>","o":["도시환경정비사업","주거환경개선사업","주거환경관리사업","가로주택정비사업","재정비촉진사업"],"a":[1],"e":["오답. 도시환경정비사업은 상업·공업지역 등의 도심기능 회복을 위한 사업으로, 현행법상 재개발사업에 통합되었다.","정답. 도시정비법상 주거환경개선사업의 정의이다.","오답. 주거환경관리사업은 구법상의 사업으로 현재 주거환경개선사업에 통합되었다.","오답. 가로주택정비사업은 빈집 및 소규모주택 정비법상의 사업이다.","오답. 재정비촉진사업은 도시재정비 촉진을 위한 특별법상의 사업이다."],"k":"주거환경개선사업: 저소득층 밀집, 정비기반시설 극히 열악 지역 + 단독·다세대 밀집지 보전·정비·개량.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-28","y":2023,"n":28,"q":"부동산신탁에 관한 설명으로 옳지 않은 것은?","box":"","o":["신탁회사의 전문성을 통해 이해관계자들에게 안전성과 신뢰성을 제공해 줄 수 있다.","부동산신탁의 수익자란 신탁행위에 따라 신탁이익을 받는 자를 말하며, 위탁자가 지정한 제3자가 될 수도 있다.","부동산신탁계약에서의 소유권 이전은 실질적 이전이 아니라 등기부상의 형식적 소유권 이전이다.","신탁재산은 법률적으로 수탁자에게 귀속되지만 수익자를 위한 재산이므로 수탁자의 고유재산 및 위탁자의 고유재산으로부터 독립된다.","부동산담보신탁은 저당권 설정보다 소요되는 경비가 많고, 채무불이행 시 부동산 처분 절차가 복잡하다."],"a":[4],"e":["옳음. 신탁회사의 전문성으로 안전성과 신뢰성을 제공한다.","옳음. 수익자는 위탁자 자신 또는 위탁자가 지정한 제3자일 수 있다.","옳음. 신탁 시 등기부상 소유권은 수탁자에게 이전되지만 이는 형식적 이전이다.","옳음. 신탁재산은 수탁자·위탁자의 고유재산으로부터 독립(독립성·강제집행 금지)된다.","틀림(정답). 담보신탁은 저당권 설정보다 비용이 '적게' 들고, 채무불이행 시 신탁회사가 공매로 처분하므로 경매보다 절차가 '간편·신속'하다."],"k":"담보신탁: 저당권보다 비용 저렴(등록세·채권매입 부담↓), 처분은 신탁회사 공매로 신속·간편.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-29","y":2023,"n":29,"q":"공인중개사법령상 개업공인중개사가 인터넷을 이용하여 중개대상물인 건축물에 관한 표시·광고를 할 때 명시하여야 하는 사항이 아닌 것은?","box":"","o":["건축물의 방향","건축물의 소유자","건축물의 총 층수","건축물의 준공검사를 받은 날","건축물의 주차대수 및 관리비"],"a":[1],"e":["명시사항. 건축물의 방향은 명시해야 한다.","명시사항 아님(정답). 건축물의 소유자는 인터넷 표시·광고 명시사항이 아니다.","명시사항. 총 층수는 명시해야 한다.","명시사항. 사용승인·사용검사·준공검사를 받은 날을 명시해야 한다.","명시사항. 주차대수와 관리비를 명시해야 한다."],"k":"인터넷 표시·광고 명시사항(건축물): 총 층수, 사용승인·사용검사·준공검사일, 방향, 방·욕실 개수, 입주가능일, 주차대수, 관리비 등. 소유자는 해당 없음.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-30","y":2023,"n":30,"q":"공인중개사법령상 중개계약 시 거래계약서에 기재하여야 하는 사항은 모두 몇 개인가?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>물건의 표시<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>권리이전의 내용<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>물건의 인도일시<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>거래당사자의 인적 사항<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>거래금액·계약금액 및 그 지급일자 등 지급에 관한 사항<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>계약의 조건이나 기한이 있는 경우에는 그 조건 또는 기한<\/span><\/div>","o":["2개","3개","4개","5개","6개"],"a":[4],"e":["오답. 6개 모두 기재사항이다.","오답. 6개 모두 기재사항이다.","오답. 6개 모두 기재사항이다.","오답. 6개 모두 기재사항이다.","정답(6개). 제시된 6개 항목 모두 공인중개사법 시행령상 거래계약서 필수 기재사항이다."],"k":"거래계약서 필수 기재: 당사자 인적사항, 물건 표시, 계약일, 거래금액·계약금·지급일자, 물건 인도일시, 권리이전 내용, 조건·기한, 확인설명서 교부일자, 그 밖의 약정.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-31","y":2023,"n":31,"q":"우리나라의 부동산조세정책에 관한 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>부가가치세와 등록면허세는 국세에 속한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>재산세와 상속세는 신고납부방식이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>증여세와 재산세는 부동산의 보유단계에 부과한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>상속세와 증여세는 누진세율을 적용한다.<\/span><\/div>","o":["ㄹ","ㄱ, ㄹ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ"],"a":[0],"e":["정답. ㄹ만 옳다. 상속세·증여세는 10~50%의 초과누진세율을 적용한다.","오답. ㄱ: 부가가치세는 국세지만 등록면허세는 지방세이다.","오답. ㄴ: 재산세는 과세관청이 부과·고지하는 보통징수 방식이다. ㄷ: 증여세는 취득단계 조세이다.","오답. ㄱ·ㄴ·ㄷ 모두 틀렸다.","오답. ㄱ·ㄴ이 틀렸다."],"k":"등록면허세=지방세, 재산세=보통징수(부과고지), 증여세=취득단계, 상속·증여세=초과누진세율.","note":"","t":"정책·조세"},{"id":"2023-32","y":2023,"n":32,"q":"우리나라의 부동산등기제도와 권리분석에 관한 설명으로 옳지 않은 것은?","box":"","o":["소유권이전등기 청구권을 확보하기 위해 처분금지가처분의 등기가 가능하다.","현재 환매(특약)등기제와 예고등기제는 <부동산등기법>상 폐지되었다.","등기의 순서는 같은 구(區)에서 한 등기 상호간에는 순위번호에 따른다.","근저당권과 담보가등기는 부동산경매에서 말소기준권리가 된다.","부동산임차권은 부동산물권이 아니지만 등기할 수 있다."],"a":[1],"e":["옳음. 소유권이전등기청구권 보전을 위해 처분금지가처분 등기를 할 수 있다.","틀림(정답). 예고등기는 폐지되었지만 환매특약등기는 현재도 존재한다.","옳음. 같은 구에서는 순위번호, 다른 구 사이에서는 접수번호에 따른다.","옳음. 근저당권과 담보가등기는 말소기준권리가 될 수 있다.","옳음. 임차권은 채권이지만 등기할 수 있다(민법 제621조)."],"k":"2011년 부동산등기법 개정으로 '예고등기'만 폐지. 환매특약등기는 현재도 존재.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-33","y":2023,"n":33,"q":"등기사항전부증명서의 갑구(甲區)에서 확인할 수 없는 내용은?","box":"","o":["가압류","가등기","소유권","근저당권","강제경매개시결정"],"a":[3],"e":["확인 가능. 소유권에 대한 가압류는 갑구에 기재된다.","확인 가능. 소유권이전청구권 가등기는 갑구에 기재된다.","확인 가능. 소유권은 갑구 사항이다.","확인 불가(정답). 근저당권은 소유권 이외의 권리이므로 '을구'에 기재된다.","확인 가능. 강제경매개시결정등기는 갑구에 기재된다."],"k":"갑구: 소유권 및 소유권에 관한 사항(가등기·가압류·압류·가처분·경매개시결정 등). 을구: 소유권 외 권리(저당권·전세권·지상권 등).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-34","y":2023,"n":34,"q":"토지에 관한 강제경매절차에서 토지의 부합물로서 낙찰자가 소유권을 취득할 수 있는 경우를 모두 고른 것은?","box":"<div class=\"bp\">(다툼이 있으면 판례에 의함)<\/div><div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>토지소유자가 마당에 설치한 연못<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>타인이 토지소유자의 동의 없이 임의로 심은 조경수<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>토지에 지상권을 가진 자가 경작을 위해 심은 감나무<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>기둥, 지붕 및 주벽의 공사가 완료되어 건물로서의 외관을 갖추었으나 사용승인을 받지 못한 건물<\/span><\/div>","o":["ㄱ, ㄴ","ㄴ, ㄷ","ㄱ, ㄴ, ㄷ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":[0],"e":["정답. ㄱ(연못)은 토지의 구성부분으로 부합하고, ㄴ(권원 없이 타인이 심은 조경수)도 토지에 부합하여 낙찰자가 취득한다.","오답. ㄷ은 지상권이라는 정당한 권원에 의해 심은 것이므로 부합하지 않는다(민법 제256조 단서).","오답. ㄷ이 포함되어 틀렸다.","오답. ㄹ은 기둥·지붕·주벽을 갖추면 사용승인 여부와 무관하게 독립된 건물이므로 토지에 부합하지 않는다.","오답. ㄷ·ㄹ은 부합물이 아니다."],"k":"부합: 권원 없이 심은 수목은 토지에 부합. 권원(지상권 등)에 의해 심은 수목·독립 건물은 부합하지 않음.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2023-35","y":2023,"n":35,"q":"감정평가에 관한 규칙과 감정평가 실무기준상 임대료 감정평가에 관한 설명으로 옳지 않은 것은?","box":"","o":["임대사례비교법으로 감정평가 할 때 임대사례에 특수한 사정이나 개별적 동기가 반영되어 수집된 임대사례의 임대료가 적절하지 못한 경우에는 사정보정을 통해 그러한 사정이 없었을 경우의 적절한 임대료 수준으로 정상화하여야 한다.","시점수정은 대상물건의 임대료 변동률로 함을 원칙으로 한다.","감정평가법인등은 임대료를 감정평가할 때에 임대사례비교법을 적용해야 한다.","적산법은 원가방식에 기초하여 대상물건의 임대료를 산정하는 감정평가방법이다.","수익분석법이란 일반기업 경영에 의하여 산출된 총수익을 분석하여 대상물건이 일정한 기간에 산출할 것으로 기대되는 순수익에 대상물건을 계속하여 임대하는 데에 필요한 경비를 더하여 대상물건의 임대료를 산정하는 감정평가방법을 말한다."],"a":[1],"e":["옳음. 사정보정을 통해 사례 임대료를 정상화해야 한다.","틀림(정답). 임대료 시점수정은 '사례물건'의 임대료 변동률을 기준으로 하는 것이 원칙이며, '대상물건'의 임대료 변동률로 한다는 규정은 없다.","옳음. 감정평가에 관한 규칙 제22조: 임대료는 임대사례비교법을 적용한다.","옳음. 적산법은 기초가액 × 기대이율 + 필요제경비로 임대료를 구하는 원가방식이다.","옳음. 수익분석법의 정의이다."],"k":"임대료 평가: 임대사례비교법 원칙. 시점수정은 '사례물건'의 임대료 변동률로 함이 원칙. 적산법=원가방식, 수익분석법=수익방식.","note":"","t":"감정평가"},{"id":"2023-36","y":2023,"n":36,"q":"감정평가방법 중 거래사례비교법과 관련된 설명으로 옳지 않은 것은?","box":"","o":["거래사례비교법은 실제 거래되는 가격을 준거하므로 현실성이 있으며 설득력이 풍부하다는 장점이 있다.","거래사례비교법과 관련된 가격원칙은 대체의 원칙이고, 구해진 가액은 비준가액이라 한다.","거래사례비교법은 대상부동산과 동질·동일성이 있어서 비교 가능한 사례를 채택하는 것이 중요하다.","거래사례는 위치에 있어서 동일성 내지 유사성이 있어야 하며, 인근지역에 소재하는 경우에는 지역요인비교를 하여야 한다.","거래사례에 사정보정요인이 있는 경우 우선 사정보정을 하고, 거래시점과 기준시점간의 시간적 불일치를 정상화하는 작업인 시점수정을 하여야 한다."],"a":[3],"e":["옳음. 실제 거래가격에 근거해 현실성·설득력이 높다.","옳음. 대체의 원칙에 근거하며 결과 가액을 비준가액이라 한다.","옳음. 비교 가능성(위치·물적 유사성)이 있는 사례 선택이 중요하다.","틀림(정답). 사례가 '인근지역'에 있으면 지역요인이 같으므로 지역요인 비교가 필요 없다. 유사지역에 있을 때 지역요인 비교를 한다.","옳음. 사정보정 후 시점수정을 하는 것이 일반적인 순서이다."],"k":"사례가 인근지역 = 지역요인 비교 불필요(개별요인만). 유사지역(동일수급권) = 지역요인 비교 필요.","note":"","t":"감정평가"},{"id":"2023-37","y":2023,"n":37,"q":"감정평가방식 중 원가방식에 관련된 설명으로 옳은 것은?","box":"","o":["원가방식은 대체의 원칙, 수요와 공급의 원칙, 균형의 원칙, 외부의 원칙, 예측의 원칙과 밀접한 관련이 있다.","재조달원가란 대상물건을 기준시점에 재생산 또는 재취득하는데 필요한 적정원가의 총액으로서 원칙적으로 그 대상물건 값의 상한선을 나타낸다.","대치원가(replacement cost)란 건축자재, 설비공법 등에 있어 신축시점의 표준적인 것을 사용한 적정원가로서 이미 기능적 감가는 반영되어 있다.","재조달원가를 구하는 방법은 직접법으로 총가격적산법(총량조사법), 변동율적용법(비용지수법) 등이 있고, 간접법으로 부분별단가적용법, 단위비교법 등이 있다.","감가수정에 있어서 감가요인은 물리적요인, 기능적요인, 경제적요인이 있으며, 감가상각에 있어서 감가요인은 물리적요인, 경제적요인이 있다."],"a":[1],"e":["틀림. 원가방식과 관련된 원칙은 대체·수요공급·균형·외부성 등이며, 예측의 원칙은 수익방식과 밀접하다.","정답. 재조달원가는 기준시점에 재생산·재취득하는 데 필요한 적정원가 총액으로, 원칙적으로 대상물건 가치의 상한선이다.","틀림. 대치원가는 '기준시점'의 표준적인 자재·공법으로 같은 효용을 가진 건물을 만드는 원가이다.","틀림. 출제 기준에 따르면 총가격적산법·부분별단가적용법·변동률적용법·단위비교법은 모두 직접법으로 분류하며, 간접법은 유사 사례의 재조달원가를 비준하는 방법이다.","틀림. 회계상 감가상각의 감가요인은 물리적·'기능적' 요인이다. 경제적 요인은 감정평가의 감가수정에서만 고려된다."],"k":"재조달원가는 가치의 상한선. 대치원가는 '기준시점'의 표준 자재·공법 → 기능적 감가 일부 반영. 회계상 감가상각 요인은 물리적·기능적.","note":"","t":"감정평가"},{"id":"2023-38","y":2023,"n":38,"q":"다음 조건을 가진 부동산을 통해 산출한 내용으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>가능총소득(PGI) : 연 150,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>공실손실상당액·대손충당금 : 가능총소득의 10%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>운영경비(OE) : 유효총소득의 30%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출원리금 상환액 : 연 40,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>가격구성비 : 토지 40%, 건물 60%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지환원이율 : 연 3%, 건물환원이율 : 연 5%<\/span><\/div>","o":["운영경비는 40,500,000원이다.","종합환원이율은 연 4.2%이다.","순영업소득(NOI)은 94,500,000원이다.","유효총소득(EGI)는 135,000,000원이다.","세전현금흐름(BTCF)는 53,500,000원이다."],"a":[4],"e":["옳음. EGI 1억 3,500만 × 30% = 4,050만원.","옳음. 0.4×3% + 0.6×5% = 1.2% + 3.0% = 4.2%.","옳음. 1억 3,500만 − 4,050만 = 9,450만원.","옳음. 1억 5,000만 × 90% = 1억 3,500만원.","틀림(정답). BTCF = NOI 9,450만 − DS 4,000만 = 5,450만원이다. 5,350만원이 아니다."],"k":"PGI → (−공실·대손) EGI → (−OE) NOI → (−DS) BTCF. 종합환원율 = Σ구성비 × 환원율.","note":"","t":"투자·금융"},{"id":"2023-39","y":2023,"n":39,"q":"다음 자료를 활용하여 공시지가기준법으로 평가한 대상토지의 시산가액(㎡당 단가)은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>대상토지 현황 : A시 B구 C동 101번지, 일반상업지역, 상업나지<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>기준시점 : 2023.04.08.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>비교표준지 : A시 B구 C동 103번지, 일반상업지역, 상업나지 2023.01.01.기준 표준지공시지가 10,000,000원/㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>지가변동률 : 1) 2023.01.01. ~ 2023.03.31. : -5.00% 2) 2023.04.01. ~ 2023.04.08. : -2.00%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>지역요인 : 비교표준지는 대상토지의 인근지역에 위치함<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>개별요인 : 대상토지는 비교표준지대비 획지조건에서 4% 열세하고, 환경조건에서 5% 우세하며, 다른 조건은 동일함<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>그 밖의 요인 보정 : 대상토지 인근지역의 가치형성요인이 유사한 정상적인 거래사례 및 평가사례 등을 고려하여 그 밖의 요인으로 20% 증액 보정함<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>상승식으로 계산할 것<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>산정된 시산가액의 천원미만은 버릴 것<\/span><\/div>","o":["11,144,000원","11,168,000원","11,190,000원","11,261,000원","11,970,000원"],"a":[3],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. 10,000,000 × 0.95 × 0.98 × 1.00(인근지역) × (0.96 × 1.05) × 1.20 = 11,261,376 → 천원 미만 절사 11,261,000원.","오답. 시점수정과 개별요인 보정을 빠뜨린 값이다."],"k":"공시지가기준법: 표준지공시지가 × 시점수정 × 지역요인 × 개별요인 × 그 밖의 요인 보정.","note":"","t":"감정평가"},{"id":"2023-40","y":2023,"n":40,"q":"감정평가에 관한 규칙의 내용으로 옳지 않은 것은?","box":"","o":["시장가치란 감정평가의 대상이 되는 토지등이 통상적인 시장에서 충분한 기간 동안 거래를 위하여 공개된 후 그 대상물건의 내용에 정통한 당사자 사이에 신중하고 자발적인 거래가 있을 경우 성립될 가능성이 가장 높다고 인정되는 대상물건의 가액을 말한다.","일체로 이용되고 있는 대상물건의 일부분에 대하여 감정평가하여야 할 특수한 목적이나 합리적인 이유가 있는 경우에는 그 부분에 대하여 감정평가할 수 있다.","감정평가는 대상물건마다 개별로 하여야 하되, 가치를 달리하는 부분은 이를 구분하여 감정평가할 수 있다.","감정평가법인은 과수원을 감정평가할 때에 공시지가기준법을 적용해야 한다.","감정평가는 기준시점에서의 대상물건의 이용상황(불법적이거나 일시적인 이용은 제외한다) 및 공법상 제한을 받는 상태를 기준으로 한다."],"a":[3],"e":["옳음. 감정평가에 관한 규칙상 시장가치의 정의이다.","옳음. 부분평가에 대한 규정이다.","옳음. 개별평가 원칙과 구분평가 규정이다.","틀림(정답). 과수원은 '거래사례비교법'을 적용해야 한다.","옳음. 현황기준 원칙이다."],"k":"과수원 = 거래사례비교법(감칙 제18조). 토지 = 공시지가기준법.","note":"","t":"감정평가"},{"id":"2024-01","y":2024,"n":1,"q":"토지의 일부로 간주되는 정착물에 해당하는 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>가식 중에 있는 수목<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>매년 경작의 노력을 요하지 않는 다년생 식물<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>건물<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>소유권보존등기된 입목<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㅁ<\/span><span>구거<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㅂ<\/span><span>경작수확물<\/span><\/div>","o":["ㄱ, ㅂ","ㄴ, ㅁ","ㄷ, ㄹ","ㄹ, ㅁ","ㅁ, ㅂ"],"a":[1],"e":["오답. 가식(假植) 중인 수목과 경작수확물(농작물)은 정착물이 아니라 동산으로 취급된다.","정답. 매년 경작 노력을 요하지 않는 다년생 식물과 구거는 토지의 일부로 간주되는 종속정착물이다.","오답. 건물과 소유권보존등기된 입목은 토지와 별개인 독립정착물이다.","오답. 등기된 입목은 독립정착물이므로 토지의 일부가 아니다.","오답. 경작수확물은 동산이다."],"k":"정착물 구분: 독립정착물(건물, 등기된 입목, 명인방법 갖춘 수목) / 종속정착물(다년생 식물, 구거, 돌담, 교량 등) / 동산(가식 중 수목, 경작수확물).","note":"","t":"부동산학 총론"},{"id":"2024-02","y":2024,"n":2,"q":"공인중개사법령상 개업공인중개사에 관한 내용으로 옳지 않은 것은?","box":"","o":["개업공인중개사는 그 사무소의 명칭에 “공인중개사사무소” 또는 “부동산중개”라는 문자를 사용하여야 한다.","개업공인중개사가 아닌 자는 중개대상물에 대한 표시ㆍ광고를 하여서는 아니 된다.","개업공인중개사는 민사집행법 에 의한 경매 및 국세징수법 그 밖의 법령에 의한 공매대상 부동산에 대한 권리분석 및 취득의 알선과 매수신청 또는 입찰신청의 대리를 할 수 있다.","개업공인중개사는 대통령령으로 정하는 기준과 절차에 따라 등록관청의 허가를 받아 그 관할 구역 외의 지역에 분사무소를 둘 수 있다.","개업공인중개사는 다른 사람에게 자기의 성명 또는 상호를 사용하여 중개업무를 하게 하거나 자기의 중개사무소등록증을 양도 또는 대여하는 행위를 하여서는 아니된다."],"a":[3],"e":["옳음. 사무소 명칭에 '공인중개사사무소' 또는 '부동산중개' 문자를 사용해야 한다.","옳음. 개업공인중개사가 아닌 자는 중개대상물에 대한 표시·광고를 할 수 없다.","옳음. 법인인 개업공인중개사 등의 겸업 범위(경매·공매 대상 부동산의 권리분석·취득알선, 매수신청 대리)에 해당한다. 단, 매수신청대리는 법원에 등록해야 한다.","틀림(정답). 분사무소는 등록관청에 '신고'하고 설치하며 허가를 받는 것이 아니다. 또한 분사무소는 법인인 개업공인중개사만 둘 수 있다.","옳음. 성명·상호 사용 허락이나 등록증 양도·대여는 금지되며 위반 시 등록취소 사유이다."],"k":"분사무소 설치는 등록관청에 '신고'한다(허가 아님). 법인인 개업공인중개사만 가능.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2024-03","y":2024,"n":3,"q":"주택법령상 주택의 정의에 관한 설명으로 옳은 것은?","box":"","o":["민영주택은 임대주택을 제외한 주택을 말한다.","세대구분형 공동주택은 공동주택의 주택 내부 공간의 일부를 세대별로 구분하여 생활이 가능한 구조로 하되, 그 구분된 공간의 일부를 구분소유 할 수 있는 주택으로서 대통령령으로 정하는 건설기준, 설치기준, 면적기준 등에 적합한 주택을 말한다.","도시형 생활주택은 300세대 미만의 국민주택규모에 해당하는 주택으로서 대통령령으로 정하는 주택을 말한다.","에너지절약형 친환경주택은 저에너지 건물 조성기술 등 대통령령으로 정하는 기술을 이용하여 에너지 사용량을 절감하거나 이산화탄소 배출량을 증대할 수 있도록 건설된주택을 말한다.","장수명 주택은 구조적으로 오랫동안 유지ㆍ관리될 수 있는 내구성을 갖추고 있어 내부 구조를 쉽게 변경할 수 없는 주택을 말한다."],"a":[2],"e":["틀림. 민영주택은 '국민주택을 제외한' 주택이다.","틀림. 세대구분형 공동주택은 구분된 공간의 일부를 구분소유 '할 수 없는' 주택이다.","정답. 도시형 생활주택은 300세대 미만의 국민주택규모 주택으로 대통령령으로 정하는 주택(소형주택·단지형 연립·단지형 다세대)이다.","틀림. 에너지절약형 친환경주택은 이산화탄소 배출량을 '저감'할 수 있도록 건설된 주택이다.","틀림. 장수명 주택은 내구성을 갖추고 입주자 필요에 따라 내부 구조를 '쉽게 변경할 수 있는' 가변성과 수리 용이성 등이 우수한 주택이다."],"k":"도시형 생활주택: 300세대 미만 국민주택규모 주택. 세대구분형 공동주택은 구분소유 '불가'.","note":"","t":"부동산학 총론"},{"id":"2024-04","y":2024,"n":4,"q":"지방세법령상 토지에 관한 재산세 과세대상 중 별도합산과세대상인 것은?","box":"","o":["공장용지ㆍ전ㆍ답ㆍ과수원 및 목장용지로서 대통령령으로 정하는 토지","국가 및 지방자치단체 지원을 위한 특정목적 사업용 토지로서 대통령령으로 정하는 토지","국토의 효율적 이용을 위한 개발사업용 토지로서 대통령령으로 정하는 토지","산림의 보호육성을 위하여 필요한 임야 및 종중 소유 임야로서 대통령령으로 정하는 임야","철거ㆍ멸실된 건축물 또는 주택의 부속토지로서 대통령령으로 정하는 부속토지"],"a":[4],"e":["오답. 일정한 공장용지·전·답·과수원·목장용지는 분리과세대상이다.","오답. 국가·지자체 지원 특정목적 사업용 토지는 분리과세대상이다.","오답. 국토의 효율적 이용을 위한 개발사업용 토지는 분리과세대상이다.","오답. 산림 보호육성용 임야 및 종중 소유 임야는 분리과세대상이다.","정답. 철거·멸실된 건축물 또는 주택의 부속토지(일정 기간)는 별도합산과세대상이다. 일반 건축물의 부속토지(기준면적 이내)도 별도합산이다."],"k":"재산세 토지 과세: 분리과세(공장용지·농지·목장용지·임야 등 정책적) / 별도합산(건축물 부속토지, 철거·멸실 건축물 부속토지 등) / 종합합산(나머지, 나대지 등).","note":"","t":"정책·조세"},{"id":"2024-05","y":2024,"n":5,"q":"건축원자재 가격의 하락에 따른 영향을 디파스퀠리-위튼(DiPasquale & Wheaton)의 사분면 모형을 통해 설명한 것으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["건축원자재 가격의 하락으로 인해 부동산개발부문에서 신규건설비용이 하락한다.","주어진 부동산자산가격 수준에서 부동산개발의 수익성이 높아지므로 신규건설량이 증가한다.","새로운 장기균형에서 균형공간재고는 감소한다.","새로운 장기균형에서 부동산공간시장의 균형임대료는 하락한다.","새로운 장기균형에서 부동산자산시장의 균형가격은 하락한다."],"a":[2],"e":["옳음. 원자재 가격 하락은 개발부문(3사분면)의 건설비용을 낮춘다.","옳음. 같은 자산가격에서 비용이 낮아지므로 개발 수익성이 높아지고 신규건설량이 증가한다.","틀림(정답). 신규건설 증가로 새로운 장기균형의 공간재고는 '증가'한다.","옳음. 공간재고 증가로 공간시장의 균형임대료는 하락한다.","옳음. 임대료 하락으로 자산시장의 균형가격(=임대료/환원율)도 하락한다."],"k":"건축비 하락 → 개발 수익성↑ → 신규건설↑ → 장기 공간재고↑ → 임대료↓ → 자산가격↓.","note":"","t":"시장·입지·지대"},{"id":"2024-06","y":2024,"n":6,"q":"토지의 분류 및 용어에 관한 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>획지(劃地)는 인위적, 자연적, 행정적 조건에 따라 다른 토지와 구별되는 가격수준이 비슷한 일단의 토지를 말한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>후보지(候補地)는 용도적 지역의 분류 중 세분된 지역 내에서 용도에 따라 전환되는 토지를 말한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>공지(空地)는 관련법령이 정하는 바에 따라 안전이나 양호한 생활환경을 확보하기 위해 건축하면서 남겨놓은 일정 면적의 토지를 말한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>갱지(更地)는 택지 등 다른 용도로 조성되기 이전 상태의 토지를 말한다.<\/span><\/div>","o":["ㄱ","ㄹ","ㄱ, ㄷ","ㄴ, ㄹ","ㄱ, ㄷ, ㄹ"],"a":[2],"e":["오답. ㄱ은 옳지만 ㄷ도 옳으므로 부족하다.","오답. ㄹ은 '소지(素地)'에 대한 설명이므로 틀렸다. 갱지는 정착물·사용수익 제한 권리가 없는 토지이다.","정답. ㄱ(획지)과 ㄷ(공지)만 옳다. ㄴ은 세분된 지역 내 전환이므로 '이행지', ㄹ은 '소지'에 대한 설명이다.","오답. ㄴ·ㄹ 모두 틀린 설명이다.","오답. ㄹ이 틀렸다."],"k":"획지=가격수준 비슷한 일단의 토지, 이행지=세분된 지역 내 전환, 공지=건축 후 남긴 빈 땅, 소지=조성 이전 토지, 갱지=나지(일본식).","note":"","t":"부동산학 총론"},{"id":"2024-07","y":2024,"n":7,"q":"부동산 중개계약에 관한 설명으로 ( )에 들어갈 것으로 옳은 것은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄱ ) : 중개의뢰인이 특정한 개업공인중개사를 정하여 그 개업공인중개사에게 한정하여 해당 중개대상물을 중개하도록 하는 중개계약<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄴ ) : 중개의뢰인이 해당 중개대상물의 중개를 불특정 다수의 개업공인중개사에게 의뢰하고 먼저 거래를 성사시킨 개업공인중개사에게 보수를 지급 하는 중개계약<\/span><\/div>","o":["ㄱ: 일반중개계약, ㄴ: 전속중개계약","ㄱ: 일반중개계약, ㄴ: 공동중개계약","ㄱ: 전속중개계약, ㄴ: 공동중개계약","ㄱ: 공동중개계약, ㄴ: 일반중개계약","ㄱ: 전속중개계약, ㄴ: 일반중개계약"],"a":[4],"e":["오답. ㄱ과 ㄴ이 바뀌었다.","오답. ㄱ은 전속중개계약이고, ㄴ은 일반중개계약이다.","오답. ㄴ은 공동중개계약이 아니다. 공동중개는 둘 이상의 중개사가 협력해 하나의 거래를 성사시키는 것이다.","오답. ㄱ은 특정인에게 한정하므로 공동중개가 아니라 전속중개이다.","정답. ㄱ: 특정 개업공인중개사 한정 → 전속중개계약, ㄴ: 불특정 다수에게 의뢰 → 일반중개계약."],"k":"전속중개 = 특정 1인 한정 / 일반중개 = 불특정 다수에게 의뢰, 먼저 성사시킨 자에게 보수 / 공동중개 = 여러 중개사가 공동 참여.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2024-08","y":2024,"n":8,"q":"지방세기본법상 부동산 관련 조세 중 시ㆍ군세(광역시의 군세 포함)에 해당하는 것으로 옳게 묶인 것은?","box":"","o":["취득세, 지방소득세","재산세, 지방소비세","재산세, 지방소득세","취득세, 등록면허세","등록면허세, 지방소비세"],"a":[2],"e":["오답. 취득세는 도세(특별시·광역시세)이다.","오답. 지방소비세는 도세(특별시·광역시세)이다.","정답. 재산세와 지방소득세는 모두 시·군세이다.","오답. 취득세와 등록면허세 모두 도세이다.","오답. 등록면허세와 지방소비세는 도세이다."],"k":"시·군세: 담배소비세, 주민세, 지방소득세, 재산세, 자동차세. 도세: 취득세, 등록면허세, 레저세, 지방소비세 등.","note":"","t":"정책·조세"},{"id":"2024-09","y":2024,"n":9,"q":"외부효과에 관한 내용으로 ( )에 들어갈 것으로 옳은 것은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>부동산의 특성 중에서 ( ㄱ )은 외부효과를 발생시킨다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>부동산시장 참여자가 자신들의 행동이 초래하는 외부효과를 의사결정에서 감안하도록 만드는 과정을 외부효과의 ( ㄴ )라 한다.<\/span><\/div>","o":["ㄱ: 부동성, ㄴ: 유동화","ㄱ: 부동성, ㄴ: 내부화","ㄱ: 인접성, ㄴ: 유동화","ㄱ: 개별성, ㄴ: 내부화","ㄱ: 개별성, ㄴ: 유동화"],"a":[1],"e":["오답. ㄴ은 유동화가 아니라 내부화이다. 유동화는 자산을 증권 등으로 전환해 현금화하는 것이다.","정답. 부동성으로 인해 외부효과가 발생하며, 그 외부효과를 당사자 의사결정에 반영시키는 과정을 '내부화'라 한다(조세, 보조금, 규제 등).","오답. 인접성도 관련은 있으나 일반적으로 외부효과의 원인은 부동성으로 본다. ㄴ도 틀렸다.","오답. 개별성은 일물일가 법칙 배제, 표준화 곤란과 관련된다.","오답. ㄱ·ㄴ 모두 틀렸다."],"k":"부동성(위치고정성) → 외부효과·국지화. 외부효과의 내부화 = 외부효과를 의사결정에 반영시키는 것.","note":"","t":"부동산학 총론"},{"id":"2024-10","y":2024,"n":10,"q":"빈집 및 소규모주택 정비에 관한 특례법상 소규모주택정비사업에 해당하지 않는 것은?","box":"","o":["빈집정비사업","자율주택정비사업","가로주택정비사업","소규모재건축사업","소규모재개발사업"],"a":[0],"e":["해당하지 않음(정답). 빈집정비사업은 소규모주택정비사업과 별도로 규정된 사업이다.","해당함. 자율주택정비사업은 단독·다세대주택을 스스로 개량 또는 건설하는 사업이다.","해당함. 가로주택정비사업은 가로구역에서 종전 가로를 유지하며 소규모로 주거환경을 개선하는 사업이다.","해당함. 소규모재건축사업은 정비기반시설이 양호한 지역에서 소규모로 공동주택을 재건축하는 사업이다.","해당함. 소규모재개발사업은 역세권·준공업지역에서 소규모로 주거환경·도시환경을 개선하는 사업이다."],"k":"빈집 및 소규모주택 정비법: '빈집정비사업'과 '소규모주택정비사업(자율·가로·소규모재건축·소규모재개발)'으로 구분.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2024-11","y":2024,"n":11,"q":"감정평가에 관한 규칙에 관한 내용으로 옳지 않은 것은?","box":"","o":["대상물건에 대한 감정평가액은 시장가치를 기준으로 결정한다.","감정평가는 기준시점에서의 대상물건의 이용상황(불법적이거나 일시적인 이용은 제외한다) 및 공법상 제한을 받는 상태를 기준으로 한다.","감정평가는 대상물건마다 개별로 하여야 한다.","감정평가법인등이 토지를 감정평가할 때에는 수익환원법을 적용해야 한다.","하나의 대상물건이라도 가치를 달리하는 부분은 이를 구분하여 감정평가할 수 있다."],"a":[3],"e":["옳음. 감정평가액은 시장가치를 기준으로 결정하는 것이 원칙이다.","옳음. 현황기준 원칙: 기준시점의 이용상황(불법·일시적 이용 제외)과 공법상 제한 상태를 기준으로 한다.","옳음. 개별평가 원칙이다.","틀림(정답). 토지는 '공시지가기준법'을 적용해야 한다. 수익환원법은 기업가치, 광업재단, 무형자산 등의 주된 방법이다.","옳음. 구분평가 규정이다."],"k":"토지의 주된 평가방법 = 공시지가기준법(감칙 제14조).","note":"","t":"감정평가"},{"id":"2024-12","y":2024,"n":12,"q":"다음 자료를 활용하여 원가법으로 평가한 대상건물의 가액은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>대상건물 : 철근콘크리트구조, 다가구주택, 연면적 350㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>기준시점 : 2024.04.05.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>사용승인시점 : 2013.06.16.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>사용승인시점의 적정한 신축공사비 : 1,000,000원/㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>건축비지수 - 기준시점 : 115 - 사용승인시점 : 100<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>경제적 내용연수 : 50년<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>감가수정방법 : 정액법(만년감가기준)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>내용연수 만료시 잔존가치 없음<\/span><\/div>","o":["313,000,000원","322,000,000원","342,000,000원","350,000,000원","352,000,000원"],"a":[1],"e":["오답. 계산 결과와 다르다.","정답. 재조달원가 1,000,000 × 115/100 = 1,150,000원/㎡. 경과연수 10년(만년감가), 잔존 40년 → 1,150,000 × 40/50 × 350㎡ = 322,000,000원.","오답. 계산 결과와 다르다.","오답. 시점수정·감가수정을 하지 않은 값(1,000,000 × 350㎡)이다.","오답. 계산 결과와 다르다."],"k":"재조달원가 = 신축공사비 × 건축비지수 보정. 만년감가: 연 단위로 경과연수 산정(10년 9개월 → 10년).","note":"","t":"감정평가"},{"id":"2024-13","y":2024,"n":13,"q":"원가방식에 관한 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>원가법과 적산법은 원가방식에 해당한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>재조달원가는 실제로 생산 또는 건설된 방법 여하에 불구하고 도급방식을 기준으로 산정한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>대상부동산이 가지는 물리적 특성인 지리적 위치의 고정성에 의해서 경제적 감가요인이 발생한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>정액법, 정률법, 상환기금법은 대상부동산의 내용연수를 기준으로 하는 감가수정방법에 해당한다.<\/span><\/div>","o":["ㄱ, ㄴ","ㄷ, ㄹ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㄹ","ㄱ, ㄴ, ㄷ, ㄹ"],"a":[4],"e":["오답. ㄷ·ㄹ도 옳다.","오답. ㄱ·ㄴ도 옳다.","오답. ㄷ도 옳다.","오답. ㄴ도 옳다.","정답. ㄱ(원가법·적산법 = 원가방식), ㄴ(도급방식 기준 산정), ㄷ(부동성 → 외부 경제적 감가), ㄹ(내용연수 기준 방법: 정액법·정률법·상환기금법) 모두 옳다."],"k":"원가방식 = 원가법(가액)+적산법(임대료). 재조달원가는 도급방식 기준. 경제적 감가는 부동성(위치고정성)에 기인.","note":"","t":"감정평가"},{"id":"2024-14","y":2024,"n":14,"q":"감정평가 실무기준상 수익방식에 관한 내용으로 옳은 것은?","box":"","o":["직접환원법은 복수기간의 순수익을 적절한 환원율로 환원하여 대상물건의 가액을 산정하는 방법을 말한다.","수익가액이란 수익분석법에 따라 산정된 가액을 말한다.","순수익은 대상물건에 귀속하는 적절한 수익으로서 가능총수익에서 운영경비를 공제하여 산정한다.","직접환원법에서 사용할 환원율은 투자결합법으로 구하는 것을 원칙으로 한다.","할인현금흐름분석법의 적용에 따른 복귀가액은 보유기간 경과 후 초년도의 순수익을 추정하여 최종환원율로 환원한 후 매도비용을 공제하여 산정한다."],"a":[4],"e":["틀림. 직접환원법은 '단일기간'의 순수익을 환원율로 환원한다. 복수기간은 할인현금흐름분석법이다.","틀림. 수익가액은 '수익환원법'으로 산정한 가액이다. 수익분석법은 임대료(수익임료) 산정방법이다.","틀림. 순수익은 '유효총수익'에서 운영경비를 공제한다. 가능총수익에서는 공실·대손을 먼저 차감해야 한다.","틀림. 환원율은 '시장추출법'으로 구하는 것이 원칙이고, 곤란한 경우 요소구성법·투자결합법 등을 활용한다.","정답. 복귀가액은 보유기간 경과 후 초년도 순수익을 최종환원율로 환원한 뒤 매도비용을 공제하여 산정한다."],"k":"직접환원법=단일기간, 수익가액=수익환원법, 순수익=유효총수익−운영경비, 환원율=시장추출법 원칙.","note":"","t":"감정평가"},{"id":"2024-15","y":2024,"n":15,"q":"부동산 가격의 제원칙에 관한 내용으로 옳지 않은 것은?","box":"","o":["부동산의 가격이 대체ㆍ경쟁관계에 있는 유사한 부동산의 영향을 받아 형성되는 것은 대체의 원칙에 해당된다.","부동산의 가격이 경쟁을 통해 초과이윤이 없어지고 적합한 가격이 형성되는 것은 경쟁의 원칙에 해당된다.","부동산의 가격이 부동산을 구성하고 있는 각 요소가 기여하는 정도에 영향을 받아 형성되는 것은 기여의 원칙에 해당된다.","부동산의 가격이 내부적인 요인에 의하여 긍정적 또는 부정적 영향을 받아 형성되는 것은 적합의 원칙에 해당된다.","부동산 가격의 제원칙은 최유효이용의 원칙을 상위원칙으로 하나의 체계를 형성하고 있다."],"a":[3],"e":["옳음. 대체의 원칙에 대한 설명이다.","옳음. 경쟁의 원칙에 대한 설명이다.","옳음. 기여의 원칙에 대한 설명이다.","틀림(정답). 적합의 원칙은 부동산이 '외부' 환경에 적합해야 최유효이용이 된다는 원칙이다. 내부 구성요소 간 조화는 균형의 원칙이다.","옳음. 제원칙은 최유효이용의 원칙을 상위원칙으로 하여 상호 유기적으로 연결되어 있다."],"k":"적합의 원칙 = 외부환경과의 조화(외부적). 균형의 원칙 = 내부 구성요소의 조화(내부적).","note":"","t":"감정평가"},{"id":"2024-16","y":2024,"n":16,"q":"감정평가에 관한 규칙상 주된 평가방법으로 수익환원법을 적용해야 하는 것은 모두 몇 개인가?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>광업재단<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>상표권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>영업권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>특허권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>전용측선이용권<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>과수원<\/span><\/div>","o":["2개","3개","4개","5개","6개"],"a":[3],"e":["오답. 5개이다.","오답. 5개이다.","오답. 5개이다.","정답(5개). 광업재단, 상표권, 영업권, 특허권, 전용측선이용권은 수익환원법이 주된 방법이다. 과수원은 거래사례비교법을 적용한다.","오답. 과수원은 수익환원법 대상이 아니다."],"k":"수익환원법이 주된 방법: 광업재단, 상표권·영업권·특허권·실용신안권·디자인권, 전용측선이용권·기타 무형자산, 기업가치. 과수원 = 거래사례비교법.","note":"","t":"감정평가"},{"id":"2024-17","y":2024,"n":17,"q":"감정평가의 지역분석에 관한 내용으로 옳은 것은?","box":"","o":["인근지역이란 감정평가의 대상이 된 부동산이 속한 지역으로서 부동산의 이용이 동질적이고 가치형성요인 중 지역요인을 공유하는 지역을 말한다.","유사지역이란 대상부동산이 속한 지역으로서 인근지역과 유사한 특성을 갖는 지역을 말한다.","동일수급권이란 대상부동산과 수요ㆍ공급 관계가 성립하고 가치 형성에 서로 영향을 미치지 않는 관계에 있는 다른 부동산이 존재하는 권역을 말한다.","지역분석은 대상지역 내 토지의 최유효이용 및 대상부동산의 가격을 판정하는 것이다.","지역분석은 개별분석 이후에 실시하는 것이 일반적이다."],"a":[0],"e":["정답. 인근지역의 정의로 옳다.","틀림. 유사지역은 대상부동산이 '속하지 않는' 지역으로서 인근지역과 유사한 특성을 갖는 지역이다.","틀림. 동일수급권은 대체·경쟁관계가 성립하고 가치형성에 서로 '영향을 미치는' 관계에 있는 부동산이 존재하는 권역이다.","틀림. 지역분석은 표준적 이용과 가격수준을 판정하는 것이고, 최유효이용과 구체적 가격 판정은 '개별분석'이다.","틀림. 지역분석을 먼저 하고 개별분석을 나중에 하는 것이 일반적이다."],"k":"인근지역=대상 속한 지역, 유사지역=대상이 속하지 않은 유사 지역, 동일수급권=대체·경쟁관계 권역. 지역분석 → 개별분석 순.","note":"","t":"감정평가"},{"id":"2024-18","y":2024,"n":18,"q":"토지와 건물로 구성된 대상건물의 연간 감가율(자본회수율)은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>거래가격 : 20억원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>순영업소득 : 연 1억 8천만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>가격구성비 : 토지 80%, 건물 20%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>토지환원율, 건물상각후환원율 : 각 연 8%<\/span><\/div>","o":["4%","5%","6%","7%","8%"],"a":[1],"e":["오답. 계산 결과와 다르다.","정답. 종합환원율 = 1.8억/20억 = 9%. 9% = 0.8×8% + 0.2×(8% + d) → 9% = 6.4% + 1.6% + 0.2d → d = 5%.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 8%는 상각후환원율이며 감가율이 아니다."],"k":"물리적 투자결합법: 종합환원율 = 토지비율×토지환원율 + 건물비율×(건물상각후환원율 + 상각률).","note":"","t":"감정평가"},{"id":"2024-19","y":2024,"n":19,"q":"토지의 특성과 감정평가에 관한 내용이다. ( )에 들어갈 것으로 옳은 것은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄱ )은 장래편익의 현재가치로 평가하게 한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄴ )은 원가방식의 평가를 어렵게 한다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>( ㄷ )은 개별요인의 분석과 사정보정을 필요하게 한다.<\/span><\/div>","o":["ㄱ: 영속성, ㄴ: 부증성, ㄷ: 개별성","ㄱ: 개별성, ㄴ: 영속성, ㄷ: 부동성","ㄱ: 영속성, ㄴ: 개별성, ㄷ: 부증성","ㄱ: 부증성, ㄴ: 영속성, ㄷ: 개별성","ㄱ: 영속성, ㄴ: 개별성, ㄷ: 부동성"],"a":[0],"e":["정답. 영속성은 장래편익의 현재가치(수익방식), 부증성은 생산비가 없어 원가방식 적용을 어렵게 하고, 개별성은 개별요인 분석·사정보정을 필요하게 한다.","오답. ㄱ은 영속성, ㄴ은 부증성, ㄷ은 개별성이다.","오답. ㄴ과 ㄷ이 바뀌었다.","오답. ㄱ과 ㄴ이 틀렸다.","오답. ㄴ은 부증성, ㄷ은 개별성이다. 부동성은 지역분석을 필요하게 한다."],"k":"영속성 → 수익방식(장래편익의 현가), 부증성 → 원가방식 적용 곤란(생산비 없음), 개별성 → 개별분석·사정보정 필요.","note":"","t":"감정평가"},{"id":"2024-20","y":2024,"n":20,"q":"대상물건에 관한 감정평가방법으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["주택으로 쓰는 층수가 4개 층으로 1개 동의 바닥면적의 합계가 700제곱미터인 건물에서 구분소유 부동산의 감정평가액은 합리적인 배분기준에 따라 토지가액과 건물가액으로 구분하여 표시할 수 있다.","주택으로 쓰는 층수가 3개 층으로 15세대가 거주할 수 있고 주택으로 쓰이는 바닥면적의 합계가 600제곱미터인 1개 동이며 구분소유가 아닌 건물의 감정평가는 토지와 건물을 일괄평가하는 것을 원칙으로 한다.","주택으로 쓰는 층수가 6개 층인 건물에서 구분소유 부동산의 감정평가는 거래사례비교법으로 하는 것을 원칙으로 한다.","주택으로 쓰는 층수가 4개 층으로 1개 동의 바닥면적의 합계가 500제곱미터인 건물에서 구분소유 부동산의 감정평가는 토지와 건물을 일괄평가하는 것을 원칙으로 한다.","구분소유 부동산을 감정평가할 때에는 층별ㆍ위치별 효용요인을 반영하여야 한다."],"a":[1],"e":["옳음. 구분소유 부동산은 일괄평가하되 필요 시 합리적 배분기준으로 토지·건물가액을 구분 표시할 수 있다.","틀림(정답). 구분소유가 아닌 건물(다가구주택 등)은 토지와 건물을 '개별'로 평가하는 것이 원칙이다.","옳음. 구분소유 부동산(아파트 등)은 거래사례비교법을 원칙으로 한다.","옳음. 구분소유 부동산(연립주택 등)은 일괄평가가 원칙이다.","옳음. 구분소유 부동산은 층별·위치별 효용요인(층별효용비 등)을 반영해야 한다."],"k":"구분소유 부동산(집합건물) = 토지·건물 일괄평가(거래사례비교법). 비구분 건물(다가구 등) = 토지·건물 개별평가 원칙.","note":"","t":"감정평가"},{"id":"2024-21","y":2024,"n":21,"q":"X노선 신역사가 들어선다는 정보가 있다. 만약 부동산 시장이 할당효율적이라면 투자자가 최대한 지불할 수 있는 정보비용의 현재가치는? (단, 제시된 가격은 개발정보의 실현 여부에 의해 발생하는 가격차이만을 반영하고, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>X노선 신역사 예정지 인근에 일단의 A 토지가 있다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>1년 후 도심에 X노선 신역사가 들어설 확률이 60%로 알려져 있다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>1년 후 도심에 X노선 신역사가 들어서면 A 토지의 가격은 5억 5,000만원, 신역사가 들어서지 않으면 2억 7,500만원으로 예상된다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>투자자의 요구수익률(할인율)은 연 10%이다.<\/span><\/div>","o":["5천만원","1억원","1억 5천만원","2억원","2억 5천만원"],"a":[1],"e":["오답. 계산 결과와 다르다.","정답. 확실성하 현가 = 5.5억/1.1 = 5억원, 불확실성하 현가 = (5.5억×0.6 + 2.75억×0.4)/1.1 = 4.4억/1.1 = 4억원. 정보가치 = 1억원.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 할인을 하지 않거나 가격 차이를 그대로 쓴 값과 혼동한 것이다."],"k":"정보가치 = 확실성하 현재가치 − 불확실성하 현재가치. 할당효율적 시장에서는 정보비용 = 정보가치.","note":"","t":"시장·입지·지대"},{"id":"2024-22","y":2024,"n":22,"q":"부동산의 수요와 공급에 관한 설명으로 옳지 않은 것은? (단, 우하향하는 수요곡선과 우상향하는 공급곡선을 가정하며, 다른 조건은 동일함)","box":"","o":["단기적으로 가격이 상승해도 부동산의 공급량이 크게 증가할 수 없기 때문에 공급이 비탄력적 이다.","부동산의 공급량은 주어진 가격 수준에서 일정기간에 판매하고자 하는 최대수량이다.","용도전환 및 개발이 가능한 장기에는 공급의 탄력성이 커진다.","부동산의 수요량은 구매능력을 갖춘 수요자들이 구매하려는 수량이므로 유효수요를 의미한다.","공급의 가격탄력성이 작을수록 수요변화시 균형가격의 변동폭은 작지만 균형거래량의 변동폭은 크다."],"a":[4],"e":["옳음. 생산에 시간이 걸려 단기 공급은 비탄력적이다.","옳음. 공급량은 주어진 가격에서 일정기간 판매하고자 하는 최대수량(사전적·의도된 개념)이다.","옳음. 장기에는 용도전환·신규개발이 가능해 공급이 더 탄력적이다.","옳음. 수요량은 구매의사와 구매능력을 갖춘 유효수요를 의미한다.","틀림(정답). 공급의 가격탄력성이 작을수록 수요변화 시 균형가격의 변동폭은 '크고' 균형거래량의 변동폭은 '작다'."],"k":"공급이 비탄력적일수록 수요 변화 시 가격 변동폭↑, 거래량 변동폭↓.","note":"","t":"시장·입지·지대"},{"id":"2024-23","y":2024,"n":23,"q":"다음 중 유량(flow)의 경제변수가 아닌 것은?","box":"","o":["소득","수출","재산","소비","투자"],"a":[2],"e":["유량. 소득은 일정 기간 동안 측정되는 유량변수이다.","유량. 수출은 기간 개념의 유량변수이다.","저량(정답). 재산(부)은 특정 시점에 측정하는 저량변수이다.","유량. 소비는 유량변수이다.","유량. 투자는 유량변수이다(신규 주택공급량도 유량)."],"k":"유량(flow) = 일정 '기간' 측정(소득·수출·소비·투자·임대료). 저량(stock) = 일정 '시점' 측정(재산·자산·인구·통화량·주택재고).","note":"","t":"시장·입지·지대"},{"id":"2024-24","y":2024,"n":24,"q":"부동산 증권에 관한 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>MPTS(Mortgage Pass-Through Securities)는 채권을 표시하는 증권으로 원리금수취권과 주택저당에 대한 채권을 모두 투자자에게 이전하는 증권이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>MBB(Mortgage-Backed Bond)는 모기지 풀(Pool)에서 발생하는 현금흐름으로 채권의 원리금이 지급되고, 모기지 풀의 현금흐름으로 채권의 원리금 지급이 안될 경우 발행자가 초과부담을 제공 하는 채권이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>CMO(Collateralized Mortgage Obligation)는 원금과 조기상환대금을 받아갈 순서를 정한 증권으로 증권별로 만기가 일치하도록 만든 자동이체형 증권이다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄹ<\/span><span>MPTB(Mortgage Pay-Through Bond)는 채권으로 발행자의 대차대조표에 부채로 표시된다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㅁ<\/span><span>금융기관은 MBS(Mortgage-Backed Securities)를 통해 자기자본비율(BIS)을 높일 수 있다.<\/span><\/div>","o":["ㄱ, ㄴ, ㄷ","ㄱ, ㄴ, ㄹ","ㄱ, ㄷ, ㅁ","ㄴ, ㄹ, ㅁ","ㄷ, ㄹ, ㅁ"],"a":[3],"e":["오답. ㄱ은 MPTS를 채권이라 해서 틀렸고(지분형), ㄷ도 틀렸다.","오답. ㄱ이 틀렸다.","오답. ㄱ·ㄷ이 틀렸다.","정답. ㄴ(MBB 초과담보·발행자 부담), ㄹ(MPTB는 채권으로 발행자 부채), ㅁ(MBS로 대출채권을 유동화해 위험자산 감소 → BIS비율 상승)이 옳다.","오답. ㄷ은 CMO가 트랜치별로 만기·이자율이 '상이'하도록 만든 증권이므로 틀렸다."],"k":"MPTS=지분형, MBB=채권형(초과담보), CMO=트랜치별 만기 상이, MPTB=혼합형(발행자 부채로 표시), MBS 발행 → 대출자산 매각 → BIS비율 상승.","note":"","t":"투자·금융"},{"id":"2024-25","y":2024,"n":25,"q":"프로젝트 파이낸싱(PF)에 관한 설명으로 옳지 않은 것은?","box":"","o":["사업주의 대차대조표에 부채로 표시되어 사업주의 부채비율에 영향을 미친다.","프로젝트 자체의 수익성과 향후 현금흐름을 기초로 개발에 필요한 자금을 조달한다.","대출기관은 시행사에게 원리금상환을 요구하고, 시행사가 원리금을 상환하지 못하면 책임준공의 의무가 있는 시공사에게 채무상환을 요구할 수 있다.","금융기관은 부동산개발사업의 사업주와 자금공여 계약을 체결한다.","프로젝트 파이낸싱의 구조는 비소구금융이 원칙이나, 제한적 소구금융의 경우도 있다."],"a":[0],"e":["틀림(정답). PF는 별도 프로젝트회사(SPC)가 차입하는 부외금융이므로 사업주의 대차대조표에 부채로 표시되지 않아 부채비율에 직접 영향을 주지 않는다.","옳음. 사업주의 신용이 아니라 프로젝트 자체의 수익성과 미래 현금흐름을 기초로 자금을 조달한다.","옳음. 국내 PF는 시공사의 책임준공·채무인수 등 신용보강이 붙는 경우가 많다.","옳음. 금융기관은 사업주(프로젝트 회사)와 자금공여 계약을 체결한다.","옳음. 비소구금융이 원칙이지만 실무상 제한적 소구금융도 있다."],"k":"PF = 부외금융(off-balance): 사업주 대차대조표에 부채로 표시되지 않음. 비소구 또는 제한적 소구.","note":"","t":"투자·금융"},{"id":"2024-26","y":2024,"n":26,"q":"다음의 조건을 가진 오피스텔의 대부비율(LTV)은? (단, 연간 기준이며, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>순영업소득 : 4천만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>매매가격 : 4억원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>부채감당률 : 2<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>저당상수 : 0.1<\/span><\/div>","o":["20%","30%","40%","50%","60%"],"a":[3],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","정답. DS = 4천만원/2 = 2천만원, 대출액 = 2천만원/0.1 = 2억원, LTV = 2억/4억 = 50%.","오답. 계산 결과와 다르다."],"k":"DCR = NOI/DS → DS = NOI/DCR, 대출액 = DS/저당상수, LTV = 대출액/가격.","note":"","t":"투자·금융"},{"id":"2024-27","y":2024,"n":27,"q":"아파트시장의 균형가격과 균형거래량에 관한 설명으로 옳지 않은 것은? (단, 완전탄력적과 완전비탄력적 조건이 없는 경우는 수요와 공급의 법칙에 따르며, 다른 조건은 동일함)","box":"","o":["수요의 증가폭이 공급의 증가폭보다 클 경우, 균형가격은 하락하고 균형거래량은 증가한다.","균형상태인 아파트시장에서 건축원자재의 가격이 상승하면 균형가격은 상승하고 균형거래량은 감소한다.","공급이 가격에 대해 완전탄력적인 경우, 수요가 증가하면 균형가격은 변하지 않고 균형거래량만 증가한다.","공급이 가격에 대해 완전비탄력적인 경우, 수요가 증가하면 균형가격은 상승하고 균형거래량은 변하지 않는다.","공급의 감소폭이 수요의 감소폭보다 클 경우, 균형가격은 상승하고 균형거래량은 감소한다."],"a":[0],"e":["틀림(정답). 수요 증가폭이 공급 증가폭보다 크면 균형가격은 '상승'하고 거래량은 증가한다.","옳음. 원자재가격 상승 → 공급 감소 → 가격 상승, 거래량 감소.","옳음. 공급곡선이 수평(완전탄력)이면 수요 증가 시 가격은 불변, 거래량만 증가한다.","옳음. 공급곡선이 수직(완전비탄력)이면 수요 증가 시 가격만 상승하고 거래량은 불변이다.","옳음. 공급 감소폭이 더 크면 가격은 상승, 거래량은 감소한다."],"k":"동시 증가 시 수요 증가폭이 크면 가격↑·거래량↑. 공급 완전탄력 → 가격 불변, 완전비탄력 → 거래량 불변.","note":"","t":"시장·입지·지대"},{"id":"2024-28","y":2024,"n":28,"q":"부동산투자회사법령상 부동산투자회사에 관한 내용으로 옳지 않은 것은?","box":"","o":["영업인가를 받거나 등록을 한 날부터 최저자본금준비기간이 지난 자기관리 부동산투자회사의 최저자본금은 70억원 이상이 되어야 한다.","최저자본금준비기간이 끝난 후에는 매 분기 말 현재 총자산의 100분의 80 이상을 부동산, 부동산 관련 증권 및 현금으로 구성하여야 한다. 이 경우 총자산의 100분의 70 이상은 부동산 (건축 중인 건축물을 포함한다)이어야 한다.","부동산투자회사는 부동산 등 자산의 운용에 관하여 회계처리를 할 때에는 금융감독원이 정하는 회계처리기준에 따라야 한다.","부동산투자회사의 상근 임원은 다른 회사의 상근 임직원이 되거나 다른 사업을 하여서는 아니 된다.","위탁관리 부동산투자회사란 자산의 투자ㆍ운용을 자산관리회사에 위탁하는 부동산투자회사를 말한다."],"a":[2],"e":["옳음. 자기관리 부동산투자회사의 최저자본금은 70억원이다(위탁관리·기업구조조정은 50억원).","옳음. 매 분기말 총자산의 80% 이상을 부동산·부동산관련 증권·현금으로, 그중 70% 이상은 부동산으로 구성해야 한다.","틀림(정답). 부동산투자회사의 회계처리기준은 '금융위원회'가 정한다.","옳음. 상근 임원의 겸직 금지 규정이다.","옳음. 위탁관리 리츠는 자산의 투자·운용을 자산관리회사에 위탁하는 명목회사이다."],"k":"리츠 회계처리기준 = '금융위원회'가 정함. 자기관리리츠 최저자본금 70억, 위탁·CR리츠 50억.","note":"","t":"투자·금융"},{"id":"2024-29","y":2024,"n":29,"q":"아파트시장에서 아파트의 수요곡선을 우측(우상향)으로 이동시킬 수 있는 요인은 모두 몇 개인가? (단, 다른 조건은 동일함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>아파트 가격의 하락<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대체 주택 가격의 상승<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>총부채원리금상환비율(DSR) 규제 완화<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>가구수 증가<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>모기지 대출(mortgage loan) 금리의 상승<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>수요자의 실질 소득 감소<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>부채감당률(DCR) 규제 강화<\/span><\/div>","o":["2개","3개","4개","5개","6개"],"a":[1],"e":["오답. 3개이다.","정답(3개). 대체주택 가격 상승, DSR 규제 완화, 가구수 증가가 수요곡선을 우측으로 이동시킨다. 아파트 가격 하락은 곡선 상의 이동(수요량 변화), 금리 상승·실질소득 감소·DCR 규제 강화는 좌측 이동 요인이다.","오답. 3개이다. 아파트 자체 가격 하락은 수요곡선의 이동이 아닌 수요량의 변화이다.","오답. 3개이다.","오답. 3개이다."],"k":"수요곡선 자체 이동 요인: 대체재 가격↑, 대출규제 완화, 가구수↑, 소득↑(정상재), 금리↓ 등 → 우측. 해당 재화 가격 변화는 곡선 상 이동.","note":"","t":"시장·입지·지대"},{"id":"2024-30","y":2024,"n":30,"q":"부동산금융에 관한 설명으로 옳은 것은? (단, 주어진 조건에 한함)","box":"","o":["콜옵션(call option)은 저당대출 대출자에게 주어진 조기상환권이다.","금융기관은 위험을 줄이기 위해 부채감당률이 1보다 작은 대출안의 작은 순서대로 대출을 실행한다.","대출수수료와 조기상환수수료를 차입자가 부담하는 경우, 차입자의 실효이자율은 조기상환시점이 앞당겨 질수록 하락한다.","대출조건이 동일할 경우 대출채권의 듀레이션(평균회수기간)은 원리금균등분할상환방식이 원금균등분할상환방식보다 더 길다.","고정금리방식의 대출에서 총상환액은 원리금균등분할상환방식이 원금균등분할상환방식보다 더 작다."],"a":[3],"e":["틀림. 조기상환권(콜옵션)은 '차입자'에게 주어진 권리이다.","틀림. 부채감당률이 1보다 '큰' 대출안을 선택해야 한다. 1보다 작으면 NOI로 DS를 감당할 수 없다.","틀림. 수수료를 차입자가 부담하면 조기상환시점이 앞당겨질수록 수수료 부담이 짧은 기간에 집중되어 실효이자율은 '상승'한다.","정답. 원리금균등분할은 원금균등분할보다 초기 원금 상환이 적어 원금 회수가 늦으므로 듀레이션이 더 길다.","틀림. 원리금균등분할은 초기 원금상환이 적어 누적 이자가 많으므로 총상환액이 원금균등분할보다 '더 크다'."],"k":"듀레이션: 원금균등 < 원리금균등 < 점증 < 만기일시. 총상환액(누적이자)은 원리금균등 > 원금균등.","note":"","t":"투자·금융"},{"id":"2024-31","y":2024,"n":31,"q":"부동산투자의 수익과 위험에 관한 설명으로 옳지 않은 것은?","box":"","o":["다양한 자산들로 분산된 포트폴리오는 체계적 위험을 감소시킨다.","위험회피형 투자자는 위험 증가에 따른 보상으로 높은 기대수익률을 요구한다.","동일한 자산들로 구성된 포트폴리오라도 자산들의 구성비중에 따라 포트폴리오의 수익과 위험이 달라진다.","시장상황에 대한 자산가격의 민감도가 높을수록 수익률의 표준편차는 커진다.","지분투자수익률은 지분투자자의 투자성과를 나타낸다."],"a":[0],"e":["틀림(정답). 분산투자로 감소시킬 수 있는 위험은 '비체계적 위험'이며, 체계적 위험은 분산투자로 줄일 수 없다.","옳음. 위험회피형 투자자는 위험이 클수록 더 높은 기대수익률(위험할증)을 요구한다.","옳음. 같은 자산이라도 구성비중(가중치)에 따라 포트폴리오의 기대수익률과 위험이 달라진다.","옳음. 시장 민감도(베타)가 높을수록 수익률 변동성(표준편차)이 커진다.","옳음. 지분투자수익률은 지분(자기자본) 투자자의 성과를 나타낸다."],"k":"분산투자로 제거 가능한 것 = 비체계적 위험(개별 위험). 체계적 위험(시장위험)은 제거 불가.","note":"","t":"투자·금융"},{"id":"2024-32","y":2024,"n":32,"q":"다음에서 설명하는 민간투자 사업방식은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>시설의 소유권은 시설의 준공과 함께 정부 등에 귀속<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>사업시행자는 일정기간의 시설관리 운영권을 획득<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>사업시행자는 시설의 최종수요자로부터 이용료를 징수하여 투자비를 회수<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>SOC시설 소유권을 민간에 넘기는 것이 부적절한 경우에 주로 사용<\/span><\/div>","o":["BOT(build-operate-transfer)방식","BTO(build-transfer-operate)방식","BLT(build-lease-transfer)방식","LBO(lease-build-operate)방식","BOO(build-own-operate)방식"],"a":[1],"e":["오답. BOT는 민간이 운영기간 동안 소유권을 가지고 운영한 뒤 기간 만료 시 소유권을 이전한다.","정답. BTO는 준공과 동시에 소유권이 정부에 귀속되고 민간이 운영권을 얻어 이용료를 징수해 투자비를 회수한다.","오답. BLT는 민간이 건설 후 정부에 임대(lease)하고 임대기간 종료 후 소유권을 이전한다.","오답. LBO는 기존 시설을 임차하여 개량·확장 후 운영하는 방식이다.","오답. BOO는 민간이 소유권을 계속 보유하며 운영하는 방식이다."],"k":"BTO: 준공 시 소유권 정부 이전 → 민간이 운영하며 사용료 징수(도로·터널). BTL: 정부가 임대료 지급(학교·기숙사).","note":"","t":"개발·관리·중개·권리분석"},{"id":"2024-33","y":2024,"n":33,"q":"다음과 같은 조건에서 대상부동산의 수익가액 산정시 적용할 환원이율 (capitalization rate)은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>가능총소득(PGI) : 연 85,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>공실상당액 : 가능총소득의 5%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>재산관리수수료 : 가능총소득의 2%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>유틸리티비용 : 가능총소득의 2%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>관리직원인건비 : 가능총소득의 3%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>부채서비스액 : 연 20,000,000원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대부비율 : 25%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출조건 : 이자율 연 4%로 28년간 매년 원리금균등분할상환(고정금리)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>저당상수(이자율 연 4%, 기간 28년) : 0.06<\/span><\/div>","o":["5.61%","5.66%","5.71%","5.76%","5.81%"],"a":[0],"e":["정답. EGI−OE 계산: NOI = 8,500만 × (1−0.05−0.02−0.02−0.03) = 7,480만원. DCR = 7,480/2,000 = 3.74. R = 3.74 × 0.25 × 0.06 = 5.61%.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다. 부채서비스액은 운영경비가 아니므로 NOI 산정 시 공제하지 않는다."],"k":"부채감당법: 환원율 = DCR × LTV × 저당상수.","note":"","t":"투자·금융"},{"id":"2024-34","y":2024,"n":34,"q":"부동산투자에 관한 설명으로 옳지 않은 것은? (단, 주어진 조건에 한함)","box":"","o":["영업비용비율(OER)은 운영경비(OE)를 유효총소득(EGI)으로 나눈 비율이다.","총부채상환비율(DTI)이 높을수록 차입자의 부채상환가능성이 낮아진다.","채무불이행률(DR)은 유효총소득(EGI)으로 운영경비(OE)와 부채서비스(DS)를 감당할 수 있는 정도를 나타낸다.","총투자수익률(ROI)은 총투자액을 순영업소득(NOI)으로 나눈 비율이다.","지분투자수익률(ROE)은 세후현금흐름(ATCF)을 지분투자액으로 나눈 비율이다."],"a":[3],"e":["옳음. 영업경비비율 = 운영경비 ÷ 유효총소득.","옳음. DTI(총부채상환비율)가 높을수록 소득 대비 상환부담이 커 상환능력이 낮아진다.","옳음. 채무불이행률 = (영업경비 + 부채서비스액) ÷ 유효총소득이다.","틀림(정답). 총투자수익률은 순영업소득(NOI)을 총투자액으로 '나눈' 비율이다. 분자·분모가 바뀌었다.","옳음. 지분투자수익률 = 세후현금흐름 ÷ 지분투자액이다."],"k":"ROI(총투자수익률) = NOI ÷ 총투자액. DR(채무불이행률) = (OE+DS) ÷ EGI.","note":"","t":"투자·금융"},{"id":"2024-35","y":2024,"n":35,"q":"부동산 마케팅활동에 관한 설명으로 옳지 않은 것은?","box":"","o":["시장세분화란 부동산시장에서 마케팅활동을 수행하기 위하여 구매자의 집단을 세분화하는 것이다.","세분시장은 그 규모와 구매력 등의 특성이 측정될 수 있어야 한다.","세분시장은 개념적으로 구분될 수 있으며 마케팅믹스요소에 대해 동일하게 반응한다.","표적시장이란 세분화된 시장 중 가장 효과적인 성과가 기대되어 마케팅활동의 수행대상이 되는 시장을 말한다.","포지셔닝은 표적시장에서 고객의 욕구를 파악하여 경쟁제품과 차별화된 자사제품의 개념을 정해 이를 소비자의 지각 속에 적절히 위치시키는 것이다."],"a":[2],"e":["옳음. 시장세분화는 구매자 집단을 동질적 하위시장으로 나누는 것이다.","옳음. 측정가능성 요건이다.","틀림(정답). 세분시장은 마케팅믹스 요소에 대해 서로 '다르게' 반응해야 세분화의 의미가 있다(차별화 가능성).","옳음. 표적시장의 정의이다.","옳음. 포지셔닝의 정의이다."],"k":"효과적 시장세분화 요건: 측정가능성·접근가능성·실질성(규모)·차별적 반응. 세분시장은 마케팅믹스에 '다르게' 반응해야 함.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2024-36","y":2024,"n":36,"q":"부동산투자분석에 관한 내용으로 옳지 않은 것은?","box":"","o":["동일한 현금흐름을 가지는 투자안이라도 투자자의 요구수익률에 따라 순현재가치는 달라질 수 있다.","서로 다른 내부수익률을 가지는 두 자산에 동시에 투자하는 투자안의 내부수익률은 각 자산의 내부수익률을 더한 것과 같다.","동일한 투자안에 대해 내부수익률이 복수로 존재할 수 있다.","내부수익률법에서는 내부수익률과 요구수익률을 비교하여 투자의사결정을 한다.","투자규모에 차이가 나는 상호배타적인 투자안을 검토할 때, 순현재가치법과 수익성지수법을 통한 의사결정이 달라질 수 있다."],"a":[1],"e":["옳음. 할인율(요구수익률)이 다르면 NPV도 달라진다.","틀림(정답). 두 자산 결합 투자안의 IRR은 각 IRR의 합이 아니다. 가치가산의 원칙은 NPV에만 성립한다.","옳음. 현금흐름의 부호가 여러 번 바뀌면 IRR이 복수로 존재하거나 없을 수 있다.","옳음. IRR ≥ 요구수익률이면 채택한다.","옳음. 규모가 다른 상호배타적 투자안은 NPV법(절대액)과 PI법(비율)의 결론이 달라질 수 있다."],"k":"가치가산원칙은 NPV에만 성립: NPV(A+B) = NPV(A)+NPV(B). IRR은 가산되지 않음.","note":"","t":"투자·금융"},{"id":"2024-37","y":2024,"n":37,"q":"부동산관리의 위탁관리방식에 관한 설명으로 옳지 않은 것은?","box":"","o":["신뢰도가 높은 업체를 선정하는 것이 중요하다.","관리업무의 전문성과 효율성을 제고할 수 있다.","오피스빌딩과 같은 대형건물의 관리에 유용하다.","관리환경 변화에 대한 예측과 적응에 유리하다.","자기관리방식보다 기밀유지 측면에서 유리하다."],"a":[4],"e":["옳음. 위탁관리는 외부업체에 맡기므로 신뢰도 높은 업체 선정이 중요하다.","옳음. 전문업체에 의한 관리로 전문성·효율성이 높다.","옳음. 대형 오피스빌딩 등 복잡한 관리에 적합하다.","옳음. 전문업체는 시장 변화에 대한 예측·적응력이 높다.","틀림(정답). 외부업체가 관여하므로 자기관리방식보다 기밀유지 측면에서 '불리'하다."],"k":"위탁관리 장점: 전문성·효율성, 대형건물 적합, 환경 변화 적응. 단점: 기밀유지 불리, 신뢰도 문제, 애호정신 약함.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2024-38","y":2024,"n":38,"q":"부동산투자에서 (ㄱ)타인자본을 활용하지 않은 경우와 (ㄴ)타인자본을 40% 활용하는 경우, 각각의 1년간 자기자본수익률(%)은? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>부동산 매입가격 : 10,000만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>1년 후 부동산 처분<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>순영업소득(NOI) : 연 500만원(기간 말 발생)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>보유기간 동안 부동산가격 상승률 : 연 2%<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>대출조건 : 이자율 연 4%, 대출기간 1년, 원리금은 만기일시상환<\/span><\/div>","o":["ㄱ: 7.0, ㄴ: 7.0","ㄱ: 7.0, ㄴ: 8.0","ㄱ: 7.0, ㄴ: 9.0","ㄱ: 7.5, ㄴ: 8.0","ㄱ: 7.5, ㄴ: 9.0"],"a":[2],"e":["오답. ㄱ은 맞지만 레버리지를 쓰면 수익률이 달라진다.","오답. ㄴ 계산이 틀렸다.","정답. ㄱ: (500+200)/10,000 = 7%. ㄴ: 대출 4,000만원, 이자 160만원 → (500+200−160)/6,000 = 540/6,000 = 9%. 총수익률(7%) > 이자율(4%)이므로 정(+)의 레버리지가 발생한다.","오답. 가치상승분(200만원)을 제대로 반영하면 ㄱ은 7%이다.","오답. ㄱ은 7%이다."],"k":"자기자본수익률 = (NOI + 가치상승분 − 이자) ÷ 자기자본.","note":"","t":"투자·금융"},{"id":"2024-39","y":2024,"n":39,"q":"다음은 매장의 매출액이 손익분기점 매출액 이하이면 기본임대료만 지급하고, 손익분기점 매출액 초과이면 초과매출액에 대하여 일정 임대료율을 적용한 추가임대료를 기본임대료에 가산하여 임대료를 지급하는 비율임대차(percentage lease) 방식의 임대차계약의 조건이다. 이 임대차계약 에서 계약기간 동안 지급할 것으로 예상되는 임대료의 합계는? (단, 주어진 조건에 한함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>계약기간 : 1년(1월 ∼ 12월)<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>매장 임대면적 : 200㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>임대면적당 기본임대료 : 월 5만원/㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>손익분기점 매출액 : 월 2,000만원<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>각 월별 예상매출액 - 1월 ~ 7월 : 8만원/㎡ - 8월 ~ 12월 : 20만원/㎡<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>손익분기점 초과시 초과매출액에 대한 임대료율 : 10%<\/span><\/div>","o":["11,000만원","11,500만원","12,000만원","12,500만원","13,000만원"],"a":[4],"e":["오답. 계산 결과와 다르다.","오답. 계산 결과와 다르다.","오답. 기본임대료(5만×200×12 = 12,000만원)만 계산한 값이다. 8~12월 추가임대료를 빠뜨렸다.","오답. 계산 결과와 다르다.","정답. 기본 12,000만원. 1~7월 매출 1,600만원(8만×200)으로 손익분기점 이하 → 추가 없음. 8~12월 매출 4,000만원 → (4,000−2,000)×10% = 200만원 × 5개월 = 1,000만원. 합계 13,000만원."],"k":"비율임대차: 임대료 = 기본임대료 + (매출액 − 손익분기점 매출액) × 추가임대료율.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2024-40","y":2024,"n":40,"q":"부동산개발방식에 관한 설명으로 옳은 것을 모두 고른 것은?","box":"<div class=\"bi\"><span class=\"bl\">ㄱ<\/span><span>토지소유자와의 약정에 의해 수익증권을 발행하고 수익증권의 소유자에게 수익을 배당하는 방식<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄴ<\/span><span>원래의 토지소유자에게 사업 후 사업에 소요된 비용 등을 제외하고 면적비율에 따라 돌려주는 방식<\/span><\/div><div class=\"bi\"><span class=\"bl\">ㄷ<\/span><span>공익성이 강하고 대량공급이 가능한 택지개발사업에서 주로 수행하는 방식<\/span><\/div>","o":["ㄱ: 신탁방식, ㄴ: 환지방식, ㄷ: 공영개발방식","ㄱ: 신탁방식, ㄴ: 수용방식, ㄷ: 공영개발방식","ㄱ: 사업위탁방식, ㄴ: 환지방식, ㄷ: 민간개발방식","ㄱ: 사업위탁방식, ㄴ: 수용방식, ㄷ: 민간개발방식","ㄱ: 컨소시엄방식, ㄴ: 수용방식, ㄷ: 민관협력개발방식"],"a":[0],"e":["정답. ㄱ: 토지신탁(신탁방식), ㄴ: 환지방식, ㄷ: 공영개발방식.","오답. ㄴ은 토지로 돌려주므로 수용방식이 아니라 환지방식이다.","오답. 사업위탁방식은 소유권 이전 없이 사업만 위탁하고 수수료를 지급하는 방식이다. ㄷ도 민간개발이 아니다.","오답. ㄱ·ㄴ·ㄷ 모두 틀렸다.","오답. 컨소시엄방식은 대규모 사업에서 여러 회사가 공동 참여하는 방식이다."],"k":"신탁방식=수익증권·배당, 환지방식=비용 제외 후 토지로 돌려줌, 공영개발=공익성·대량공급(택지개발), 수용방식=보상 후 전면매수.","note":"","t":"개발·관리·중개·권리분석"},{"id":"2025-01","y":2025,"n":1,"q":"토지에 관한 설명으로 옳지 않은 것은?","box":"","o":["“토지의 표시”란 지적공부에 토지의 소재ㆍ지번(地番)ㆍ지목(地目)ㆍ면적ㆍ경계 또는 좌표를 등록한 것을 말한다.","“지번”이란 필지에 부여하여 지적공부에 등록한 번호를 말한다.","“토지의 이동(異動)”이란 홍수나 산사태 등으로 인해 토지의 지형이 변경된 것을 말한다.","“합병”이란 지적공부에 등록된 2필지 이상을 1필지로 합하여 등록하는 것을 말한다.","“분할”이란 지적공부에 등록된 1필지를 2필지 이상으로 나누어 등록하는 것을 말한다."],"a":[2],"e":["옳음. 「공간정보의 구축 및 관리 등에 관한 법률」상 '토지의 표시'는 지적공부에 소재·지번·지목·면적·경계 또는 좌표를 등록한 것이다.","옳음. 지번은 필지에 부여하여 지적공부에 등록한 번호이며, 필지를 특정하는 식별번호 역할을 한다.","틀림(정답). '토지의 이동'이란 토지의 표시를 새로 정하거나 변경 또는 말소하는 것으로 신규등록·등록전환·분할·합병·지목변경·등록말소·축척변경 등을 말한다. 홍수·산사태로 인한 지형의 물리적 변화 자체를 뜻하지 않는다.","옳음. 합병은 지적공부에 등록된 2필지 이상을 1필지로 합하여 등록하는 것이다.","옳음. 분할은 지적공부에 등록된 1필지를 2필지 이상으로 나누어 등록하는 것이다."],"k":"토지의 이동 = 토지의 표시를 새로 정하거나 변경·말소하는 것(신규등록·등록전환·분할·합병·지목변경 등). 자연적 지형 변화가 아니다.","note":"","t":"부동산학 총론"},{"id":"2025-02","y":2025,"n":2,"q":"준부동산(準不動産)에 관한 설명으로 옳지 않은 것은?","box":"","o":["준부동산은 특정의 부동산, 동산과 부동산의 집단을 말한다.","공장재단이란 공장에 속한 일정한 기업용 재산으로 구성되는 일단(一團)의 기업재산으로 「공장 및 광업재단 저당법」에 따라 소유권과 저당권의 목적이 되는 것을 말한다.","광업재단이란 광업권과 광업권에 기하여 광물을 채굴ㆍ취득하기 위한 각종 설비 및 이에 부속하는 사업의 설비로 구성되는 일단의 기업재산으로 「공장 및 광업재단 저당법」에 따라 소유권과 저당권의 목적이 되는 것을 말한다.","입목이란 토지에 부착된 수목의 집단으로서 그 소유자가 「입목에 관한 법률」에 따라 소유권보존등기를 받은 것을 말하며, 토지소유권 또는 지상권 처분의 효력이 미친다.","「수산업법」의 규정에 따른 어업권이란 면허를 받아 어업을 경영할 수 있는 권리를 말한다."],"a":[0,3],"e":["틀림(정답). 준부동산은 '특정의 부동산'이 아니라, 부동산이 아니지만 등기·등록 등 공시방법을 갖춰 부동산에 준하여 취급하는 특정의 동산(자동차·선박·항공기·건설기계 등)이나 동산과 부동산의 집단(공장재단·광업재단)을 말한다.","옳음. 공장재단은 공장에 속한 일정한 기업용 재산으로 구성된 일단의 기업재산으로서 공장 및 광업재단 저당법에 따라 소유권과 저당권의 목적이 된다.","옳음. 광업재단은 광업권과 이에 기한 채굴·취득 설비 및 부속설비로 구성된 일단의 기업재산으로 소유권·저당권의 목적이 된다.","틀림(정답). 입목에 관한 법률에 따라 소유권보존등기를 받은 입목은 토지와 분리된 독립 부동산이므로 토지소유권 또는 지상권 처분의 효력이 입목에 '미치지 않는다'(입목법 제3조 제3항). 지문 후단이 틀렸다.","옳음. 수산업법상 어업권은 면허를 받아 어업을 경영할 수 있는 권리이며, 토지에 관한 규정이 준용되는 준부동산의 하나로 분류된다."],"k":"준부동산: 부동산은 아니지만 등기·등록 등 공시방법을 갖춰 부동산에 준해 취급하는 '특정 동산 또는 동산과 부동산의 집단'. 입목등기를 한 입목은 토지와 독립된 부동산이다.","note":"교재 정답은 ①이지만 교재 해설에서도 ④를 틀린 지문으로 설명하고 있어, 이 앱에서는 ①·④ 모두 정답으로 처리합니다.","t":"부동산학 총론"},{"id":"2025-03","y":2025,"n":3,"q":"다음 조건에 모두 해당하는 것은?","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>토지 위에 건물 등의 정착물이 없다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>사용을 제약하는 권리의 부착이 없다.<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>수익을 제약하는 권리의 부착이 없다.<\/span><\/div>","o":["갱지(更地)","저지(底地)","나지(裸地)","공지(空地)","필지(筆地)"],"a":[0,2],"e":["정답. 갱지는 일본에서 쓰이는 용어로 건물 등 정착물이 없고 사용·수익을 제약하는 권리의 부착도 없는 택지를 말한다.","오답. 저지(底地)는 지상권 등 타인의 권리가 설정되어 있는 토지의 소유권(바닥 땅)을 말하므로 사용·수익을 제약하는 권리가 부착되어 있다.","정답. 나지는 토지에 건물이나 그 밖의 정착물이 없고 지상권 등 토지의 사용·수익을 제한하는 사법상의 권리가 설정되어 있지 않은 토지이다(표준지조사평가기준). 조건을 모두 충족한다.","오답. 공지(空地)는 건폐율 등의 제한으로 한 필지 안에서 건물을 제외하고 남은 빈 부분의 토지를 말한다.","오답. 필지는 하나의 지번이 붙는 토지의 등록단위로, 법적 개념이며 정착물·권리 유무와 무관하다."],"k":"갱지(일본식 용어) = 나지: 정착물이 없고 사용·수익을 제한하는 사법상 권리도 없는 토지.","note":"교재 해설에 따라 ①(갱지)과 ③(나지) 모두 정답으로 처리합니다.","t":"부동산학 총론"},{"id":"2025-04","y":2025,"n":4,"q":"용도지역 내에서 용도변경이 진행되고 있는 토지는?","box":"","o":["후보지","이행지","포락지","선하지","휴한지"],"a":[1],"e":["오답. 후보지는 택지지역·농지지역·임지지역 상호 간에 다른 지역으로 전환되고 있는 지역의 토지를 말한다(예: 농지→택지).","정답. 이행지는 택지지역 내에서 주거지→상업지처럼 같은 종별 지역 내 세부 용도가 변경되고 있는 토지이다.","오답. 포락지는 지적공부에 등록된 토지가 물에 침식되어 수면 밑으로 잠기거나 하천으로 변한 토지를 말한다.","오답. 선하지는 고압선 아래의 토지로 송전선로로 인해 이용이 제한되어 가치가 감소할 수 있는 토지이다.","오답. 휴한지는 지력 회복을 위해 정상적으로 경작을 쉬고 있는 농지를 말한다."],"k":"이행지 = 같은 용도지역 '내에서' 세부 용도가 바뀌는 토지(주거→상업). 후보지 = 용도지역 '간' 전환(농지→택지).","note":"","t":"부동산학 총론"},{"id":"2025-05","y":2025,"n":5,"q":"부동산소유권의 사적제한에 해당하는 것은?","box":"","o":["지역권","귀속권","과세권","수용권","경찰권"],"a":[0],"e":["정답. 지역권은 자기 토지(요역지)의 편익을 위해 타인 토지(승역지)를 이용하는 권리로 당사자 간 계약으로 설정되는 사적제한이다.","오답. 귀속권(escheat)은 상속인이 없는 부동산이 국가에 귀속되는 공적제한이다.","오답. 과세권은 정부가 부동산에 세금을 부과하고 체납 시 처분할 수 있는 공적제한이다.","오답. 수용권은 공익사업을 위해 정당한 보상을 지급하고 사유재산을 강제로 취득하는 공적제한이다.","오답. 경찰권은 공공의 안전·보건·복리를 위해 용도지역제·건축규제 등으로 소유권 행사를 제한하는 공적제한이다."],"k":"공적제한(정부): 경찰권·수용권·과세권·귀속권 / 사적제한(계약 등): 지역권·저당권·유치권 등.","note":"","t":"부동산학 총론"},{"id":"2025-06","y":2025,"n":6,"q":"부동산의 특성에 관한 설명으로 옳지 않은 것은?","box":"","o":["부동산은 물리적 구성요소들의 결합체일 뿐만 아니라 여러가지 경제적ㆍ사회적 특성의 결합체이다.","토지의 개별성으로 인해 일물일가의 법칙이 적용되지 않고, 부동산상품 간에 완전한 대체는 불가능하다.","토지거래허가구역의 지정이나 해제 등으로 인해 주택가격이 하락하거나 상승하는 것은 경제적 위치의 변화에 따른 것이다.","토지는 용도전환 및 합병ㆍ분할이 가능하며, 두 개 이상의 용도가 병존할 수도 있다.","토지의 부동성으로 인해 부동산시장을 국지화시키며, 이로 인해 부동산의 가치는 주변 환경의 영향을 많이 받는다."],"a":[2],"e":["옳음. 부동산은 물리적 측면뿐 아니라 경제적·법률적·사회적 특성이 결합된 복합개념이다.","옳음. 개별성으로 인해 동일한 부동산이 없으므로 일물일가의 법칙이 적용되지 않고 완전한 대체도 불가능하다.","틀림(정답). 토지거래허가구역의 지정·해제는 공법상 규제의 변화이므로 '행정적 위치'의 변화이다. 경제적 위치는 교통망·소득수준 등 경제적 여건의 변화로 달라진다.","옳음. 토지의 용도의 다양성·병합분할 가능성으로 용도전환, 합병·분할, 복수 용도의 병존(예: 주상복합)이 가능하다.","옳음. 부동성으로 부동산시장은 국지화되고, 주변 환경(외부효과)의 영향을 크게 받는다."],"k":"토지거래허가구역 지정·해제, 용도지역 변경 등 공법상 규제 변화 → '행정적 위치'의 변화.","note":"","t":"부동산학 총론"},{"id":"2025-07","y":2025,"n":7,"q":"부동산 매매시장에서 수요와 공급이 동시에 변화하는 경우, 시장균형의 변화에 관한 설명으로 옳지 않은 것은? (단, 수요곡선은 우하향하고, 공급곡선은 우상향하며, 다른 조건은 동일함)","box":"","o":["수요와 공급이 동시에 증가하는 경우, 공급의 증가폭이 수요의 증가폭보다 크면, 균형 가격은 하락하고 균형거래량은 증가한다.","수요와 공급이 동시에 감소하는 경우, 수요의 감소폭이 공급의 감소폭보다 크면, 균형 가격은 하락하고 균형거래량은 감소한다.","수요와 공급이 동시에 증가하는 경우, 수요의 증가폭과 공급의 증가폭이 같다면, 균형 가격은 불변이고 균형거래량은 증가한다.","수요와 공급이 동시에 감소하는 경우, 공급의 감소폭이 수요의 감소폭보다 크면, 균형 가격은 하락하고 균형거래량도 감소한다.","수요와 공급이 동시에 증가하는 경우, 수요의 증가폭이 공급의 증가폭보다 크면, 균형 가격은 상승하고 균형거래량도 증가한다."],"a":[3],"e":["옳음. 동시 증가 시 거래량은 증가하고, 공급 증가폭이 더 크면 가격은 하락한다.","옳음. 동시 감소 시 거래량은 감소하고, 수요 감소폭이 더 크면 가격은 하락한다.","옳음. 증가폭이 같으면 가격은 불변이고 거래량만 증가한다.","틀림(정답). 동시 감소에서 공급의 감소폭이 더 크면 공급 부족 효과가 우세하므로 균형가격은 '상승'하고 거래량은 감소한다.","옳음. 수요 증가폭이 더 크면 가격은 상승하고 거래량도 증가한다."],"k":"수요·공급이 동시에 감소: 거래량은 반드시 감소, 가격은 감소폭이 큰 쪽이 결정(공급 감소폭↑→가격 상승).","note":"","t":"시장·입지·지대"},{"id":"2025-08","y":2025,"n":8,"q":"다음 조건하에서 거미집이론(Cob-web theory)에 의한 부동산시장 A와 B의 모형 형태와 A시장과 B시장 상품의 관계는? (단, X축은 수량, Y축은 가격이고, 가격 변화에 수요는 즉각 반응하지만 공급은 시간적인 차이를 두고 반응하며, 다른 조건은 동일함)","box":"<div class=\"bi\"><span class=\"bl\">•<\/span><span>A시장: 수요의 가격탄력성은 0.9, 공급의 가격탄력성은 1.2<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>B시장: 수요곡선의 기울기는 -0.8, 공급곡선의 기울기는 0.3<\/span><\/div><div class=\"bi\"><span class=\"bl\">•<\/span><span>A시장의 상품가격이 4% 하락하면, B시장의 상품수요가 3% 감소함 A시장 B시장 A와 B시장 상품의 관계<\/span><\/div>","o":["수렴형 순환형 보완재","수렴형 발산형 보완재","발산형 수렴형 대체재","발산형 발산형 대체재","수렴형 수렴형 대체재"],"a":[3],"e":["오답. A시장은 수요탄력성(0.9) < 공급탄력성(1.2)이므로 수렴형이 아니라 발산형이다.","오답. A시장이 발산형이므로 틀리며, 두 상품의 관계도 보완재가 아니다.","오답. A시장은 발산형으로 맞지만, B시장은 |수요기울기 0.8| > |공급기울기 0.3|이므로 수렴형이 아닌 발산형이다.","정답. A: 탄력성 기준 발산형, B: 기울기 기준 발산형. A가격
